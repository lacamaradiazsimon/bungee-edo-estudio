  sb.append(grupo(UNI + "es", temas.map(t => [t.id, `§${idx(t.id)} ${t.titulo}`]), v => sel.has(v), v => sel.has(v) ? sel.delete(v) : sel.add(v)),
    grupo("Cantidad", [[5, "5"], [10, "10"], [20, "20"], [999, "Todas"]], v => v === cant, v => cant = v),
    grupo("Modo", [["mix", "Mezcladas"], ["err", `Solo las que fallé (${fall.length})`]], v => v === modo, v => modo = v),
    node(`<div class="row"></div>`));
  sb.lastChild.append(btn("Comenzar", () => {
    let pool = Q.map((q, i) => ({...q, i})).filter(q => sel.has(q.tema));
    if (modo === "err") pool = pool.filter(q => fall.includes(q.i));
    if (!pool.length) return alert("No hay preguntas con esa selección.");
    pool.sort(() => Math.random() - .5); correr(pool.slice(0, cant));
  }, true));
  main.append(c);
  const hist = store.get("hist", {});
  if (Object.keys(hist).length) main.append(hoja("Historial acumulado", hist, true));
}
function hoja(titulo, st, reset) {
  const ok = Object.values(st).reduce((a, s) => a + s.ok, 0), n = Object.values(st).reduce((a, s) => a + s.n, 0), flojos = [];
  const rows = Object.entries(st).map(([id, s]) => { const p = s.ok / s.n; if (p < 0.6) flojos.push(id);
    return `<tr><td><span class="sec">§${idx(id)}</span>${esc(tituloTema(id))}</td><td class="mono" style="text-align:right;${p < 0.6 ? "color:var(--pen);font-weight:600" : ""}">${s.ok}/${s.n}</td></tr>`; }).join("");
  const c = node(`<section class="sheet">${sh(esc(titulo))}<div class="sb">
    <div class="row" style="gap:16px;align-items:baseline;margin-bottom:12px"><span class="big">${ok}<small>/${n}</small></span><span class="pen" style="font-size:1.7rem">nota estimada ${fmtN(notaCL(n ? ok / n : 0))}</span></div>
    <div class="tbl"><table><tr><th>${esc(UNI)}</th><th style="text-align:right">Correctas</th></tr>${rows}</table></div>
    <p class="lbl" style="margin-top:8px">Escala 1 a 7 con 60 % de exigencia</p></div></section>`);
  if (flojos.length) { const d = node(`<div class="ojo" style="margin-top:14px"><span class="lbl">Repasa primero</span><div class="row" style="margin-top:6px"></div></div>`);
    flojos.forEach(id => d.querySelector(".row").append(btn(`§${idx(id)} ${tituloTema(id)} →`, () => { temaActual = id; go("temas"); }))); c.querySelector(".sb").append(d); }
  if (reset) { const r = node(`<div class="row" style="margin-top:12px"></div>`); r.append(btn("Borrar historial", () => { if (confirm("¿Borrar historial?")) { store.set("hist", {}); store.set("fallidas", []); go("quiz"); } })); c.querySelector(".sb").append(r); }
  return c;
}
function correr(qs) {
  let k = 0; const ses = {}, hist = store.get("hist", {}), fall = new Set(store.get("fallidas", []));
  const show = () => {
    main.innerHTML = "";
    if (k >= qs.length) { main.append(hdr("Autoevaluación · Resultado", "Hoja de resultados", "")); main.append(hoja("Esta ronda", ses));
      const r = node(`<div class="row"></div>`); r.append(btn("Otra ronda", () => go("quiz"), true), btn("Ir a preguntas de práctica", () => go("evals"))); main.append(r); side(); tex(main); return; }
    const q = qs[k], dif = "●".repeat(q.dif || 1) + "○".repeat(3 - (q.dif || 1));
    const c = node(`<section class="sheet">${sh(`<span class="mono" style="font-size:.9rem">Pregunta ${k + 1} de ${qs.length} <span style="color:var(--muted);font-weight:400">· §${idx(q.tema)} · Dificultad ${dif}</span></span>`, q.pts ? `<span class="mono">(${esc(q.pts)} pts)</span>` : "")}<div class="sb"><div class="serif" style="font-size:1.35rem;line-height:1.45;margin-bottom:10px">${md(q.q)}</div><div class="ops"></div><div class="fb"></div><div class="row sp" style="margin-top:14px"><span></span></div></div></section>`);
    const fb = c.querySelector(".fb"), ops = c.querySelector(".ops"), foot = c.querySelector(".row.sp");
    const next = btn(k + 1 < qs.length ? "Siguiente pregunta →" : "Ver hoja de resultados", () => { k++; show(); }, true); next.classList.add("hide"); foot.append(next);
    const mark = ok => {
      for (const o of [ses, hist]) { o[q.tema] = o[q.tema] || {ok: 0, n: 0}; o[q.tema].n++; if (ok) o[q.tema].ok++; }
      ok ? fall.delete(q.i) : fall.add(q.i); store.set("hist", hist); store.set("fallidas", [...fall]);
      fb.innerHTML = `<div style="border-top:1px solid var(--ink);padding-top:12px;margin-top:10px"><span class="serif" style="font-style:italic;font-size:1.15rem">${ok ? "Correcto." : "Incorrecto."}</span> ${md(q.exp)}</div>`;
      next.classList.remove("hide"); side(); tex(fb);
    };
    if (q.tipo === "num") {
      const r = node(`<div class="g-row"><label>Tu respuesta</label><input type="text" inputmode="decimal" placeholder="ej. 4,2"></div>`), i = r.querySelector("input");
      const b = btn("Responder", () => { const x = U.num(i.value); if (isNaN(x)) return; b.disabled = i.disabled = true; const ok = Math.abs(x - q.ok) <= (q.tol ?? 1e-6);
        if (!ok) r.append(node(`<span class="pen">esperado: ${U.fmt(q.ok, 4)}</span>`)); mark(ok); });
      i.addEventListener("keydown", e => e.key === "Enter" && b.click()); r.append(b); ops.append(r);
    } else {
      (q.op || []).map((t, j) => ({t, j})).sort(() => Math.random() - .5).forEach((o, pos) => {
        const b = node(`<button class="opt"><span class="bub">${"abcdefgh"[pos]})</span><span class="tx">${inl(o.t)}</span><span class="tg"></span></button>`);
        b.onclick = () => { ops.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.j === q.ok) { x.classList.add("ok"); x.querySelector(".tg").textContent = "✓ correcta"; } });
          if (o.j !== q.ok) { b.classList.add("bad"); b.querySelector(".tg").textContent = "✗ tu respuesta"; } mark(o.j === q.ok); };
        b.dataset.j = o.j; ops.append(b);
      });
    }
    main.append(c); tex(main);
  };
  show();
}

/* ---------- preguntas de practica ---------- */
function vEvals(pre) {
  const hechas = new Set(store.get("hechas", [])); let ft = pre?.tema || "todos", ff = "todas";
  const fuentes = [...new Set(E.map(e => e.fuente))];
  main.append(hdr(`Preguntas de práctica · ${E.length} preguntas`, "Banco de preguntas de práctica", "Hay dos tipos: preguntas de controles anteriores con pauta oficial, y preguntas probables del profesor en la validación y el control, con resolución propuesta (se indica en cada una). Respóndelas en voz alta antes de abrir la solución."));
  const freq = {}; E.forEach(e => freq[e.tema] = (freq[e.tema] || 0) + 1); const mx = Math.max(1, ...Object.values(freq));
  const top = node(`<section style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end"><div><div class="lbl" style="margin-bottom:6px">Frecuencia por ${esc(UNI.toLowerCase())}</div>${Object.entries(freq).sort((a, b) => b[1] - a[1]).map(([id, n]) => `<div class="freq"><span><span class="sec">§${idx(id)}</span>${esc(tituloTema(id))}</span><div class="hbar"><i style="width:${100 * n / mx}%"></i></div><span class="mono" style="text-align:right">${n}</span></div>`).join("")}</div>
    <div class="sheet" style="padding:14px 20px"><div class="lbl">Resueltas</div><div class="big" id="prog"></div></div></section>`);
  main.append(top);
  const fil = node(`<div class="row"></div>`);
  [["todos", "Todos"], ...Object.keys(freq).map(id => [id, `§${idx(id)} ${tituloTema(id)}`])].forEach(([id, l]) => { const b = node(`<button class="chip${id === ft ? " on" : ""}">${esc(l)}</button>`); b.onclick = () => { ft = id; fil.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); b.classList.add("on"); lista(); }; fil.append(b); });
  if (fuentes.length > 1) { const s = node(`<select aria-label="Filtrar por evaluación"><option value="todas">Todas las evaluaciones</option>${fuentes.map(f => `<option>${esc(f)}</option>`).join("")}</select>`); s.onchange = () => { ff = s.value; lista(); }; fil.append(s); }
  main.append(fil);
  const cont = node(`<div style="display:flex;flex-direction:column;gap:30px"></div>`); main.append(cont);
  const prog = () => $("#prog").innerHTML = `${hechas.size}<small>/${E.length}</small>`;
  function lista() {
    cont.innerHTML = ""; prog();
    E.map((e, i) => ({...e, i})).filter(e => (ft === "todos" || e.tema === ft) && (ff === "todas" || e.fuente === ff)).forEach(e => {
      const of = e.confianza === "pauta";
      const rub = (e.rubrica || []).length ? `<div class="tbl"><table><tr><th>Criterio de la pauta</th><th style="text-align:right">Pts</th></tr>${e.rubrica.map(r => `<tr><td>${inl(r.criterio)}</td><td class="mono" style="text-align:right">${esc(r.pts)}</td></tr>`).join("")}</table></div>`
        : (e.puntaje_max || []).length ? `<div class="lbl" style="color:var(--acc)">Lo que suma puntos</div>${md(e.puntaje_max.map(x => "- " + x).join("\n"))}` : "";
      const desc = [...(e.descuentos || []), ...(e.errores || [])];
      const panes = [
        ["I · Estrategia", (e.estrategia ? md(e.estrategia) : "") + (e.tiempo ? `<div class="pen">tiempo sugerido: ${esc(e.tiempo)}</div>` : "")],
        ["II · Solución", pasosHTML(e.pasos) + (e.respuesta ? `<div class="ans">${md(e.respuesta)}</div>` : "") + `<div class="qed">∎</div>`],
        ["III · Rúbrica de puntaje", rub + (desc.length ? `<div style="margin-top:12px"><div class="lbl" style="color:var(--pen)">Descuentos frecuentes</div>${desc.map(d => `<div class="pen">${inl(d)}</div>`).join("")}</div>` : "") + ((e.variantes || []).length ? `<p class="lbl" style="margin-top:12px">También apareció en: ${e.variantes.map(esc).join(" · ")}</p>` : "")]
      ].filter(p => p[1].replace(/<[^>]+>|∎/g, "").trim());
      const k = node(`<article class="exam"><div class="rot"><div><span class="lbl">Fuente</span>${esc(e.fuente)}${e.pregunta ? " — " + esc(e.pregunta) : ""}</div><div><span class="lbl">Puntaje</span>${esc(e.puntaje || "—")}</div><div class="${of ? "of" : "pr"}"><span class="lbl" style="color:inherit">Solución</span>${of ? "Pauta oficial" : "Propuesta"}</div></div>
        <div class="en"><div class="lbl" style="margin-bottom:6px">§${idx(e.tema)} · ${esc(tituloTema(e.tema))}</div>${md(e.enunciado)}</div><div class="tabs"></div><div class="pane"><p class="lbl">Intenta resolverla antes de abrir la solución.</p></div>
        <div class="foot"><span></span><label class="chk"><input type="checkbox"${hechas.has(e.i) ? " checked" : ""}> La resolví</label></div></article>`);
      const tabs = k.querySelector(".tabs"), pane = k.querySelector(".pane");
      panes.forEach(([l, h]) => { const b = node(`<button class="tab">${l}</button>`); b.onclick = () => { tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); b.classList.add("on"); pane.innerHTML = h; tex(pane); }; tabs.append(b); });
      k.querySelector("input").onchange = ev => { ev.target.checked ? hechas.add(e.i) : hechas.delete(e.i); store.set("hechas", [...hechas]); prog(); };
      cont.append(k);
    });
    if (!cont.children.length) cont.append(node(`<p class="lbl">No hay preguntas con ese filtro.</p>`));
    tex(cont);
  }
  lista();
}

go(store.get("tab", "resumen"));
})();
