box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--paper:#11141B;--grid:color-mix(in srgb,var(--acc-d) 9%,#11141B);--grid2:color-mix(in srgb,var(--acc-d) 17%,#11141B);--ink:#E7E9EE;--muted:#A3A9B6;--line:#2F3747;--card:#171B24;--head:#1E2431;--shadow:#0A0C11;--acc:var(--acc-d);--acc-soft:color-mix(in srgb,var(--acc-d) 16%,#171B24);--pen:var(--pen-d);--pen-soft:color-mix(in srgb,var(--pen-d) 14%,#171B24);--c2:#5BC293;--c3:#C18BE0;--c4:#9CA3AF}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
/* papel */

body.p-puntos{background-image:radial-gradient(var(--grid2) 1.2px,transparent 1.3px);background-size:22px 22px}

a{color:var(--acc)}
.serif{font-family:var(--serif)}.mono{font-family:var(--mono)}.pen{font-family:var(--hand);color:var(--pen);font-size:1.4rem;line-height:1.25}

.app{display:flex;min-height:100%}

.side{position:sticky;top:0;align-self:flex-start;width:290px;flex-shrink:0;height:100vh;height:100dvh;overflow-y:auto;padding:30px 22px calc(24px + env(safe-area-inset-bottom,0px));background:var(--side);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px;color:#fff;display:flex;flex-direction:column;gap:26px}
.side .lbl{color:var(--side-muted)}
.side h1{font:600 1.45rem/1.15 var(--serif);margin:4px 0 0}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;color:var(--side-ink);text-decoration:none;font:500 .95rem var(--sans);border:1px solid transparent;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{color:#fff;border-color:var(--side-line)}.nav.on{background:#fff;color:#111827}

.dom{display:grid;grid-template-columns:30px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:.8rem;color:var(--side-ink);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;width:100%}

.rotulo{margin-top:auto;border-top:1px solid var(--side-line);border-left:1px solid var(--side-line);display:grid;grid-template-columns:1fr 1fr}
.rotulo div{padding:7px 9px;border-right:1px solid var(--side-line);border-bottom:1px solid var(--side-line);display:flex;flex-direction:column;gap:2px;font-size:.8rem;min-width:0}
.rotulo .w{grid-column:span 2}.rotulo .lbl{font-size:.6rem}
.side .tbtn{background:none;border:1px solid var(--side-line);color:var(--side-ink);font:500 .8rem var(--sans);min-height:40px;cursor:pointer}
.content{flex:1;min-width:0}
.mtop{display:none}
main{max-width:1120px;margin:0 auto;padding:48px 56px 80px;display:flex;flex-direction:column;gap:32px}

.hdr{padding-bottom:22px;border-bottom:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}

/* hoja: tarjeta con barra superior */

.sheet>.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ink);background:var(--head)}
.sheet>.sh h3{margin:0;font:600 1.15rem var(--serif)}
.sheet>.sb{padding:18px 22px}
.sec{color:var(--acc);font:500 .85em var(--mono);margin-right:.6em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.dots{display:inline-flex;gap:4px}.dots i{width:9px;height:9px;border:1.5px solid var(--acc)}.dots i.f{background:var(--acc)}
.eqrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line)}

.mx{overflow-x:auto;overflow-y:hidden}
p{margin:.4em 0}ul,ol{margin:.35em 0;padding-left:1.3em}li{margin:.2em 0}
code{font-family:var(--mono);font-size:.88em;background:var(--acc-soft);padding:1px 5px}

.chip.on{background:var(--ink);color:var(--paper)}
.chap{display:block;padding-right:270px}

.nota .lbl{display:block;margin-bottom:4px}
.lapiz{float:right;clear:right;width:240px;margin:0 -275px 12px 0;transform:rotate(-2.5deg)}
.h3{margin:0 0 8px;font:600 1.5rem/1.25 var(--serif)}
.defi{background:var(--card);border:1px solid var(--ink);padding:16px 20px}
.defi .nm{font-family:var(--serif);font-style:italic;font-size:1.05em}
.formula{background:var(--card);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:14px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.formula .num{font:.9rem var(--mono);color:var(--muted)}
.ans{border:2px solid var(--acc);background:var(--card);padding:12px 16px;font-weight:500;overflow-x:auto}
.step{padding:6px 0 6px 14px;border-left:2px solid var(--line);margin:8px 0}.step b.t{font:600 .78rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);display:block}
.qed{text-align:right;font-size:1.2rem}
.ojo{border:2px solid var(--pen);background:var(--card);padding:14px 18px}.ojo .lbl{color:var(--pen)}
.code{background:#161A22;color:#E6E8EC;font:.9rem/1.55 var(--mono);padding:16px 18px;overflow-x:auto;white-space:pre;margin:0}
.code+.out{border:1px solid var(--ink);border-top:0;font:.85rem var(--mono);padding:10px 16px;white-space:pre;overflow-x:auto;background:var(--card)}
.gadget .sb{padding:22px}
.g-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}.g-row label{min-width:130px;font-size:.9rem}
.g-row input[type=range]{flex:1;min-width:150px;accent-color:var(--acc)}.g-row .v{font-family:var(--mono);min-width:64px}
.g-out{margin:10px 0;font-size:.95rem}
input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ink);padding:8px 10px;min-height:42px}
canvas{max-width:100%;display:block}

.tbl table{border:1px solid var(--ink)}th{font:600 .7rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--head);text-align:left;padding:9px 12px;border-bottom:1px solid var(--ink)}
td{padding:9px 12px;border-bottom:1px dashed var(--line);vertical-align:top}
.btn{border:1px solid var(--ink);background:var(--card);color:var(--ink);font:500 .92rem var(--sans);min-height:44px;padding:0 18px;cursor:pointer}
.btn:hover{background:var(--head)}.btn.pri{background:var(--ink);color:var(--paper)}.btn.pri:hover{opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.hide{display:none!important}
/* autoevaluación */
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font:.85rem var(--mono)}
.opt .tx{flex:1}.opt .tg{font-family:var(--hand);font-size:1.3rem;color:var(--pen)}
.opt.ok{border:2px solid var(--acc)}.opt.ok .bub{background:var(--acc);border-color:var(--acc);color:var(--card)}.opt.ok .tg{color:var(--acc)}
.opt.bad{border:2px solid var(--pen)}.opt.bad .bub{border-color:var(--pen);color:var(--pen)}
.big{font:400 3.6rem/1 var(--serif)}.big small{color:var(--muted);font-size:.6em}
.hbar{height:12px;border:1px solid var(--ink);background:var(--card)}.hbar i{display:block;height:100%;background:var(--acc);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 4px,transparent 4px 8px)}
.freq{display:grid;grid-template-columns:minmax(140px,230px) minmax(0,1fr) 30px;gap:14px;align-items:center;font-size:.9rem;margin:6px 0}
/* evaluaciones */
.exam{background:var(--card);border:1px solid var(--ink);box-shadow:6px 6px 0 var(--shadow)}
.exam .rot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;border-bottom:1px solid var(--ink)}
.exam .rot>div{padding:10px 18px;display:flex;flex-direction:column;gap:2px;font:.88rem var(--mono)}
.exam .rot>div+div{border-left:1px solid var(--ink)}.exam .rot .of{background:var(--acc-soft);color:var(--acc)}.exam .rot .pr{background:var(--pen-soft);color:var(--pen)}
.exam .en{padding:22px 26px 6px;font:1.18rem/1.6 var(--serif)}
.tabs{display:flex;border-bottom:1px solid var(--ink);margin:14px 26px 0;overflow-x:auto}
.tab{min-height:44px;padding:0 18px;font:500 .85rem var(--mono);cursor:pointer;margin-bottom:-1px;border:1px solid transparent;background:none;color:var(--muted);white-space:nowrap}
.tab.on{border-color:var(--ink);border-bottom-color:var(--card);background:var(--card);color:var(--ink)}
.pane{padding:18px 26px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 26px 18px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--acc)}
/* responsive */
@media (max-width:1100px){.chap{padding-right:0}.nota,.lapiz{float:none;width:auto;margin:0 0 16px}.lapiz{transform:none}}
@media (max-width:900px){
.app{display:block}

body.menu .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.mtop{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--side);color:#fff}
.mtop button{background:none;border:1px solid var(--side-line);color:#fff;min-height:42px;padding:0 12px;font:500 .85rem var(--sans)}
.mtop b{font:600 1rem var(--serif);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:26px 16px 70px;gap:24px}
.grid2{grid-template-columns:minmax(0,1fr)}
.exam .rot{grid-template-columns:1fr 1fr}.exam .rot>div:first-child{grid-column:span 2;border-bottom:1px solid var(--ink)}.exam .rot>div:nth-child(2){border-left:0}
.exam .en,.pane{padding-left:16px;padding-right:16px}.tabs{margin:14px 16px 0}.foot{padding:8px 16px 16px}
.big{font-size:2.8rem}.freq{grid-template-columns:minmax(0,1fr) 90px 26px}
}
@media print{.side,.mtop,.btn,.chip,.subnav,.tabs{display:none!important}body{background:#fff!important}.chap{padding-right:0}.sheet,.exam{break-inside:avoid;box-shadow:none}}

<script>
const DATA = {"meta": {"ramo": "Ecuaciones Diferenciales (MAT-208)", "evaluacion": "Proyecto Bungee: validación y control individual", "fecha": "Control: martes 3 nov", "carrera": "Universidad Adolfo Ibáñez", "semestre": "2026-2", "contenidos": "Validación (h₁, h₂) y repaso del control, solo lo que usa el informe: modelo del salto, ecuación auxiliar, masa-resorte con amortiguamiento, mínimos cuadrados", "fuentes": ["Enunciado del proyecto (PDF) y reglas de la validación experimental", "Informe en Google Docs (versión del 1 nov)", "Los 8 saltos en video (IMG_0621 a IMG_0631) y el ajuste F vs x", "Clases 11, 14 y 15 del curso", "Controles 2 anteriores con pauta (3 preguntas de masa-resorte)"], "estilo": {"preset": "fisica", "papel": "milimetrado", "unidad": "Capítulo"}}, "resumen": [{"tema": "t1", "ideas": ["Dos etapas: caída libre con la cuerda floja ($a=g$) y resorte con la cuerda tensa ($m\\ddot u+ku=mg$).", "Se conectan en $t^*$ con continuidad de la posición y de la velocidad. La aceleración sí salta.", "El punto más bajo sale por energía: $mg(L+u)=\\tfrac12 ku^2$.", "La aceleración máxima ocurre en el punto más bajo y es siempre mayor que $g$.", "En el prototipo la caída libre efectiva es $L_c=\\ell+L_0+h_s+\\delta$: la base parte a nivel de la varilla y el mosquetón queda $h_s$ más arriba."], "formulas": [{"tex": "u_{\\max}=\\frac{mg}{k}\\left(1+\\sqrt{1+\\frac{2kL_c}{mg}}\\right)", "nota": "elongación máxima"}, {"tex": "h_1=H-\\ell-L_0-h_s-u_{\\max}", "nota": "altura del punto más bajo (la D del informe)"}], "ojo": ["En la raíz va $L_c$ (0,77 m), no $L_0$ (0,59 m)."]}, {"tema": "t2", "ideas": ["$h_1$ es la altura del peso en su punto más bajo y $h_2$ la altura a la que sube en el primer rebote; ambas desde el suelo hasta la base del peso.", "El modelo ideal deja $h_1$ en promedio 12 cm por debajo de lo medido y manda el peso de vuelta a la altura de partida ($h_2=H$).", "En tus saltos el peso recuperó solo 61 a 69 % de lo que bajó (media 64 %).", "Predicción del día: modelo con amortiguamiento ($\\zeta=0{,}094$). Error típico en los 8 saltos: $h_1$ ±7 cm y $h_2$ ±4 cm.", "Regla rápida: $h_2=h_1+r\\,(H+\\delta-h_1)$ con $r=0{,}64$."], "formulas": [{"tex": "m\\ddot u+c\\,\\dot u+ku=mg,\\quad c=2\\zeta\\sqrt{km}", "nota": "etapa 2 con pérdidas; $\\zeta\\approx0{,}094$"}, {"tex": "h_2=h_1+r\\,(H+\\delta-h_1)", "nota": "$r\\approx0{,}64$"}], "ojo": ["Mide $h_1$ y $h_2$ hasta la base del peso, no hasta el mosquetón.", "$\\zeta$ se calibró con los mismos videos: el acierto en $h_2$ no es una prueba independiente."]}, {"tema": "t3", "ideas": ["La masa sorteada cambia mucho $h_1$: con el elástico validado, 500 g queda cerca del suelo y 150 g queda muy arriba.", "La perilla que queda es el hilo inextensible $\\ell$: alarga la caída libre sin cambiar $k$.", "Menos masa pide más hilo. Más altura $H$ pide más hilo (unos 8 a 9 cm por cada 10 cm de $H$).", "Se resuelve $h_1(\\ell)=h_{obj}$ con el modelo amortiguado; con pérdidas se necesitan 4 a 8 cm más de hilo que con el ideal.", "Objetivo recomendado: 8 cm, no 5 cm, para no tocar el suelo si el modelo se equivoca ±7 cm."], "formulas": [{"tex": "h_1(\\ell)=h_{obj}", "nota": "se resuelve numéricamente; $h_1$ decrece al subir $\\ell$"}], "ojo": ["Si $h_1$ predicho sale negativo, ACORTA el hilo (o sube H): más hilo baja más el peso."]}, {"tema": "t4", "ideas": ["Se midió $F=Mg$ contra $x$ = largo − 59 cm con 6 masas (187 a 1934 g), una sola pasada.", "Ajuste lineal: $k=25{,}7\\pm1{,}9$ N/m, $b=0{,}49\\pm0{,}78$ N (compatible con 0), $R^2=0{,}978$.", "Los residuos tienen forma curva: la rigidez local baja de ~30 a ~17 N/m entre 16 y 76 cm.", "Pasar de recta a parábola cambia la predicción solo 2 a 3 cm."], "formulas": [{"tex": "F=kx+b", "nota": "$k$ = pendiente"}], "ojo": ["Un $R^2$ alto no prueba linealidad: mira los residuos.", "Una sola pasada: no se cumple el criterio de 3 ensayos al 5 %."]}, {"tema": "t5", "ideas": ["$D_{exp}$ es el promedio de las $D_i$, $s$ su desviación estándar pm\\beta i$: $e^{\\alpha x}(c_1\\cos\\beta x+c_2\\sin\\beta x)$.", "Lado derecho constante $K$ (con $c\\neq0$): $y_p=K/c$. En el salto, $u_p=mg/k=\\delta_e$."], "formulas": [{"tex": "m=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}", "nota": "para $ay''+by'+cy=0$"}], "ojo": ["Raíz $\\pm 2i$ da $\\cos 2x,\\ \\sin 2x$ (sin exponencial, porque $\\alpha=0$)."]}, {"tema": "c4", "ideas": ["Hooke en el equilibrio: $mg=ks$. En sistema inglés $m=W/32$ [slug]; en SI el peso es $9{,}8\\,m$ [N].", "Modelo: $mx''+cx'+kx=f(t)$. **Abajo positivo** (convención de clase), salvo que el enunciado diga otra cosa.", "Libre no amortiguado: $\\omega=\\sqrt{k/m}$, $T=2\\pi/\\omega$, $f=\\omega/2\\pi$, $A=\\sqrt{c_1^2+c_2^2}$.", "Amortiguado según $c^2-4mk$: $>0$ sobreamortiguado, $=0$ crítico (cruza 0 a lo más 1 vez), $<0$ subamortiguado (oscila)."], "formulas": [{"tex": "\\lambda=\\frac{-c\\pm\\sqrt{c^2-4mk}}{2m}", "nota": "raíces del caso amortiguado"}], "ojo": ["“1 pie sobre el equilibrio” con abajo positivo es $x(0)=-1$; “hacia arriba” es velocidad negativa.", "“Se libera desde el reposo” significa $x'(0)=0$."]}, {"tema": "c5", "ideas": ["Plantea cada etapa como PVI: etapa 1 $m\\ddot y=mg$ con $y(0)=\\dot y(0)=0$; etapa 2 $m\\ddot u+ku=mg$ con $u(t^*)=0$ y $\\dot u(t^*)=v^*$.", "Etapa 2: $r=\\pm i\\omega$, particular constante $\\delta_e=mg/k$, $c_1=-\\delta_e$, $c_2=v^*/\\omega$.", "Con $x=u-\\delta_e$ queda el movimiento libre $\\ddot x+\\omega^2x=0$.", "Con amortiguamiento se clasifica con $c^2$ contra $4mk$; subamortiguado: $\\alpha=c/(2m)$ y $\\omega^*=\\sqrt{\\omega^2-\\alpha^2}$."], "formulas": [{"tex": "u_{\\max}=\\delta_e+\\sqrt{\\delta_e^2+(v^*/\\omega)^2}", "nota": "sin amortiguamiento"}], "ojo": ["Las condiciones iniciales de la etapa 2 van en $t^*$."]}, {"tema": "c8", "ideas": ["$k=S_{xy}/S_{xx}$ y $b=\\bar y-k\\bar x$.", "$s^2=SSE/(n-2)$; $SE(k)=s/\\sqrt{S_{xx}}$; $R^2=1-SSE/S_{yy}$.", "Para $h_1$: $\\sigma^2=\\sum(\\partial h_1/\\partial p_i)^2\\sigma_i^2$. Dominan $k$ y $h_s$."], "formulas": [{"tex": "SE(k)=\\frac{s}{\\sqrt{S_{xx}}}", "nota": "con $s^2=SSE/(n-2)$"}], "ojo": ["Divide por $n-2$, no por $n$."]}], "temas": [{"id": "t1", "titulo": "El modelo del salto", "peso": 3, "intro": "Todo el proyecto parte de este modelo. Si lo dominas, en el control puedes deducir cualquier fórmula del informe en vez de memorizarla.", "bloques": [{"tipo": "texto", "titulo": "Las dos etapas", "md": "Se usa un eje $y$ hacia abajo con origen donde parte el punto de amarre.\n\n**Etapa 1, cuerda floja.** Solo actúa el peso: $m\\ddot y=mg$, con $y(0)=0$ y $\\dot y(0)=0$. Resulta $y=\\tfrac12gt^2$.\n\n**Etapa 2, cuerda tensa.** Además actúa la fuerza elástica $ku$, con $u=y-L$: $m\\ddot u+ku=mg$. Es una EDO lineal de segundo orden, de coeficientes constantes y no homogénea."}, {"tipo": "texto", "titulo": "Cómo se conectan", "md": "La cuerda no puede producir saltos bruscos de posición ni de velocidad. Por eso en $t^*=\\sqrt{2L/g}$ se exige $u(t^*)=0$ y $\\dot u(t^*)=v^*=\\sqrt{2gL}$. La aceleración sí cambia de golpe: pasa de $g$ a $g-ku/m$."}, {"tipo": "formula", "tex": "u(t)=\\delta_e\\left[1-\\cos\\omega(t-t^*)\\right]+\\frac{v^*}{\\omega}\\operatorname{sen}\\omega(t-t^*)", "nota": "$\\omega=\\sqrt{k/m}$ y $\\delta_e=mg/k$ es la elongación de equilibrio (con $a=0$)."}, {"tipo": "formula", "tex": "u_{\\max}=\\frac{mg}{k}\\left(1+\\sqrt{1+\\frac{2kL}{mg}}\\right)", "nota": "Sale del extremo de la oscilación o por energía: $mg(L+u)=\\tfrac12ku^2$."}, {"tipo": "formula", "tex": "D=H-\\ell-L_0-u_{\\max}-h_s", "nota": "Distancia mínima al suelo (ecs. 14 y 17 del informe). En la validación se llama $h_1$."}, {"tipo": "formula", "tex": "|a|_{\\max}=g\\sqrt{1+\\frac{2kL}{mg}}", "nota": "Ocurre en el punto más bajo y siempre es mayor que $g$."}, {"tipo": "definicion", "etiqueta": "Concepto", "nombre": "Caída libre efectiva $L_c$", "md": "En el modelo el punto de amarre parte en el punto de sujeción. En el prototipo se suelta con la **base** de la pesa a nivel de la varilla, así que el mosquetón (el amarre) parte $h_s=18$ cm más arriba. Entonces el amarre cae libremente $L_c=\\ell+L_0+h_s+\\delta$, que con $\\ell=0$ y $\\delta=0$ vale $0{,}59+0{,}18=0{,}77$ m. Esa $L_c$ es la que va dentro de la raíz. $\\delta$ es lo que sube la base sobre la varilla al soltar (0 a 6 cm en tus saltos)."}, {"tipo": "lapiz", "texto": "en la raíz va L_c, no L₀"}, {"tipo": "gadget", "id": "g_salto", "titulo": "Las dos etapas del salto ideal", "instrucciones": "Mueve m, k y L. Fíjate en que la curva no tiene quiebre en t*: posición y velocidad son continuas."}, {"tipo": "ejemplo", "titulo": "514 g y H = 1,60 m", "enunciado": "Con $k=25{,}72$ N/m, $L_0=0{,}59$ m, $h_s=0{,}18$ m, $\\ell=0$ y $\\delta=0$, calcula la distancia mínima al suelo con el modelo ideal.", "pasos": [{"titulo": "Datos", "md": "$mg=0{,}514\\cdot9{,}81=5{,}04$ N y $L_c=0{,}59+0{,}18=0{,}77$ m."}, {"titulo": "Elongación máxima", "md": "$\\dfrac{mg}{k}=0{,}196$ m y $\\dfrac{2kL_c}{mg}=7{,}86$.\n\n$u_{\\max}=0{,}196\\left(1+\\sqrt{8{,}86}\\right)=0{,}779$ m."}, {"titulo": "Distancia al suelo", "md": "$D=1{,}60-0{,}59-0{,}18-0{,}779=0{,}051$ m."}], "respuesta": "$D\\approx5$ cm. Es la $H=1{,}600$ m que el informe calcula para 514 g.", "lapiz": "sin la unidad o sin h_s la respuesta queda mal"}, {"tipo": "ojo", "items": ["Confundir el instante de máxima velocidad ($u=\\delta_e$, $a=0$) con el punto más bajo.", "Poner $L_0$ en vez de $L_c$ dentro de la raíz en el prototipo.", "Olvidar $h_s$ al pasar de la posición del amarre a la base del peso."]}]}, {"id": "t2", "titulo": "Cómo predecimos h₁ y h₂", "peso": 3, "intro": "El día de la validación te sortean una altura H (entre 1,6 y 1,8 m) y una masa (entre 0 y 500 g), y se mide a qué altura llega el peso en dos momentos. Las dos predicciones tienen que quedar escritas antes de soltar.", "bloques": [{"tipo": "texto", "titulo": "Qué se mide", "md": "- La plataforma la ponen los profes; si ya tienen una, pueden usarla.\n- Se sortea $H\\in[1{,}6;\\,1{,}8]$ m y la masa $m\\in[0;\\,500]$ g. Cada grupo arma el resorte adecuado y le agrega el peso.\n- **Momento 1:** altura $h_1$ del peso en su punto más bajo, medida desde el suelo.\n- **Momento 2:** altura $h_2$ a la que se devuelve en el primer rebote (su punto más alto después del primer descenso).\n- $h_1$ es la $D$ del informe. $h_2$ no estaba en el informe: se predice con la mejora de amortiguamiento (sección 2.4.2)."}, {"tipo": "texto", "titulo": "Predecir h₁", "md": "1. Mide la masa total colgada $m$ (peso más mosquetón) en la balanza, $H$ con la huincha y $h_s$ del objeto.\n2. Caída libre efectiva: $L_c=\\ell+L_0+h_s+\\delta$.\n3. Elongación máxima $u_{\\max}$ con la fórmula del capítulo 1.\n4. $h_1=H-\\ell-L_0-h_s-u_{\\max}$.\n\nEso es el modelo ideal. En tus 8 saltos quedó por debajo de lo medido en todos ellos (12 cm en promedio): el peso real llega menos abajo porque pierde energía. Con amortiguamiento el error promedio baja a 3 cm, con un error típico de ±7 cm."}, {"tipo": "texto", "titulo": "Predecir h₂", "md": "En el modelo ideal no se pierde energía, así que el peso vuelve exactamente a la altura de partida: $h_2=H+\\delta$. En tus videos solo subió entre 61 y 69 % de lo que había bajado (media 64 %). Por eso $h_2$ necesita pérdidas.\n\nHay dos formas, que dan casi lo mismo:\n\n- **Regla rápida:** $h_2=h_1+r\\,(H+\\delta-h_1)$ con $r=0{,}64\\pm0{,}03$.\n- **Simulación (sección 2.4.2):** se agrega la fuerza $-c\\dot u$ mientras la cuerda está tensa, con $c=2\\zeta\\sqrt{km}$ y $\\zeta=0{,}094$. Cuando la cuerda se afloja el peso sube como proyectil hasta su punto más alto."}, {"tipo": "formula", "tex": "h_2=h_1+r\\,(H+\\delta-h_1)", "nota": "$r\\approx0{,}64$ es la fracción del descenso que se recupera."}, {"tipo": "formula", "tex": "m\\ddot u+c\\,\\dot u+ku=mg,\\qquad c=2\\zeta\\sqrt{km}", "nota": "$\\zeta\\approx0{,}094$ en las tres masas ensayadas (0,088; 0,102 y 0,092)."}, {"tipo": "tabla", "titulo": "Cómo funciona el predictor con tus 8 saltos (cm sobre el suelo)", "columnas": ["Configuración", "$h_1$ medido", "$h_1$ ideal", "$h_1$ amortiguado", "$h_2$ medido", "$h_2$ amortiguado"], "filas": [["514,5 g; 1,52 m (2 saltos)", "13,8", "−4,0", "6,9", "101,2", "101,9"], ["214,5 g; 1,52 m (2 saltos)", "47,4", "30,3", "36,4", "113,1", "107,6"], ["514 g; 1,81 m (3 saltos)", "32,3", "25,1", "35,9", "132,3", "130,9"], ["214,5 g; 1,81 m (1 salto)", "66,4", "59,4", "65,4", "136,3", "136,5"], ["Error típico (RMS, 8 saltos)", "—", "13,4", "7,0", "—", "3,9"]]}, {"tipo": "nota", "md": "**Ojo con la honestidad del resultado.** $\\zeta$ se calibró con el rebote de estos mismos videos, así que el acierto en $h_2$ (y en parte en $h_1$) no es una prueba independiente. El $h_2$ medido sale de $D$ más el rebote observado en el video, con la escala de cada salto. La prueba de verdad es el día de la validación."}, {"tipo": "gadget", "id": "g_predictor", "titulo": "Predictor de h₁ y h₂", "instrucciones": "Pon la H y la masa sorteadas (y el hilo ℓ si lo usas). Compara el modelo ideal con el amortiguado y anota lo medido para ver E_abs y E_H."}, {"tipo": "ejemplo", "titulo": "Te tocó 300 g y H = 1,7 m, con el elástico validado y sin hilo", "enunciado": "Predice $h_1$ y $h_2$ con $k=25{,}72$ N/m, $L_0=0{,}59$ m, $h_s=0{,}18$ m, $\\ell=0$ y $\\delta=0$.", "pasos": [{"titulo": "Modelo ideal", "md": "$mg=2{,}94$ N, $L_c=0{,}77$ m. $u_{\\max}=0{,}114\\left(1+\\sqrt{1+2\\cdot25{,}72\\cdot0{,}77/2{,}94}\\right)=0{,}550$ m.\n\n$h_1=1{,}70-0{,}59-0{,}18-0{,}550=0{,}380$ m y $h_2=H=1{,}70$ m."}, {"titulo": "Con amortiguamiento ($\\zeta=0{,}094$)", "md": "Simulando las dos etapas: $h_1=45{,}5$ cm. El peso recupera 62 % del descenso, así que $h_2=h_1+0{,}62\\,(170-45{,}5)=123$ cm."}], "respuesta": "Ideal: $h_1=38{,}0$ cm y $h_2=170$ cm. Con pérdidas: $h_1\\approx45{,}5$ cm y $h_2\\approx123$ cm.", "lapiz": "h₂ = H es el modelo sin pérdidas: no lo entregues como predicción"}, {"tipo": "gadget", "id": "g_ej", "titulo": "Practica el cálculo de h₁ ideal", "instrucciones": "Cada vez cambian la masa y la altura. Calcula a mano y revisa."}, {"tipo": "ojo", "items": ["Entregar $h_2=H$: eso es el modelo sin pérdidas.", "Medir hasta el mosquetón en vez de la base del peso: son 18 cm de diferencia.", "Trasladar el $b$ de una masa a otra: $b$ cambia con la masa, $\\zeta$ casi no.", "Usar $H$ del soporte sin sumarle la corrección $\\delta$ de la suelta."]}]}, {"id": "t3", "titulo": "Armar el resorte para la masa sorteada", "peso": 3, "intro": "El enunciado dice que cada grupo debe disponer del resorte adecuado para el peso que le toque. Con el elástico que ya caracterizaste, la masa cambia mucho h₁: la perilla que te queda es el hilo inextensible ℓ, que no cambia k.", "bloques": [{"tipo": "gadget", "id": "g_h_masa", "titulo": "Si no se ajusta nada: h₁ y h₂ según la masa", "instrucciones": "Con el elástico validado y sin hilo, mira qué pasa en el rango 50 a 500 g y para H = 1,6; 1,7 y 1,8 m."}, {"tipo": "texto", "titulo": "La idea", "md": "El hilo $\\ell$ se agrega en serie al elástico: la caída libre crece a $L_c=\\ell+L_0+h_s+\\delta$, pero la base también queda $\\ell$ más abajo desde el comienzo. Con una masa chica el elástico se estira poco, y hay que \"comprar\" bajada con hilo.\n\nSe resuelve $h_1(\\ell)=h_{obj}$ con el modelo amortiguado. Como $h_1$ baja cuando sube $\\ell$, hay una sola solución. Con pérdidas de energía necesitas entre 4 y 8 cm más de hilo que con el modelo ideal."}, {"tipo": "tabla", "titulo": "Hilo ℓ [cm] para h₁ = 8 cm (h₂ predicho entre paréntesis)", "columnas": ["Masa [g]", "H = 1,6 m", "H = 1,7 m", "H = 1,8 m"], "filas": [["100", "45 (97)", "54 (103)", "63 (109)"], ["150", "38 (99)", "47 (104)", "56 (110)"], ["200", "32 (100)", "41 (106)", "50 (111)"], ["250", "27 (101)", "36 (107)", "44 (112)"], ["300", "23 (102)", "31 (108)", "39 (113)"], ["350", "18 (103)", "27 (109)", "35 (114)"], ["400", "14 (104)", "23 (109)", "31 (115)"], ["450", "11 (104)", "19 (110)", "27 (116)"], ["500", "7 (105)", "15 (111)", "23 (117)"]]}, {"tipo": "nota", "md": "Con $h_s=18$ cm, $\\delta=0$, $k=25{,}72$ N/m, $L_0=0{,}59$ m y $\\zeta=0{,}094$. Si el objeto que te dan tiene otro $h_s$, o si no sueltas con la base a nivel de la varilla, rehaz el cálculo en el gadget de abajo."}, {"tipo": "texto", "titulo": "Por qué 8 cm y no 5 cm", "md": "El proyecto pide quedar a 5 cm o menos sin tocar el suelo. El modelo amortiguado se equivocó ±7 cm en tus saltos: a 1,52 m el peso quedó más arriba de lo predicho (6 a 12 cm), pero a 1,81 m quedó entre 1 cm más arriba y 6 cm más abajo. Con un objetivo de 5 cm hay riesgo real de tocar el suelo cuando H es alta. Con 8 cm el margen cubre ese error.\n\nSi la rúbrica premia acercarse más al suelo, bajen el objetivo; decídanlo antes con el profe."}, {"tipo": "gadget", "id": "g_diseno", "titulo": "Diseñador de resorte", "instrucciones": "Ingresa la H y la masa sorteadas, el h_s del objeto y el objetivo. Entrega el hilo ℓ y las dos predicciones."}, {"tipo": "texto", "titulo": "Cómo hacerlo en la práctica", "md": "- Lleva el elástico validado (3 en paralelo, $L_0=0{,}59$ m) y un cordel inextensible de unos 80 cm, con lazo regulable o nudos.\n- Mide $\\ell$ efectivo con la huincha, ya amarrado: los nudos se comen largo.\n- No cambies los elásticos: así la $k$ medida sigue valiendo.\n- Mide $h_s$ del objeto que te den. Si no son tus bronces, no es 18 cm.\n- Suelta sin impulso con la base a la altura de la varilla ($\\delta\\approx0$).\n- Pregunta si se permite un salto de prueba. El informe dice que la configuración no se ajusta por ensayo y error."}, {"tipo": "texto", "titulo": "Masas muy chicas", "md": "Bajo unos 150 g el hilo necesario pasa de 40 cm y el elástico es muy rígido para esa masa. Un elástico más blando (1 o 2 en paralelo) sería más natural, pero no tienes su $k$ medido: úsalo solo si lo mides antes (tres masas, 20 minutos). Con los 3 en paralelo sigue funcionando con hilo largo. Si sortean un valor cercano a 0 g, el peso es solo el mosquetón: usa lo que pese en la balanza."}, {"tipo": "ojo", "items": ["Si $h_1$ predicho sale negativo, ACORTA el hilo (o sube H): más hilo baja más el peso.", "Usar el $\\ell$ del modelo ideal: falta de 4 a 8 cm de hilo.", "No volver a medir $h_s$ del objeto que entregan los profes.", "Dejar el hilo con nudos sin medir el largo efectivo."]}]}, {"id": "t4", "titulo": "La constante k: del gráfico F vs x al ajuste", "peso": 2, "intro": "Todo lo que predice el modelo depende de un número, k. Aquí está de dónde sale y qué tan confiable es.", "bloques": [{"tipo": "texto", "titulo": "Qué se hizo", "md": "Se colgaron 6 masas (187 a 1934 g) del elástico (3 en paralelo, $L_0=0{,}59$ m). El largo se midió con huincha desde la vara hasta el final de la cuerda, antes del mosquetón, con resolución de 1 cm. La elongación es $x=$ largo $-\\,59$ cm y la fuerza es $F=Mg$. Fue una sola pasada, con 20 s de espera entre medidas."}, {"tipo": "tabla", "titulo": "Datos (tabla 3 del informe)", "columnas": ["Masa [g]", "Fuerza [N]", "Elongación [cm]"], "filas": [["187,2", "1,84", "9"], ["327,7", "3,21", "13"], ["512,1", "5,02", "16"], ["1009,7", "9,91", "32"], ["1492,2", "14,64", "51"], ["1933,5", "18,97", "76"]]}, {"tipo": "formula", "tex": "F=kx+b,\\quad k=25{,}7\\pm1{,}9\\ \\text{N/m},\\ b=0{,}49\\pm0{,}78\\ \\text{N},\\ R^2=0{,}978", "nota": "Mínimos cuadrados con los 6 puntos."}, {"tipo": "gadget", "id": "g_ajuste", "titulo": "Ajuste de la recta y de la parábola", "instrucciones": "Desmarca puntos para ver cómo se mueven k, su error y R². Fíjate en la rigidez local de la parábola a 76 cm."}, {"tipo": "texto", "titulo": "¿Es razonable suponer una relación lineal?", "md": "$R^2=0{,}978$ es cercano a 1, pero los residuos no son aleatorios: van −, −, +, +, +, −, lo que indica una curvatura. La pendiente entre puntos consecutivos baja de unos 30 N/m (16 a 32 cm) a unos 17 N/m (51 a 76 cm): los elásticos se ablandan.\n\nEn el salto la elongación máxima es de 45 a 79 cm (214,5 a 514 g), justo en la zona más blanda. Aun así la ley de Hooke sirve como primera aproximación: reemplazar la recta por una parábola cambia la predicción de la caída solo 2 a 3 cm para 514 g, menos que la diferencia con lo medido (7 a 18 cm). Como mejora futura se puede usar un $k$ que dependa de la elongación."}, {"tipo": "texto", "titulo": "Cuánto afecta el error de k", "md": "Un error de $\\pm1{,}9$ N/m en $k$ (7 %) se traduce en unos $\\pm2$ a $\\pm4$ cm en $h_1$, según la masa. Es menor que el error por pérdida de energía, pero no es despreciable. Lo mismo con $h_s\\pm1{,}5$ cm: cambia $h_1$ en unos $\\mp1{,}8$ cm."}, {"tipo": "ojo", "items": ["Un $R^2$ alto no prueba linealidad: hay que mirar los residuos.", "El intercepto $b=0{,}49\\pm0{,}78$ N es compatible con cero: Hooke sin pretensión.", "Hay 6 puntos (lo que pide la norma) pero una sola pasada: no se cumple el criterio de 3 ensayos que coincidan dentro de 5 %."]}]}, {"id": "t5", "titulo": "Validación: D_i, desviación y discrepancias", "peso": 2, "intro": "Cómo se compara la predicción con los saltos y qué dicen los números. El día de la validación harás exactamente esto con h₁ y h₂.", "bloques": [{"tipo": "texto", "titulo": "Las definiciones", "md": "Para cada salto se mide la distancia mínima $D_i$ entre el peso y el suelo. Con $n$ saltos:\n\n$$D_{exp}=\\bar D=\\frac1n\\sum D_i,\\qquad s=\\sqrt{\\frac1{n-1}\\sum(D_i-\\bar D)^2}$$\n\n$s$ mide cuánto cambian los saltos entre sí (reproducibilidad)."}, {"tipo": "formula", "tex": "E_{abs}=\\left|D_{exp}-D_{pred}\\right|,\\qquad E_H=\\frac{\\left|D_{exp}-D_{pred}\\right|}{H}\\times100", "nota": "$E_{abs}$ es cuántos cm se equivoca el modelo; $E_H$ lo compara con la altura del montaje."}, {"tipo": "tabla", "titulo": "Resultados de los 8 saltos (modelo ideal, tablas 5 y 6)", "columnas": ["Configuración", "$D_{exp}\\pm s$ [cm]", "$D_{pred}$ [cm]", "$E_{abs}$ [cm]", "$E_H$ [%]"], "filas": [["514,5 g; 1,52 m", "13,8 ± 2,2", "−4,0", "17,8", "11,7"], ["214,5 g; 1,52 m", "47,4 ± 1,7", "30,3", "17,1", "11,2"], ["514 g; 1,81 m (3 saltos)", "32,3 ± 3,0", "25,1", "7,2", "4,0"], ["214,5 g; 1,81 m (1 salto)", "66,4", "59,4", "7,0", "3,9"]]}, {"tipo": "texto", "titulo": "Cómo se interpreta", "md": "- La desviación $s$ (1,7 a 3,0 cm) es del orden de la incertidumbre de la escala (3 a 4 cm): los saltos son repetibles dentro de lo que permite la medición.\n- $E_{abs}$ (7,0 a 17,8 cm) es mucho mayor que $s$ y tiene siempre el mismo signo (el modelo predice un punto más bajo que el real). No es ruido: es un error sistemático que el modelo ideal no captura.\n- $E_H$ va de 3,9 a 11,7 %. A escala real se pide 0,5 % (60 m con 30 cm de tolerancia): estamos entre 8 y 23 veces por encima.\n- Con amortiguamiento $E_{abs}$ baja a entre 1,1 y 11,2 cm, pero el coeficiente se ajustó con los mismos videos."}, {"tipo": "gadget", "id": "g_estad", "titulo": "Calculadora de discrepancias", "instrucciones": "Cambia los D_i, la predicción y H. El día de la validación usa esto con h₁ y h₂ medidos."}, {"tipo": "ojo", "items": ["$s$ es muestral ($n-1$) y con un solo salto no existe.", "$E_H$ se divide por $H$, no por $D$.", "Ningún salto llegó a 5 cm: el menor fue 12,3 cm. No lo escondas.", "Los saltos se hicieron antes de caracterizar $k$: no se eligieron con el modelo."]}]}, {"id": "t6", "titulo": "Limitaciones y mejora del modelo", "peso": 2, "intro": "El profe suele preguntar por qué se equivoca el modelo y cómo lo mejorarían. Esta es la respuesta ordenada.", "bloques": [{"tipo": "texto", "titulo": "Dos tipos de causas", "md": "**Limitaciones del modelo (error sistemático):**\n\n- Pérdida de energía: fricción interna de la goma y resistencia del aire.\n- No linealidad e histéresis de los elásticos.\n- Masa de la cuerda despreciada (Heck et al., 2010).\n- Movimientos no verticales.\n\n**Incertidumbre experimental (error aleatorio o de medición):**\n\n- Escala del video (3 a 4 cm, de la caída libre) y perspectiva de la cámara: la varilla queda unos 7 cm delante del poste.\n- $k\\pm1{,}9$ N/m y $h_s\\pm1{,}5$ cm.\n- Forma de soltar ($\\delta$ de 0 a 6 cm).\n- Resolución del video."}, {"tipo": "texto", "titulo": "La mejora: amortiguamiento viscoso", "md": "Se agrega a la etapa 2 una fuerza proporcional a la velocidad y opuesta a ella:\n\n$$m\\ddot u+c\\,\\dot u+ku=mg,\\qquad u(t^*)=0,\\ \\dot u(t^*)=v^*$$\n\n$c$ [kg/s] convierte energía mecánica en calor. Con $c>0$ el peso llega menos abajo y rebota menos. Se escribe como $c=2\\zeta\\sqrt{km}$, con $\\zeta$ adimensional.\n\n**Cómo se mide.** Como la cuerda se afloja cuando el peso sube, la oscilación no es armónica y el decremento logarítmico no se puede aplicar tal cual. Por eso se ajustó numéricamente la solución de las dos etapas al primer rebote medido."}, {"tipo": "gadget", "id": "g_amort", "titulo": "Cuánto rebota según ζ", "instrucciones": "Mueve ζ y mira el rebote, h₁ y h₂ para 514 g y H = 1,81 m. La banda punteada es lo que se observó."}, {"tipo": "tabla", "titulo": "Amortiguamiento ajustado a cada masa", "columnas": ["Masa", "$b$ [kg/s]", "$\\zeta=b/(2\\sqrt{km})$"], "filas": [["514 g", "0,64", "0,088"], ["514,5 g", "0,74", "0,102"], ["214,5 g", "0,43", "0,092"]]}, {"tipo": "nota", "md": "$b$ cambia casi al doble entre masas, pero $\\zeta$ se mantiene entre 0,088 y 0,102. Por eso se usa $\\zeta\\approx0{,}094$ para una masa nueva."}, {"tipo": "texto", "titulo": "Lo que no sabemos", "md": "Con la misma cuerda, los saltos a $H=1{,}52$ m quedaron relativamente más arriba que los de 1,81 m ($E_{abs}$ de 17 contra 7 cm), aunque la física no depende de $H$. Podría ser un cambio de los elásticos con el uso entre las dos series o un error de escala en esos videos. No hay saltos extra para aclararlo."}, {"tipo": "ojo", "items": ["Decir que el modelo \"está mal\": el modelo ideal es un primer modelo y la discrepancia está explicada en gran parte por una causa identificada.", "Mezclar error de modelo con error de medición: no se corrigen igual.", "Afirmar que la causa de la diferencia entre 1,52 y 1,81 m está resuelta: no lo está."]}]}, {"id": "t7", "titulo": "Del prototipo a un salto real", "peso": 3, "intro": "La sección E del enunciado. El control individual evalúa si domina esto, así que conviene poder deducirlo en la pizarra.", "bloques": [{"tipo": "texto", "titulo": "El parámetro λ", "md": "Para una cuerda de sección uniforme $k=EA/L_0$ (Beer et al., 2002). Al reemplazar en las fórmulas aparece $kL_0=EA$, que no depende de $L_0$. Se define\n\n$$\\lambda=\\frac{kL_0}{mg}=\\frac{EA}{mg}$$\n\ny en un salto real (sin hilo, $L=L_0$) todo queda en función de $\\lambda$."}, {"tipo": "formula", "tex": "\\frac{u_{\\max}}{L_0}=\\frac{1+\\sqrt{1+2\\lambda}}{\\lambda},\\qquad \\frac{|a|_{\\max}}{g}=\\sqrt{1+2\\lambda}", "nota": "Ecuación (23) del informe."}, {"tipo": "texto", "titulo": "Efecto de L₀ y de A", "md": "- **Largo natural.** Con el mismo material y sección, $\\lambda$ no cambia: la deformación relativa y la aceleración máxima tampoco. El salto completo se escala en proporción a $L_0$ (el doble de largo, el doble de profundidad). $L_0$ ajusta la profundidad a la altura disponible.\n- **Sección.** Si sube $A$, sube $\\lambda$: la cuerda es más rígida, el salto es menos profundo pero la aceleración máxima aumenta. Hay un compromiso entre profundidad, deformación y aceleración."}, {"tipo": "tabla", "titulo": "Condiciones de seguridad", "columnas": ["Condición", "Se escribe", "Resultado"], "filas": [["No tocar el suelo", "$L_0\\left(1+\\frac{1+\\sqrt{1+2\\lambda}}{\\lambda}\\right)\\le H-h_s-D_{seg}$", "ecuación (24)"], ["Elongación máxima del 400 %", "$u_{\\max}\\le4L_0$", "$\\lambda\\ge5/8$"], ["Aceleración máxima ≤ 3 g", "$\\sqrt{1+2\\lambda}\\le3$", "$\\lambda\\le4$"], ["Ambas", "—", "$5/8\\le\\lambda\\le4$"], ["Hong Kong (largo estirado ≤ 4 $L_0$)", "$u_{\\max}\\le3L_0$", "$\\lambda\\ge8/9$"]]}, {"tipo": "gadget", "id": "g_lambda", "titulo": "Zona segura en λ", "instrucciones": "Mueve λ y mira si cumple las dos condiciones. Abajo, para una cuerda con EA dado, el rango de masas admisibles."}, {"tipo": "texto", "titulo": "Una cuerda para dos saltadores", "md": "Con $EA$ fijo, $\\lambda$ es inversamente proporcional a $m$, y $5/8\\le\\lambda\\le4$ se convierte en $\\dfrac{EA}{4g}\\le m\\le\\dfrac{8EA}{5g}$ (la masa máxima es 6,4 veces la mínima).\n\nEl más pesado tiene menor $\\lambda$: se estira más y llega más abajo (crítico para tocar el suelo y para el 400 %). El más liviano tiene mayor $\\lambda$: llega menos abajo pero sufre más aceleración (crítico para 3 g). Una misma cuerda no es razonable para masas muy distintas. Se propone mantener $\\lambda$ con hebras en paralelo, $n_2/n_1=m_2/m_1$; acortar $L_0$ solo corrige la profundidad."}, {"tipo": "texto", "titulo": "Precisión a gran escala", "md": "Para un salto de 60 m con tolerancia de 30 cm: $E_{H,\\max}=\\dfrac{0{,}30}{60}\\times100=0{,}5\\,\\%$. En el prototipo $E_H$ fue de 3,9 a 11,7 %: entre 8 y 23 veces mayor. Un salto de 60 m se predeciría con un error de entre 2,4 y 7,0 m.\n\nTampoco es razonable suponer que $E_H$ se mantiene: la resistencia del aire crece con la velocidad (más de 17 m/s en un salto real contra unos 4 m/s en el prototipo), la masa de la cuerda pesa más y la no linealidad del caucho depende de la deformación."}, {"tipo": "ojo", "items": ["Confundir el 400 % de elongación (largo estirado = 5 veces el natural) con \"largo estirado 4 veces\".", "Creer que alargar $L_0$ reduce la aceleración: no lo hace, solo profundiza el salto.", "El límite de 3 g es de personas: el prototipo llega a unos 3 g con 514 g y a 4,5 g con 214,5 g y no pasa nada."]}]}, {"id": "c2", "titulo": "Control · Ecuación auxiliar y solución particular constante", "peso": 3, "intro": "Es el primer paso para resolver la etapa 2 del salto ($m\\ddot u+ku=mg$) y el modelo con amortiguamiento. Tiene que salirte automático.", "bloques": [{"tipo": "texto", "titulo": "La idea: probar con una exponencial", "md": "En $ay''+by'+cy=0$ con $a,b,c$ constantes, se prueba $y=e^{mx}$. Como $(e^{mx})'=me^{mx}$ y $(e^{mx})''=m^2e^{mx}$, todo queda multiplicado por $e^{mx}\\neq 0$ y sobrevive solo el polinomio:"}, {"tipo": "formula", "tex": "am^2+bm+c=0", "nota": "ecuación auxiliar o característica"}, {"tipo": "texto", "titulo": "Los tres casos", "md": "Las raíces de $am^2+bm+c=0$ caen en uno de tres casos:"}, {"tipo": "tabla", "columnas": ["Raíces", "Conjunto fundamental", "Solución general"], "filas": [["Reales distintas $m_1\\neq m_2$", "$e^{m_1x},\\ e^{m_2x}$", "$c_1e^{m_1x}+c_2e^{m_2x}$"], ["Real doble $m$", "$e^{mx},\\ xe^{mx}$", "$(c_1+c_2x)e^{mx}$"], ["Complejas $\\alpha\\pm\\beta i$", "$e^{\\alpha x}\\cos\\beta x,\\ e^{\\alpha x}\\sin\\beta x$", "$e^{\\alpha x}(c_1\\cos\\beta x+c_2\\sin\\beta x)$"]]}, {"tipo": "nota", "md": "El caso complejo usa $e^{i\\theta}=\\cos\\theta+i\\sin\\theta$."}, {"tipo": "gadget", "id": "g_raices", "titulo": "Mueve a, b, c y mira qué caso te toca", "instrucciones": "Ajusta los coeficientes de $ay''+by'+cy=0$. Se muestran el discriminante, las raíces, la $y_h$ y la solución con $y(0)=1$, $y'(0)=0$. Busca: ¿qué pasa en el gráfico cuando las raíces son complejas? ¿Y cuando son positivas?"}, {"tipo": "texto", "titulo": "Lado derecho constante: la solución particular", "md": "Si $ay''+by'+cy=K$ con $c\\neq0$ y $K$ constante, se propone $y_p=A$: queda $cA=K$, es decir $A=K/c$. La solución general es $y=y_h+y_p$ y las constantes salen de las condiciones iniciales.\n\nEn el salto: $m\\ddot u+ku=mg$ da $u_p=mg/k=\\delta_e$, la elongación de equilibrio, y $u_h=c_1\\cos\\omega s+c_2\\sin\\omega s$ con $r=\\pm i\\omega$."}, {"tipo": "ejemplo", "titulo": "Clase 11: PVI con raíz doble", "enunciado": "Resuelva $y''-2\\sqrt5\\,y'+5y=0$, $y(0)=0$, $y'(0)=3$.", "pasos": [{"titulo": "Auxiliar", "md": "$m^2-2\\sqrt5m+5=(m-\\sqrt5)^2=0$ → $m=\\sqrt5$ doble."}, {"titulo": "General", "md": "$y=(c_1+c_2x)e^{\\sqrt5x}$"}, {"titulo": "Condiciones", "md": "$y(0)=c_1=0$. $y'=c_2e^{\\sqrt5x}+\\sqrt5(c_1+c_2x)e^{\\sqrt5x}$ ⇒ $y'(0)=c_2=3$."}], "respuesta": "$y=3xe^{\\sqrt5x}$"}, {"tipo": "ojo", "items": ["Con raíces $\\pm\\beta i$ (sin parte real) poner $e^{x}$: si $\\alpha=0$ la exponencial es $e^{0}=1$.", "En la raíz doble escribir $c_1e^{mx}+c_2e^{mx}$ (son la misma función: falta la $x$).", "Usar $\\cos(\\beta x)$ con el $\\beta$ mal: para $r=-\\frac12\\pm\\frac{\\sqrt3}{2}i$ es $\\cos\\frac{\\sqrt3}{2}x$."]}]}, {"id": "c4", "titulo": "Control · Sistemas masa-resorte", "peso": 3, "intro": "Es el modelo físico del proyecto (etapa 2 del salto). Los puntos están en plantear bien (Hooke, la EDO, los signos de las condiciones iniciales) más que en resolver, que ya sabes hacer con la ecuación auxiliar.", "bloques": [{"tipo": "texto", "titulo": "Ley de Hooke y la constante k", "md": "El resorte ejerce una fuerza restauradora proporcional al estiramiento: $F=ks$. Al colgar la masa, llega al **equilibrio** cuando el peso iguala a esa fuerza:\n$$mg=ks.$$\nDe aquí sale $k$ (o $m$). Ojo con las unidades: si te dan el **peso** en libras, la masa es $m=W/g=W/32$ slug; si te dan la masa en kg, el peso es $W=9{,}8\\,m$ N."}, {"tipo": "tabla", "columnas": ["Sistema", "Masa", "Fuerza", "$g$"], "filas": [["Inglés", "slug", "libra (lb)", "$32$ pie/s²"], ["SI", "kg", "newton (N)", "$9{,}8$ m/s²"], ["CGS", "g", "dina", "$980$ cm/s²"]]}, {"tipo": "ejemplo", "titulo": "Clase 15, ejemplo 3: sacar m y k", "enunciado": "Una masa que pesa 16 lb se une a un resorte de 5 pies de largo. En equilibrio el resorte mide 8,2 pies. ¿Cuánto valen $m$ y $k$?", "pasos": [{"titulo": "Masa", "md": "$m=\\frac{W}{g}=\\frac{16}{32}=\\frac12$ slug"}, {"titulo": "Estiramiento", "md": "$s=8{,}2-5=3{,}2$ pies"}, {"titulo": "Hooke", "md": "$k=\\frac{W}{s}=\\frac{16}{3{,}2}=5$ lb/pie"}], "respuesta": "$m=\\tfrac12$ slug, $k=5$ lb/pie"}, {"tipo": "texto", "titulo": "La ecuación de movimiento", "md": "Si $x(t)$ es el desplazamiento medido **desde el equilibrio**, la segunda ley de Newton da (el peso se cancela con $ks$):\n$$m\\frac{d^2x}{dt^2}+c\\frac{dx}{dt}+kx=f(t)$$\n- $c\\ge 0$: constante de amortiguamiento (roce $=c\\,x'$). \"Fuerza amortiguadora igual a 2 veces la velocidad\" ⇒ $c=2$.\n- $f(t)$: fuerza externa (si no hay, movimiento **libre**).\n\n**Convención de clase: abajo es positivo.** Si el enunciado fija otra (la pauta 29/04 toma arriba positivo), úsala y dilo explícitamente."}, {"tipo": "tabla", "columnas": ["El enunciado dice…", "con abajo positivo"], "filas": [["\"se suelta / se libera desde el reposo\"", "$x'(0)=0$"], ["\"3 m bajo la posición de equilibrio\"", "$x(0)=3$"], ["\"1 pie sobre / arriba del equilibrio\"", "$x(0)=-1$"], ["\"desde la posición de equilibrio\"", "$x(0)=0$"], ["\"velocidad de 10 pie/s hacia arriba\" / \"ascendente\"", "$x'(0)=-10$"], ["\"velocidad hacia abajo de 2 m/s\"", "$x'(0)=2$"]]}, {"tipo": "lapiz", "texto": "condiciones iniciales: 2 a 3 pts por pregunta"}, {"tipo": "gadget", "id": "g_signos", "titulo": "Traductor de condiciones iniciales", "instrucciones": "Lee el enunciado generado al azar, escribe $x(0)$ y $x'(0)$ con la convención indicada y revisa. Repite hasta que no te equivoques nunca."}, {"tipo": "texto", "titulo": "Movimiento libre no amortiguado", "md": "Con $c=0$ y $f=0$: $x''+\\omega^2x=0$, $\\omega^2=\\frac km$. La auxiliar $r^2+\\omega^2=0$ da $r=\\pm\\omega i$:\n$$x(t)=c_1\\cos\\omega t+c_2\\sin\\omega t$$\n- **Frecuencia circular** $\\omega=\\sqrt{k/m}$ (rad/s)\n- **Periodo** $T=\\frac{2\\pi}{\\omega}$ (tiempo de un ciclo)\n- **Frecuencia** $f=\\frac1T=\\frac{\\omega}{2\\pi}$ (ciclos por segundo)\n- **Amplitud** $A=\\sqrt{c_1^2+c_2^2}$"}, {"tipo": "ejemplo", "titulo": "Guía 3, ejercicio 9", "enunciado": "Un cuerpo de 0,25 kg está unido a un resorte que se estira 0,25 m con una fuerza de 9 N. En $t=0$ se estira 1 m por debajo del equilibrio y se libera con velocidad de 5 m/s hacia arriba. Halle $x(t)$, amplitud y periodo.", "pasos": [{"titulo": "Constantes", "md": "$k=\\frac{9}{0{,}25}=36$ N/m, $\\omega=\\sqrt{36/0{,}25}=12$."}, {"titulo": "PVI", "md": "$x''+144x=0$, $x(0)=1$, $x'(0)=-5$."}, {"titulo": "Resolver", "md": "$x=c_1\\cos12t+c_2\\sin12t$: $c_1=1$, $12c_2=-5$ ⇒ $c_2=-\\frac5{12}$."}, {"titulo": "A y T", "md": "$A=\\sqrt{1+\\frac{25}{144}}=\\frac{13}{12}$ m, $T=\\frac{2\\pi}{12}=\\frac\\pi6$ s."}], "respuesta": "$x(t)=\\cos12t-\\frac5{12}\\sin12t$, $A=\\frac{13}{12}$ m, $T=\\frac\\pi6$ s"}, {"tipo": "texto", "titulo": "Movimiento libre amortiguado: los tres casos", "md": "Con roce: $mx''+cx'+kx=0$, o normalizada $x''+\\frac cmx'+\\frac kmx=0$. Las raíces son\n$$\\lambda_{1,2}=-\\frac{c}{2m}\\pm\\frac{1}{2m}\\sqrt{c^2-4mk}$$\ny el signo de $c^2-4mk$ decide el tipo de movimiento. Con $\\alpha=\\frac c{2m}$:"}, {"tipo": "tabla", "columnas": ["Caso", "Condición", "Solución", "Comportamiento"], "filas": [["Sobreamortiguado", "$c^2>4mk$", "$c_1e^{\\lambda_1t}+c_2e^{\\lambda_2t}$ (ambas $\\lambda<0$)", "No oscila; vuelve lento al equilibrio"], ["Crítico", "$c^2=4mk$", "$(c_1+c_2t)e^{-\\alpha t}$", "No oscila; cruza $x=0$ a lo más una vez"], ["Subamortiguado", "$c^2<4mk$", "$e^{-\\alpha t}(c_1\\cos\\omega^*t+c_2\\sin\\omega^*t)$", "Oscila con amplitud que decae como $Ae^{-\\alpha t}$"]]}, {"tipo": "formula", "tex": "\\omega^*=\\frac{1}{2m}\\sqrt{4mk-c^2}=\\sqrt{\\frac km-\\frac{c^2}{4m^2}}", "nota": "frecuencia del caso subamortiguado"}, {"tipo": "gadget", "id": "g_resorte", "titulo": "Simulador masa-resorte", "instrucciones": "Ajusta $m$, $c$, $k$ y las condiciones iniciales. Se clasifica el caso con $c^2$ vs $4mk$ y se cuentan los cruces por el equilibrio. Prueba los botones con los problemas de controles."}, {"tipo": "ejemplo", "titulo": "Clase 15, ejemplo 2 (amortiguamiento crítico)", "enunciado": "Una masa que pesa 8 lb alarga 2 pies un resorte. Una fuerza amortiguadora igual a dos veces la velocidad actúa sobre el sistema. Determine la ecuación de movimiento si se libera desde el equilibrio con velocidad ascendente de 3 pie/s.", "pasos": [{"titulo": "Datos", "md": "$m=\\frac8{32}=\\frac14$ slug, $k=\\frac82=4$ lb/pie, $c=2$."}, {"titulo": "EDO", "md": "$\\frac14x''+2x'+4x=0\\Rightarrow x''+8x'+16x=0$. Como $c^2=4=4mk=4$: **crítico**."}, {"titulo": "Resolver", "md": "$(r+4)^2=0$ ⇒ $x=(c_1+c_2t)e^{-4t}$. $x(0)=0$ ⇒ $c_1=0$; $x'(0)=c_2=-3$."}], "respuesta": "$x(t)=-3te^{-4t}$"}, {"tipo": "ojo", "items": ["Usar el peso (lb) como si fuera masa: 8 lb ⇒ $m=8/32$ slug.", "Signo de las condiciones iniciales: \"sobre\" y \"hacia arriba\" son negativos con abajo positivo.", "Contar cruces por el equilibrio con $t<0$: en $(2+4t)e^{-2t}=0$ la raíz $t=-\\frac12$ no cuenta → 0 cruces.", "Clasificar con $c^2$ vs $4k$ olvidando la $m$: es $c^2$ vs $4mk$."]}, {"tipo": "texto", "titulo": "Tu resorte del proyecto en las tres categorías", "md": "Para la pesa de 514 g y el elástico de $k=25{,}72$ N/m: $4mk=52{,}9$ y el amortiguamiento crítico es $c_{crit}=2\\sqrt{km}=7{,}27$ kg/s. El $c=0{,}68$ kg/s ajustado a los saltos da $c^2=0{,}46\\ll4mk$: **subamortiguado**, con $\\zeta=c/c_{crit}=0{,}094$.\n\nCon $\\alpha=c/(2m)=0{,}661$ 1/s y $\\omega^*=\\sqrt{\\omega^2-\\alpha^2}=7{,}043$ rad/s, el período es $T^*=2\\pi/\\omega^*=0{,}892$ s y en cada ciclo la amplitud se multiplica por $e^{-\\alpha T^*}=0{,}55$."}, {"tipo": "tabla", "titulo": "Clasificación con $m=0{,}514$ kg y $k=25{,}72$ N/m", "columnas": ["Caso", "Condición", "Ejemplo"], "filas": [["Subamortiguado", "$c^2<4mk$", "$c=0{,}68$ kg/s"], ["Crítico", "$c^2=4mk$", "$c=7{,}27$ kg/s"], ["Sobreamortiguado", "$c^2>4mk$", "$c=12$ kg/s"]]}, {"tipo": "nota", "md": "En el salto el oscilador no completa ciclos: cuando el peso sube, la cuerda se afloja y vuelve la caída libre. Pero la clasificación y las fórmulas de $\\alpha$ y $\\omega^*$ son las mismas del capítulo."}]}, {"id": "c5", "titulo": "Control · Resolver a mano el modelo del salto", "peso": 3, "intro": "El control evalúa si dominas la resolución del proyecto. Esto es lo que tienes que poder escribir en una hoja: el PVI de cada etapa, la solución, el empalme y los valores.", "bloques": [{"tipo": "texto", "titulo": "Plantear las dos etapas como PVI", "md": "**Etapa 1, cuerda floja.** $m\\ddot y=mg$, con $y(0)=0$ y $\\dot y(0)=0$. Integrando dos veces: $y=\\tfrac12gt^2$. Se tensa cuando $y=L_c$: $t^*=\\sqrt{2L_c/g}$ y $v^*=\\sqrt{2gL_c}$.\n\n**Etapa 2, cuerda tensa.** Con $u=y-L_c$: $m\\ddot u+ku=mg$, con $u(t^*)=0$ y $\\dot u(t^*)=v^*$.\n\nSi el enunciado da el peso $W$ y no la masa: $m=W/g$. Si un peso estira el resorte una distancia $s$ en equilibrio: $k=W/s$ (ley de Hooke)."}, {"tipo": "texto", "titulo": "Resolver la etapa 2 de dos maneras", "md": "**Coeficientes indeterminados.** La homogénea $m\\ddot u+ku=0$ tiene ecuación auxiliar $mr^2+k=0$, es decir $r=\\pm i\\omega$ con $\\omega=\\sqrt{k/m}$. Entonces $u_h=c_1\\cos\\omega s+c_2\\sin\\omega s$, con $s=t-t^*$. El lado derecho es constante, así que se propone $u_p=A$ y se obtiene $kA=mg$, o sea $A=\\delta_e=mg/k$. Las condiciones $u(t^*)=0$ y $\\dot u(t^*)=v^*$ dan $c_1=-\\delta_e$ y $c_2=v^*/\\omega$.\n\n**Cambio de variable (clase 14).** Con $x=u-\\delta_e$ (desplazamiento desde el equilibrio) queda $\\ddot x+\\omega^2x=0$, el movimiento libre no amortiguado, con $x(t^*)=-\\delta_e$ y $\\dot x(t^*)=v^*$. La solución es la misma."}, {"tipo": "formula", "tex": "u(t)=\\delta_e\\left[1-\\cos\\omega s\\right]+\\frac{v^*}{\\omega}\\sin\\omega s,\\qquad R=\\sqrt{\\delta_e^2+\\left(\\frac{v^*}{\\omega}\\right)^2},\\quad u_{\\max}=\\delta_e+R", "nota": "Oscilación armónica alrededor de $\\delta_e$; su extremo inferior es $u_{\\max}$."}, {"tipo": "formula", "tex": "u(t)=\\delta_e+e^{-\\alpha s}\\left[-\\delta_e\\cos\\omega^*s+\\frac{v^*-\\alpha\\delta_e}{\\omega^*}\\sin\\omega^*s\\right],\\quad \\alpha=\\frac{c}{2m},\\ \\omega^*=\\sqrt{\\omega^2-\\alpha^2}", "nota": "Con amortiguamiento subamortiguado ($c^2<4mk$). El punto más bajo ocurre en $s_{\\min}=\\frac1{\\omega^*}\\left[\\pi-\\arctan\\frac{v^*\\omega^*}{g-\\alpha v^*}\\right]$ (con $g-\\alpha v^*>0$)."}, {"tipo": "tabla", "titulo": "Notación del proyecto frente a la del curso", "columnas": ["Proyecto", "Curso (clases 14 y 15)", "Relación"], "filas": [["$u$: elongación desde el largo natural", "$x$: desplazamiento desde el equilibrio, positivo hacia abajo", "$x=u-\\delta_e$"], ["$\\omega=\\sqrt{k/m}$", "$w=\\sqrt{k/m}$, frecuencia circular", "igual"], ["$c=2\\zeta\\sqrt{km}$", "$c$: constante de amortiguamiento, $F=c\\,x'$", "igual; $\\zeta=c/c_{crit}$"], ["$t^*$: instante de empalme", "condiciones iniciales $x(t_0)$, $x'(t_0)$", "se resuelve con $s=t-t^*$"]]}, {"tipo": "gadget", "id": "g_resolver", "titulo": "Resolución completa con tus números", "instrucciones": "Mueve m, k, L_c y c. Se muestra el PVI, el caso de la ecuación auxiliar, la solución y los valores; compara con tu cálculo a mano."}, {"tipo": "ejemplo", "titulo": "Pesa de 214,5 g con el mismo elástico, sin amortiguamiento", "enunciado": "Con $k=25{,}72$ N/m y $L_c=0{,}77$ m, determina $t^*$, $v^*$, la solución de la etapa 2, $u_{\\max}$, $t_{\\min}$ y la distancia al suelo si $H=1{,}70$ m, $L_0=0{,}59$ m y $h_s=0{,}18$ m.", "pasos": [{"titulo": "Etapa 1", "md": "$t^*=\\sqrt{2\\cdot0{,}77/9{,}81}=0{,}396$ s y $v^*=\\sqrt{2\\cdot9{,}81\\cdot0{,}77}=3{,}887$ m/s."}, {"titulo": "Etapa 2: datos", "md": "$\\omega=\\sqrt{25{,}72/0{,}2145}=10{,}950$ rad/s y $\\delta_e=\\dfrac{0{,}2145\\cdot9{,}81}{25{,}72}=8{,}18$ cm."}, {"titulo": "Solución", "md": "$u=\\delta_e[1-\\cos\\omega s]+\\dfrac{v^*}{\\omega}\\sin\\omega s$ con $\\dfrac{v^*}{\\omega}=35{,}50$ cm."}, {"titulo": "Elongación máxima", "md": "$R=\\sqrt{8{,}18^2+35{,}50^2}=36{,}43$ cm y $u_{\\max}=\\delta_e+R=44{,}61$ cm."}, {"titulo": "Instante y distancia al suelo", "md": "$t_{\\min}=t^*+\\dfrac1\\omega\\left[\\pi-\\arctan\\dfrac{v^*}{\\omega\\delta_e}\\right]=0{,}560$ s. $D=1{,}70-0{,}59-0{,}18-0{,}446=48{,}4$ cm."}], "respuesta": "$u_{\\max}=44{,}6$ cm, $t_{\\min}=0{,}56$ s y $D=48{,}4$ cm.", "lapiz": "escribe el PVI antes de resolver: ahí está la mitad del puntaje"}, {"tipo": "ojo", "items": ["Dar las condiciones iniciales de la etapa 2 en $t=0$ en vez de $t^*$ (o no usar $s=t-t^*$).", "Olvidar la solución particular: sin $\\delta_e$ la oscilación quedaría centrada en $u=0$.", "Cambiar el signo de $g$ al pasar de $u$ a $x$: la ecuación en $x$ ya no tiene $mg$ a la derecha."]}]}, {"id": "c8", "titulo": "Control · Mínimos cuadrados y error estándar", "peso": 2, "intro": "El ajuste de $F$ contra $x$ es el corazón experimental. Debes poder calcular a mano una recta de mínimos cuadrados, su $R^2$ y el error de la pendiente, y propagar esos errores a $h_1$.", "bloques": [{"tipo": "texto", "titulo": "De los datos a las fórmulas", "md": "Con $n$ puntos $(x_i,y_i)$, $\\bar x$ y $\\bar y$ los promedios, y\n\n$$S_{xx}=\\sum(x_i-\\bar x)^2,\\quad S_{xy}=\\sum(x_i-\\bar x)(y_i-\\bar y),\\quad S_{yy}=\\sum(y_i-\\bar y)^2$$\n\nla recta $y=kx+b$ que minimiza $\\sum(y_i-kx_i-b)^2$ tiene $k=S_{xy}/S_{xx}$ y $b=\\bar y-k\\bar x$."}, {"tipo": "formula", "tex": "s^2=\\frac{SSE}{n-2},\\quad SE(k)=\\frac{s}{\\sqrt{S_{xx}}},\\quad SE(b)=s\\sqrt{\\frac1n+\\frac{\\bar x^2}{S_{xx}}},\\quad R^2=1-\\frac{SSE}{S_{yy}}", "nota": "$SSE=\\sum(y_i-\\hat y_i)^2$. Se divide por $n-2$ porque se estimaron dos parámetros."}, {"tipo": "ejemplo", "titulo": "Recta por mínimos cuadrados a mano", "enunciado": "Ajusta una recta a los puntos $(1,2)$, $(2,4)$, $(3,5)$ y calcula $R^2$ y $SE(k)$.", "pasos": [{"titulo": "Promedios y sumas", "md": "$\\bar x=2$, $\\bar y=3{,}667$. $S_{xx}=1+0+1=2$ y $S_{xy}=(-1)(-1{,}667)+0+(1)(1{,}333)=3$."}, {"titulo": "Pendiente e intercepto", "md": "$k=3/2=1{,}5$ y $b=3{,}667-1{,}5\\cdot2=0{,}667$."}, {"titulo": "Residuos", "md": "Valores ajustados $2{,}167;\\ 3{,}667;\\ 5{,}167$. Residuos $-0{,}167;\\ 0{,}333;\\ -0{,}167$. $SSE=0{,}1667$."}, {"titulo": "$R^2$ y error estándar", "md": "$S_{yy}=4{,}667$, $R^2=1-0{,}1667/4{,}667=0{,}964$. $s^2=SSE/(3-2)=0{,}1667$ y $SE(k)=\\sqrt{s^2/S_{xx}}=0{,}2887$."}], "respuesta": "$y=1{,}5x+0{,}667$, $R^2=0{,}964$, $SE(k)=0{,}289$."}, {"tipo": "tabla", "titulo": "Los 6 puntos del proyecto (x en m, F en N)", "columnas": ["$\\bar x$", "$\\bar y$", "$S_{xx}$", "$S_{xy}$", "$k$", "$b$", "$s$", "$SE(k)$", "$SE(b)$", "$R^2$"], "filas": [["0,328", "8,93", "0,344", "8,844", "25,72", "0,487", "1,13", "1,93", "0,78", "0,978"]]}, {"tipo": "texto", "titulo": "Propagación del error a $h_1$", "md": "Si $h_1$ depende de parámetros medidos $p_i$ con incertidumbres $\\sigma_i$ independientes, $\\sigma_{h_1}^2=\\sum_i\\left(\\dfrac{\\partial h_1}{\\partial p_i}\\right)^2\\sigma_i^2$.\n\nPara 514 g, $H=1{,}81$ m, $\\delta=3$ cm: $\\dfrac{\\partial h_1}{\\partial k}=0{,}0204$ m/(N/m), así que $\\sigma_k=1{,}93$ N/m aporta 3,9 cm. $\\dfrac{\\partial h_1}{\\partial h_s}=-1{,}33$, así que $\\sigma_{h_s}=1{,}5$ cm aporta 2,0 cm. Juntas: $\\sigma_{h_1}=4{,}4$ cm, el ±4,5 cm del informe. La masa ($\\partial h_1/\\partial m=-1{,}02$ m/kg) con ±1 g aporta solo 0,1 cm."}, {"tipo": "gadget", "id": "g_propaga", "titulo": "Quién domina el error de h₁", "instrucciones": "Cambia las incertidumbres de cada parámetro. El gráfico muestra cuánto aporta cada una a σ(h₁); la simulación confirma el resultado."}, {"tipo": "ojo", "items": ["Dividir por $n$ y no por $n-2$ en $s^2$.", "Interpretar $R^2=0{,}978$ como \"es lineal\": la curvatura se ve en los residuos.", "Sumar las incertidumbres en vez de combinarlas en cuadratura."]}]}], "quiz": [{"tema": "t1", "dif": 1, "q": "¿Qué magnitudes son continuas en el instante $t^*$ en que la cuerda queda tensa?", "op": ["La posición y la velocidad", "La posición y la aceleración", "La velocidad y la aceleración", "Solo la posición"], "ok": 0, "exp": "La cuerda no puede producir saltos bruscos de posición ni de velocidad. La aceleración sí cambia de golpe, de $g$ a $g-ku/m$."}, {"tema": "t1", "dif": 1, "q": "¿En qué punto del movimiento es máxima la aceleración (en magnitud)?", "op": ["En el punto más bajo", "En el instante de máxima velocidad", "En $t^*$, cuando la cuerda se tensa", "Al soltar el peso"], "ok": 0, "exp": "En el instante de máxima velocidad $a=0$. La aceleración crece en magnitud con la elongación y es máxima en el punto más bajo: $|a|_{\\max}=g\\sqrt{1+2kL/(mg)}$."}, {"tema": "t1", "dif": 2, "q": "En la etapa 2, ¿cuándo se cumple $a=0$ (máxima velocidad)?", "op": ["Cuando $u=mg/k$", "Cuando $u=u_{\\max}$", "Cuando $u=0$", "Cuando $t=t^*$"], "ok": 0, "exp": "$a=g-\\frac{k}{m}u=0$ da $u=mg/k=\\delta_e$. Ahí el peso y la fuerza elástica se igualan."}, {"tema": "t1", "dif": 2, "tipo": "num", "q": "Con $m=0{,}514$ kg, $k=25{,}72$ N/m y $L_c=0{,}77$ m, calcula $u_{\\max}$ en cm.", "ok": 77.9, "tol": 0.5, "exp": "$u_{\\max}=\\frac{mg}{k}\\left(1+\\sqrt{1+\\frac{2kL_c}{mg}}\\right)=0{,}196\\cdot3{,}976=0{,}779$ m."}, {"tema": "t1", "dif": 2, "q": "Si se duplica la masa (mismos $k$ y $L$), la elongación máxima:", "op": ["Crece, pero menos que el doble", "Se duplica exactamente", "No cambia", "Disminuye"], "ok": 0, "exp": "$u_{\\max}$ va de $\\sqrt{2mgL/k}$ (masa chica) a $2mg/k$ (masa grande): crece siempre menos que el doble."}, {"tema": "t1", "dif": 3, "q": "¿Por qué en el prototipo la caída libre del amarre es 0,77 m y no 0,59 m?", "op": ["Porque la base parte a nivel de la varilla y el mosquetón queda $h_s=18$ cm más arriba", "Porque el elástico mide 0,77 m", "Por la masa de la cuerda", "Por la resistencia del aire"], "ok": 0, "exp": "El mosquetón es el amarre. Parte $h_s+\\delta$ sobre la varilla y la cuerda se tensa a $L_0$ bajo ella: cae $L_0+h_s+\\delta$."}, {"tema": "t2", "dif": 1, "q": "¿Qué mide $h_2$ el día de la validación?", "op": ["La altura del punto más alto en el primer rebote", "La altura del punto más bajo", "La altura de la plataforma", "La altura de la posición de equilibrio"], "ok": 0, "exp": "El momento 1 es el punto más bajo ($h_1$). El momento 2 es hasta dónde se devuelve el peso."}, {"tema": "t2", "dif": 1, "q": "Con el modelo ideal (sin pérdidas), ¿a qué altura sube el peso después del primer descenso?", "op <script>
/* ===== utilidades compartidas ===== */
const TX = (v, d = 3) => U.fmt(v, d).replace(",", "{,}");           // número con coma decimal para LaTeX
const sgn = (v, d = 3) => (v < 0 ? "-" : "+") + TX(Math.abs(v), d);   // " + 3" / " - 3"
const near = (a, b, e = 1e-9) => Math.abs(a - b) < e;
const limpia = s => s.replace(/e\^\{1x\}/g, "e^{x}").replace(/e\^\{-1x\}/g, "e^{-x}").replace(/e\^\{0x\}/g, "").replace(/x\^\{1\}/g, "x").replace(/x\^\{0\}/g, "")
  .replace(/\\(cos|sin) 1([xt])/g, "\\$1 $2").replace(/\((1)\\ln x\)/g, "(\\ln x)").replace(/\\pm1(\\,)?i/g, "\\pm i");   // 1x → x, x^{1} → x, ±1i → ±i
const lead = (v, d = 2) => near(v, 1) ? "" : near(v, -1) ? "-" : TX(v, d);                      // coeficiente líder
const term = (v, s, d = 2) => near(v, 0) ? "" : (v < 0 ? "-" : "+") + (near(Math.abs(v), 1) && s ? "" : TX(Math.abs(v), d)) + s; // término intermedio
function rk4(f, y0, t0, t1, h) {                                     // y' = f(t, y), y vector
  const out = [{t: t0, y: y0.slice()}]; let y = y0.slice(), t = t0; const n = Math.round((t1 - t0) / h);
  for (let i = 0; i < n; i++) {
    const k1 = f(t, y), k2 = f(t + h / 2, y.map((v, j) => v + h / 2 * k1[j])), k3 = f(t + h / 2, y.map((v, j) => v + h / 2 * k2[j])), k4 = f(t + h, y.map((v, j) => v + h * k3[j]));
    y = y.map((v, j) => v + h / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j])); t += h; out.push({t, y: y.slice()});
  }
  return out;
}
function interp(arr, t) {                                            // arr ordenado por t
  if (t <= arr[0].t) return arr[0].y[0];
  if (t >= arr[arr.length - 1].t) return arr[arr.length - 1].y[0];
  const h = arr[1].t - arr[0].t, i = Math.floor((t - arr[0].t) / h), a = arr[i], b = arr[i + 1] || a, w = (t - a.t) / h;
  return a.y[0] * (1 - w) + b.y[0] * w;
}
function stepper(el, U, problemas) {                                 // ejercicio con pasos revelables

    U.tex(box);

/* ===== T1: intervalo del teorema ===== */
GADGETS["g_raices"] = (el, U) => {
  let a = 1, b = 2, c = 5; const out = U.el("div", {class: "g-out"});
  U.slider(el, {label: "a", min: 1, max: 4, step: 0.5, value: 1, onInput: v => { a = v; upd(); }});
  U.slider(el, {label: "b", min: -6, max: 6, step: 0.5, value: 2, onInput: v => { b = v; upd(); }});
  U.slider(el, {label: "c", min: -6, max: 12, step: 0.5, value: 5, onInput: v => { c = v; upd(); }});
  const plot = U.plot(el, {xmin: 0, xmax: 6, ymin: -2, ymax: 2, height: 220}); el.append(out);
  function upd() {
    const D = b * b - 4 * a * c; let caso, yh;
    if (D > 1e-9) { const r1 = (-b + Math.sqrt(D)) / (2 * a), r2 = (-b - Math.sqrt(D)) / (2 * a); caso = `Reales distintas: $m_1=${TX(r1)}$, $m_2=${TX(r2)}$`; yh = `c_1e^{${TX(r1)}x}+c_2e^{${TX(r2)}x}`; }
    else if (D > -1e-9) { const r = -b / (2 * a); caso = `Real doble: $m=${TX(r)}$`; yh = `(c_1+c_2x)e^{${TX(r)}x}`; }
    else { const al = -b / (2 * a), be = Math.sqrt(-D) / (2 * a); caso = `Complejas: $m=${TX(al)}\\pm${TX(be)}\\,i$`; yh = (near(al, 0) ? "" : `e^{${TX(al)}x}`) + `\\left(c_1\\cos ${TX(be)}x+c_2\\sin ${TX(be)}x\\right)`; }
    const sol = rk4((t, y) => [y[1], -(b * y[1] + c * y[0]) / a], [1, 0], 0, 6, 0.01);
    plot.draw({fns: [{f: t => interp(sol, t), c: 0}]});
    const tend = D < -1e-9 ? (b > 0 ? "oscila y se apaga" : b < 0 ? "oscila y crece" : "oscila sin decaer") : (Math.max(-b + Math.sqrt(Math.max(D, 0)), -b) > 0 ? "crece sin oscilar" : "decae sin oscilar");
    out.innerHTML = `Auxiliar: $${lead(a)}m^2${term(b, "m")}${term(c, "")}=0$, discriminante $\\Delta=${TX(D, 2)}$<br>${limpia(caso)}<br>$y_h=${limpia(yh)}$<br><span style="color:var(--muted)">Con $y(0)=1$, $y'(0)=0$ la solución ${tend}.</span>`;
    U.tex(out);
  }
};

/* ===== Núcleo del modelo (mismo cálculo que modelo_dia.py) =====
   x = elongación de la cuerda (x < 0: cuerda floja). F = caída libre efectiva = ℓ + L0 + h_s + δ.
   Con la cuerda tensa: m x'' = m g − k x − b x'. b = 2 ζ √(k m). */
const BG = 9.81, BK = 25.72, BL0 = 0.59, BHS = 0.18, BZETA = 0.094;

function bSim(m, F, b, k, dt, wantTraj) {
  dt = dt || 0.0002;
  const acc = (x, v) => x > 0 ? BG - (k * x + b * v) / m : BG;
  let x = -F, v = 0, t = 0, taut = false, passed = false, xmax = -Infinity, tmin = 0, xap = Infinity, tap = 0;
  const traj = wantTraj ? [] : null, every = Math.max(1, Math.round(0.008 / dt));
  let step = 0;
  while (t < 4) {
    if (traj && step % every === 0) traj.push([t, x]);
    const a1 = acc(x, v);
    const x2 = x + v * dt / 2, v2 = v + a1 * dt / 2, a2 = acc(x2, v2);
    const x3 = x + v2 * dt / 2, v3 = v + a2 * dt / 2, a3 = acc(x3, v3);
    const x4 = x + v3 * dt, v4 = v + a3 * dt, a4 = acc(x4, v4);
    const nx = x + dt / 6 * (v + 2 * v2 + 2 * v3 + v4);
    const nv = v + dt / 6 * (a1 + 2 * a2 + 2 * a3 + a4);
    t += dt; step++;
    if (!passed) {
      if (nx > 0) taut = true;
      if (taut && nv < 0) { passed = true; xmax = nx; tmin = t; xap = nx; }
    } else {
      if (nx < xap) xap = nx;
      if (nv > 0) { tap = t; if (traj) traj.push([t, nx]); break; }
    }
    x = nx; v = nv;
  }
  return {xmax, xap, tmin, tap, traj};
}

/* Predicción de h1 (punto más bajo) y h2 (ápice del primer rebote). Longitudes en m; zeta = 0 es el modelo ideal. */
function bPred(o) {
  const H = o.H, m = o.m, ell = o.ell || 0, delta = o.delta || 0, zeta = o.zeta == null ? BZETA : o.zeta;
  const hs = o.hs == null ? BHS : o.hs, k = o.k || BK, l0 = o.l0 == null ? BL0 : o.l0;
  const F = ell + l0 + hs + delta, b = 2 * zeta * Math.sqrt(k * m);
  const r = bSim(m, F, b, k, o.dt, o.traj);
  const h1 = H - ell - l0 - hs - r.xmax, reb = r.xmax - r.xap, desc = F + r.xmax;
  const traj = r.traj ? r.traj.map(([t, x]) => [t, (H + delta - (F + x)) * 100]) : null;
  return {h1, h2: h1 + reb, reb, desc, ratio: reb / desc, xmax: r.xmax, tmin: r.tmin, F,
          ts: Math.sqrt(2 * F / BG), amaxG: Math.sqrt(1 + 2 * k * F / (m * BG)), traj};
}

/* hilo ℓ que deja h1 = target (m) con el modelo pedido; null si no hay solución con ℓ ≥ 0 */
function bDisenoEll(o) {
  const f = ell => bPred(Object.assign({}, o, {ell, traj: false, dt: o.dt || 0.001})).h1 - o.target;
  let lo = 0, hi = 1.6;
  if (f(lo) < 0) return {ell: 0, ok: false, motivo: "aun con ℓ = 0 queda más abajo que el objetivo"};
  if (f(hi) > 0) return {ell: hi, ok: false, motivo: "no alcanza ni con ℓ = 1,6 m"};
  for (let i = 0; i < 26; i++) { const mid = (lo + hi) / 2; (f(mid) > 0 ? (lo = mid) : (hi = mid)); }
  return {ell: (lo + hi) / 2, ok: true};
}

if (typeof module !== "undefined") module.exports = {bSim, bPred, bDisenoEll, BG, BK, BL0, BHS, BZETA};

GADGETS["g_resolver"] = (el, U) => {
  const S = {m: 514, k: 25.72, L: 0.77, c: 0};
  const out = U.el("div", {class: "g-out"});
  const mk = (key, label, min, max, step) => U.slider(el, {label, min, max, step, value: S[key], onInput: v => { S[key] = v; upd(); }});
  mk("m", "Masa m [g]", 50, 700, 1); mk("k", "Constante k [N/m]", 10, 60, 0.01); mk("L", "Caída libre L_c [m]", 0.2, 1.4, 0.01); mk("c", "Amortiguamiento c [kg/s] (0 = ninguno)", 0, 14, 0.01);
  el.append(out);
  function upd() {
    const m = S.m / 1000, k = S.k, L = S.L, c = S.c, w = Math.sqrt(k / m), de = m * BG / k, ts = Math.sqrt(2 * L / BG), vs = Math.sqrt(2 * BG * L);
    const sim = bSim(m, L, c, k, 0.0004), umax = sim.xmax, tmin = sim.tmin;
    let h = `<b>Etapa 1</b> (cuerda floja): $m\\ddot y=mg$, $y(0)=0$, $\\dot y(0)=0$ ⇒ $y=\\tfrac12gt^2$. Se tensa cuando $y=L_c$: $t^*=${TX(ts, 3)}$ s y $v^*=${TX(vs, 3)}$ m/s.<br>`;
    h += `<b>Etapa 2</b> (cuerda tensa, $s=t-t^*$): $m\\ddot u${c > 0 ? "+c\\dot u" : ""}+ku=mg$, con $u(t^*)=0$ y $\\dot u(t^*)=v^*$.<br>`;

    if (c <= 0) {
      const R = Math.hypot(de, vs / w);
      h += `<b>Ecuación auxiliar:</b> $mr^2+k=0\\Rightarrow r=\\pm i\\omega$, $\\omega=\\sqrt{k/m}=${TX(w, 3)}$ rad/s.<br>`;
      h += `<b>Solución:</b> $u=\\delta_e[1-\\cos\\omega s]+\\dfrac{v^*}{\\omega}\\sin\\omega s$ con $\\dfrac{v^*}{\\omega}=${TX(vs / w * 100, 2)}$ cm.<br>`;
      h += `<b>Amplitud:</b> $R=\\sqrt{\\delta_e^2+(v^*/\\omega)^2}=${TX(R * 100, 2)}$ cm ⇒ $u_{\\max}=\\delta_e+R=${TX((de + R) * 100, 2)}$ cm.<br>`;
      h += `<b>Instante del punto más bajo:</b> $t_{\\min}=t^*+\\dfrac1\\omega\\left[\\pi-\\arctan\\dfrac{v^*}{\\omega\\delta_e}\\right]=${TX(ts + (Math.PI - Math.atan(vs / (w * de))) / w, 3)}$ s.<br>`;
      h += `<b>Aceleración máxima</b> (punto más bajo): $g\\sqrt{1+2kL_c/(mg)}=${TX(BG * Math.sqrt(1 + 2 * k * L / (m * BG)), 1)}$ m/s² $=${TX(Math.sqrt(1 + 2 * k * L / (m * BG)), 2)}\\,g$.`;
    } else {

        h += `<b>Ecuación auxiliar:</b> $mr^2+cr+k=0$, $c^2=${TX(c * c, 3)}<4mk=${TX(4 * m * k, 2)}$ ⇒ <b>subamortiguado</b>: $r=-\\alpha\\pm i\\omega^*$ con $\\alpha=\\dfrac{c}{2m}=${TX(al, 3)}$ 1/s y $\\omega^*=\\sqrt{\\omega^2-\\alpha^2}=${TX(wd, 3)}$ rad/s.<br>`;

      } else if (disc < 1e-9) {
        h += `<b>Ecuación auxiliar:</b> $c^2=4mk$ ⇒ <b>críticamente amortiguado</b>: raíz doble $r=-\\alpha=${TX(-al, 3)}$ 1/s.<br><b>Solución:</b> $u=\\delta_e+(C_1+C_2s)e^{-\\alpha s}$ con $C_1=-\\delta_e=${TX(-de * 100, 2)}$ cm y $C_2=v^*-\\alpha\\delta_e=${TX(vs - al * de, 3)}$ m/s.`;
      } else {
        const r1 = (-c + Math.sqrt(disc)) / (2 * m), r2 = (-c - Math.sqrt(disc)) / (2 * m), C2 = (vs + r1 * de) / (r2 - r1), C1 = -de - C2;
        h += `<b>Ecuación auxiliar:</b> $c^2=${TX(c * c, 2)}>4mk=${TX(4 * m * k, 2)}$ ⇒ <b>sobreamortiguado</b>: $r_1=${TX(r1, 3)}$ y $r_2=${TX(r2, 3)}$ 1/s.<br><b>Solución:</b> $u=\\delta_e+C_1e^{r_1s}+C_2e^{r_2s}$ con $C_1=${TX(C1 * 100, 2)}$ cm y $C_2=${TX(C2 * 100, 2)}$ cm (de $u(t^*)=0$ y $\\dot u(t^*)=v^*$).`;
      }
      h += isFinite(umax) ? `<br><b>Punto más bajo</b> (simulación de las dos etapas): $u_{\\max}=${TX(umax * 100, 2)}$ cm en $t_{\\min}=${TX(tmin, 3)}$ s.`
        : `<br><b>No hay rebote:</b> $u$ crece hacia $\\delta_e=${TX(de * 100, 2)}$ cm sin pasarse, y la masa se asienta sin oscilar. No existe un punto más bajo con $\\dot u=0$.`;
    }
    out.innerHTML = h; U.tex(out);
  }
};

    const sd = Math.sqrt(tot) * 100;

    for (let i = 0; i < n; i++) { const p = {}; Object.keys(base).forEach(key => p[key] = base[key] + (sig[key] ? sig[key] * g() : 0)); vals.push(h1(p) * 100); }
    const mean = U.mean(vals), msd = U.sd(vals);
    ch.data.labels = ["k", "h_s", "m", "H", "δ"]; ch.data.datasets[0].data = ["k", "hs", "m", "H", "d"].map(x => +ctr[x].c.toFixed(2)); ch.update("none");
    out.innerHTML = `$\\sigma_{h_1}=\\sqrt{\\sum_i\\left(\\dfrac{\\partial h_1}{\\partial p_i}\\sigma_i\\right)^2}=${TX(sd, 2)}$ cm (simulación de ${n} saltos: ${U_fmt(msd, 2)} cm) · $h_1=${TX(h1(base) * 100, 1)}$ cm<br>` +
