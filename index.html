\lambda\\ge5/8$", "$\\lambda\\le5/8$", "$\\lambda\\ge4$", "$\\lambda\\le4$"], "ok": 0, "exp": "$\\sqrt{1+2\\lambda}\\le4\\lambda-1$ lleva a $\\lambda(16\\lambda-10)\\ge0$, es decir $\\lambda\\ge5/8$."}, {"tema": "t7", "dif": 2, "q": "La condición $|a|_{\\max}\\le3g$ equivale a:", "op": ["$\\lambda\\le4$", "$\\lambda\\ge4$", "$\\lambda\\le3$", "$\\lambda\\ge5/8$"], "ok": 0, "exp": "$\\sqrt{1+2\\lambda}\\le3$ da $1+2\\lambda\\le9$, es decir $\\lambda\\le4$."}, {"tema": "t7", "dif": 2, "q": "Si se duplica $L_0$ (mismo material y sección):", "op": ["Todo el salto se escala ×2 y la aceleración máxima no cambia", "La aceleración máxima se duplica", "La cuerda se vuelve el doble de rígida", "El salto no cambia"], "ok": 0, "exp": "$\\lambda=EA/(mg)$ no depende de $L_0$. $u_{\\max}/L_0$ y $|a|_{\\max}/g$ quedan iguales."}, {"tema": "t7", "dif": 2, "q": "Si se duplica el área $A$ (mismo material y largo):", "op": ["El salto es menos profundo pero con mayor aceleración máxima", "El salto es más profundo", "No cambia nada", "Disminuye la aceleración máxima"], "ok": 0, "exp": "$\\lambda$ se duplica: menos elongación relativa y más $|a|_{\\max}/g$."}, {"tema": "t7", "dif": 3, "q": "Para dos saltadores de masas muy distintas con una misma cuerda, el caso crítico del saltador pesado es:", "op": ["Tocar el suelo y la elongación del 400 %", "La aceleración de 3 g", "Ninguno", "La rotura inmediata"], "ok": 0, "exp": "El pesado tiene menor $\\lambda$: se estira más y llega más abajo. El liviano es el crítico para la aceleración."}, {"tema": "t7", "dif": 2, "tipo": "num", "q": "$|a|_{\\max}/g$ para $\\lambda=2$.", "ok": 2.236, "tol": 0.01, "exp": "$\\sqrt{1+2\\cdot2}=\\sqrt5=2{,}236$."}, {"tema": "t7", "dif": 3, "tipo": "num", "q": "Con $EA=1400$ N, ¿cuál es la masa mínima admisible $EA/(4g)$ en kg?", "ok": 35.7, "tol": 0.2, "exp": "$1400/(4\\cdot9{,}81)=35{,}7$ kg. La máxima es $8EA/(5g)=228$ kg."}, {"tema": "c1", "dif": 1, "q": "¿Cuál de estas EDO es lineal?", "op": ["$x^2y''+e^xy'-y=\\sin x$", "$yy''+y'=0$", "$y''+\\sin y=0$", "$(y')^2+y=x$"], "ok": 0, "exp": "Es lineal si $y$ y sus derivadas aparecen a la primera potencia, multiplicadas solo por funciones de $x$. $yy''$, $\\sin y$ y $(y')^2$ rompen la linealidad."}, {"tema": "c1", "dif": 2, "q": "Para $(x-1)y''-xy'+y=0$ con $y(3)=1$, $y'(3)=0$, ¿en qué intervalo garantiza el teorema una solución única?", "op": ["$(1,\\infty)$", "$\\mathbb R$", "$(-\\infty,1)$", "$(0,\\infty)$"], "ok": 0, "exp": "$a_2(x)=x-1$ se anula en $x=1$. El intervalo más grande que contiene a $x_0=3$ sin ese punto es $(1,\\infty)$."}, {"tema": "c1", "dif": 1, "q": "$W[e^x,xe^x]$ es:", "op": ["$e^{2x}$", "$0$", "$xe^{2x}$", "$-e^{2x}$"], "ok": 0, "exp": "$W=e^x(1+x)e^x-e^x\\cdot xe^x=e^{2x}$. El error típico es derivar $xe^x$ como $e^x$ (olvidar la regla del producto)."}, {"tema": "c1", "dif": 2, "q": "El conjunto $\\{1,\\cos 2x,\\cos^2x\\}$ en $\\mathbb R$ es:", "op": ["LD, porque $\\cos^2x=\\frac{1+\\cos2x}{2}$", "LI, porque son tres funciones distintas", "LI, porque su wronskiano es 1", "LD, porque $\\cos 2x$ se anula en algunos puntos"], "ok": 0, "exp": "Basta mostrar una combinación nula con constantes no todas cero: $\\frac12\\cdot1+\\frac12\\cos2x-\\cos^2x=0$. Ser \"distintas\" no implica LI."}, {"tema": "c1", "dif": 2, "q": "Si $y_1$, $y_2$ son soluciones de $y''+P(x)y'+Q(x)y=0$ en $I$ (con $P,Q$ continuas) y $W[y_1,y_2](x_0)=0$ para algún $x_0\\in I$, entonces:", "op": ["Son LD en $I$ (por Abel, $W\\equiv0$)", "Son LI en $I$", "No se puede concluir nada", "$y_1=y_2$"], "ok": 0, "exp": "Por la fórmula de Abel $W=ce^{-\\int P}$: si se anula en un punto, $c=0$ y $W\\equiv0$, así que son LD (Guía 3, ej. 7). Ser LD no significa que sean iguales: pueden ser múltiplos."}, {"tema": "c1", "dif": 1, "q": "Si $y_h=c_1e^x+c_2e^{2x}$ y $y_p=3x$ es una solución particular, la solución general de la no homogénea es:", "op": ["$c_1e^x+c_2e^{2x}+3x$", "$3x$", "$c_1e^x+c_2e^{2x}$", "$c_1(e^x+3x)+c_2e^{2x}$"], "ok": 0, "exp": "Siempre $y=y_h+y_p$. La particular no lleva constante."}, {"tema": "c1", "dif": 2, "q": "Si $y_{p1}$ resuelve $L(y)=t^2+1$ y $y_{p2}$ resuelve $L(y)=e^t$, ¿qué resuelve $y_{p1}-y_{p2}$?", "op": ["$L(y)=t^2+1-e^t$", "$L(y)=t^2+1+e^t$", "$L(y)=0$", "Nada: no se pueden restar"], "ok": 0, "exp": "Por linealidad $L(y_{p1}-y_{p2})=L(y_{p1})-L(y_{p2})$. Es el principio de superposición para no homogéneas."}, {"tema": "c1", "dif": 3, "q": "¿Cuántas condiciones iniciales necesita un PVI de $y'''-3y''+4y'-12y=e^{3x}$ para tener solución única?", "op": ["3, todas en el mismo $x_0$", "2", "1", "3, en puntos distintos"], "ok": 0, "exp": "Orden $n=3$ ⇒ $y(x_0)$, $y'(x_0)$ e $y''(x_0)$. Si son en puntos distintos ya es un problema de frontera, no un PVI."}, {"tema": "c2", "dif": 1, "q": "La solución general de $y''+y'-6y=0$ es:", "op": ["$C_1e^{-3x}+C_2e^{2x}$", "$C_1e^{3x}+C_2e^{-2x}$", "$e^{-x/2}(C_1\\cos x+C_2\\sin x)$", "$(C_1+C_2x)e^{2x}$"], "ok": 0, "exp": "$m^2+m-6=(m+3)(m-2)$ ⇒ $m=-3,\\,2$. El distractor con signos cambiados es leer las raíces de los factores al revés."}, {"tema": "c2", "dif": 1, "q": "La solución general de $y''-2y'+y=0$ es:", "op": ["$C_1e^x+C_2xe^x$", "$C_1e^x+C_2e^x$", "$C_1e^x+C_2e^{-x}$", "$C_1\\cos x+C_2\\sin x$"], "ok": 0, "exp": "$(r-1)^2=0$: raíz doble $r=1$. La segunda función lleva una $x$ (pauta 29/04: 2 pts por reconocer la raíz doble)."}, {"tema": "c2", "dif": 2, "q": "La solución general de $2y''-4y'+8y=0$ es:", "op": ["$e^x(C_1\\cos\\sqrt3x+C_2\\sin\\sqrt3x)$", "$e^{2x}(C_1\\cos2x+C_2\\sin2x)$", "$C_1e^{x}+C_2e^{\\sqrt3x}$", "$e^x(C_1\\cos3x+C_2\\sin3x)$"], "ok": 0, "exp": "Divide por 2: $m^2-2m+4=0$ ⇒ $m=1\\pm\\sqrt3\\,i$ (Guía 3, ej. 3b). El $\\beta$ es $\\sqrt3$, no $3$."}, {"tema": "c2", "dif": 2, "q": "La ecuación $y'''-3y''+4y'-12y=0$ tiene solución general:", "op": ["$C_1e^{3x}+C_2\\cos2x+C_3\\sin2x$", "$C_1e^{3x}+C_2e^{2x}+C_3e^{-2x}$", "$C_1e^{-3x}+C_2\\cos2x+C_3\\sin2x$", "$C_1e^{3x}+e^{2x}(C_2\\cos x+C_3\\sin x)$"], "ok": 0, "exp": "$(r^2+4)(r-3)=0$ ⇒ $r=3$ y $r=\\pm2i$. $r^2+4$ da raíces imaginarias, no $\\pm2$ (pauta 30/04)."}, {"tema": "c2", "dif": 3, "q": "¿Cuál es la menor orden de una EDO lineal homogénea de coeficientes constantes reales que tenga a $e^x$ y $\\sin x$ como soluciones?", "op": ["3", "2", "4", "1"], "ok": 0, "exp": "Necesita las raíces $1$ y $\\pm i$ ($\\sin x$ arrastra a $\\cos x$): $(r-1)(r^2+1)$, grado 3. Por eso el V/F del Control 29/04 es **falso** para orden 2."}, {"tema": "c2", "dif": 2, "q": "Si la auxiliar es $m^3(m-1)^2(m+1)^2=0$, ¿cuántas constantes tiene $y_h$?", "op": ["7", "3", "5", "6"], "ok": 0, "exp": "La suma de multiplicidades es $3+2+2=7$, igual al orden (Clase 11)."}, {"tema": "c2", "dif": 2, "q": "La solución general de $y'''+y=0$ es:", "op": ["$C_1e^{-x}+e^{x/2}\\left(C_2\\cos\\frac{\\sqrt3}2x+C_3\\sin\\frac{\\sqrt3}2x\\right)$", "$C_1e^{-x}+C_2\\cos x+C_3\\sin x$", "$C_1e^{x}+e^{-x/2}\\left(C_2\\cos\\frac{\\sqrt3}2x+C_3\\sin\\frac{\\sqrt3}2x\\right)$", "$(C_1+C_2x+C_3x^2)e^{-x}$"], "ok": 0, "exp": "$m^3+1=(m+1)(m^2-m+1)$ ⇒ $m=-1$ y $m=\\frac12\\pm\\frac{\\sqrt3}2i$ (Clase 11)."}, {"tema": "c2", "dif": 3, "tipo": "num", "q": "Resuelve $y''-6y'+5y=0$, $y(0)=3$, $y'(0)=11$. ¿Cuánto vale el coeficiente de $e^{5x}$?", "ok": 2, "tol": 0.001, "exp": "$y=C_1e^x+C_2e^{5x}$: $C_1+C_2=3$, $C_1+5C_2=11$ ⇒ $C_2=2$, $C_1=1$ (Guía 3, ej. 4a)."}, {"tema": "c3", "dif": 1, "q": "Para $y''-2y'+y=\\sin x$ la propuesta correcta es:", "op": ["$A\\sin x+B\\cos x$", "$A\\sin x$", "$Ax\\sin x+Bx\\cos x$", "$Ae^x\\sin x$"], "ok": 0, "exp": "El número de prueba es $i$, que no es raíz de $(r-1)^2$. Hay que poner seno **y** coseno: al derivar se mezclan (pauta 29/04)."}, {"tema": "c3", "dif": 2, "q": "Para $y'''-3y''+4y'-12y=e^{3x}$, la propuesta es:", "op": ["$Axe^{3x}$", "$Ae^{3x}$", "$Ax^2e^{3x}$", "$(Ax+B)e^{3x}$"], "ok": 0, "exp": "$3$ es raíz simple de la auxiliar, así que se multiplica por $x^1$. Con $Ae^{3x}$ se obtiene $0=1$ (pauta 30/04, 3 pts)."}, {"tema": "c3", "dif": 2, "q": "Para $y''-2y'+y=-e^t$ (variable $t$), la propuesta es:", "op": ["$Dt^2e^t$", "$Dte^t$", "$De^t$", "$(Dt+E)e^t$"], "ok": 0, "exp": "$r=1$ es raíz **doble**: $s=2$ ⇒ $Dt^2e^t$. Así lo hace la pauta del control de 60 min."}, {"tema": "c3", "dif": 2, "q": "Para $y''+2y'+y=x+\\cos x$, ¿cuál es la forma de $y_p$?", "op": ["$a+bx+c\\sin x+d\\cos x$", "$bx+d\\cos x$", "$x(a+bx)+c\\sin x+d\\cos x$", "$(a+bx)e^{-x}+c\\cos x$"], "ok": 0, "exp": "Polinomio de grado 1 completo (número 0, no es raíz) más seno y coseno (número $i$, no es raíz). La forma vale 8 de 15 pts en esa pauta."}, {"tema": "c3", "dif": 1, "q": "¿Para cuál de estas EDO **no** sirve coeficientes indeterminados?", "op": ["$y''+y=\\tan x$", "$y''+y=x^2e^x$", "$y''-4y=\\cos 3x$", "$y''+y'=10x^4+2$"], "ok": 0, "exp": "$\\tan x$ no es de la familia polinomio·exponencial·seno/coseno: sus derivadas no se \"cierran\". Hay que usar variación de parámetros."}, {"tema": "c3", "dif": 2, "q": "En variación de parámetros, para $x^2y''-2xy'+2y=x^2\\ln x$ la función $f$ que va en $W_1,W_2$ es:", "op": ["$\\ln x$", "$x^2\\ln x$", "$\\frac{\\ln x}{x^2}$", "$x\\ln x$"], "ok": 0, "exp": "Primero se normaliza dividiendo por $x^2$: $y''-\\frac2xy'+\\frac2{x^2}y=\\ln x$ (2 pts en la pauta 30/04)."}, {"tema": "c3", "dif": 2, "q": "Con $y_1=e^{3t}$, $y_2=te^{3t}$, el wronskiano vale:", "op": ["$e^{6t}$", "$te^{6t}$", "$3e^{6t}$", "$0$"], "ok": 0, "exp": "$W=e^{3t}(1+3t)e^{3t}-3e^{3t}\\cdot te^{3t}=e^{6t}$ (control de 60 min, P2)."}, {"tema": "c3", "dif": 3, "q": "Una solución particular de $y''-6y'+9y=t^{-3}e^{3t}$ es:", "op": ["$\\dfrac{e^{3t}}{2t}$", "$\\dfrac{e^{3t}}{t}$", "$-\\dfrac{e^{3t}}{2t^2}$", "$At^{-3}e^{3t}$"], "ok": 0, "exp": "$u_1'=-t^{-2}$ ⇒ $u_1=\\frac1t$; $u_2'=t^{-3}$ ⇒ $u_2=-\\frac1{2t^2}$; $y_p=\\frac{e^{3t}}t-\\frac{e^{3t}}{2t}=\\frac{e^{3t}}{2t}$."}, {"tema": "c3", "dif": 2, "tipo": "num", "q": "En $y'''-3y''+4y'-12y=e^{3x}$ con $y_p=Axe^{3x}$, ¿cuánto vale $A$? (usa coma o punto)", "ok": 0.0769231, " a": "c4", "dif": 2, "q": "¿Cuántas veces puede pasar por el equilibrio una masa críticamente amortiguada?", "op": ["A lo más una vez", "Nunca", "Infinitas veces", "Exactamente dos veces"], "ok": 0, "exp": "$x=(c_1+c_2t)e^{-\\alpha t}$ y $c_1+c_2t$ tiene a lo más un cero (Clase 15). En el control 29/04 ese cero estaba en $t<0$, así que fueron 0 veces."}, {"tema": "c4", "dif": 2, "q": "Un sistema sin amortiguamiento $x''+x=2\\cos t$ presenta:", "op": ["Resonancia: $x_p=t\\sin t$ crece sin límite", "Amortiguamiento crítico", "Movimiento acotado de amplitud 2", "Pulsaciones que decaen"], "ok": 0, "exp": "$\\omega=1$ coincide con la frecuencia de la fuerza: el número $i$ es raíz y $x_p=t(\\dots)$ (Control 2025-2, P3)."}, {"tema": "c4", "dif": 1, "tipo": "num", "q": "Una masa de 2 slug estira un resorte 2 pies ($g=32$). ¿Cuánto vale $k$ en lb/pie?", "ok": 32, "tol": 0.001, "exp": "$mg=ks$ ⇒ $2\\cdot32=k\\cdot2$ ⇒ $k=32$ (pauta 30/04, 3 pts)."}, {"tema": "c4", "dif": 2, "tipo": "num", "q": "$m=0{,}25$ kg y $k=36$ N/m sin roce. ¿Cuál es el periodo $T$ en segundos? (3 decimales)", "ok": 0.5236, "tol": 0.002, "exp": "$\\omega=\\sqrt{36/0{,}25}=12$ ⇒ $T=\\frac{2\\pi}{12}=\\frac\\pi6\\approx0{,}524$ s (Guía 3, ej. 9)."}, {"tema": "c4", "dif": 3, "q": "$x''+2x'+2x=0$, $x(0)=3$, $x'(0)=0$ da $x=3e^{-t}(\\cos t+\\sin t)$. ¿Cuándo pasa por primera vez por el equilibrio?", "op": ["$t=\\frac{3\\pi}{4}$", "$t=\\frac\\pi4$", "$t=\\frac\\pi2$", "Nunca"], "ok": 0, "exp": "$\\cos t+\\sin t=0$ ⇒ $\\tan t=-1$; el primer $t>0$ es $\\frac{3\\pi}4$ (Guía 3, ej. 8). $\\frac\\pi4$ es donde $\\tan t=+1$."}, {"tema": "c5", "dif": 1, "q": "La ecuación auxiliar de la homogénea $m\\ddot u+ku=0$ es:", "op": ["$mr^2+k=0$, con raíces $\\pm i\\omega$", "$mr^2+kr=0$", "$r^2+k=mg$", "$r^2-\\omega^2=0$"], "ok": 0, "exp": "Se reemplaza $u=e^{rt}$: $mr^2+k=0$, así que $r=\\pm i\\sqrt{k/m}$ y la solución oscila."}, {"tema": "c5", "dif": 2, "q": "Para $m\\ddot u+ku=mg$, ¿qué solución particular se propone?", "o <script>
/* ===== utilidades compartidas ===== */
const TX = (v, d = 3) => U.fmt(v, d).replace(",", "{,}");           // número con coma decimal para LaTeX
const sgn = (v, d = 3) => (v < 0 ? "-" : "+") + TX(Math.abs(v), d);   // " + 3" / " - 3"
const near = (a, b, e = 1e-9) => Math.abs(a - b) < e;
const limpia = s => s.replace(/e\^\{1x\}/g, "e^{x}").replace(/e\^\{-1x\}/g, "e^{-x}").replace(/e\^\{0x\}/g, "").replace(/x\^\{1\}/g, "x").replace(/x\^\{0\}/g, "")
  .replace(/\\(cos|sin) 1([xt])/g, "\\$1 $2").replace(/\((1)\\ln x\)/g, "(\\ln x)").replace(/\\pm1(\\,)?i/g, "\\pm i");   // 1x → x, x^{1} → x, ±1i → ±i
const lead = (v, d = 2) => near(v, 1) ? "" : near(v, -1) ? "-" : TX(v, d);                      // coeficiente líder
const term = (v, s, d = 2) => near(v, 0) ? "" : (v < 0 ? "-" : "+") + (near(Math.abs(v), 1) && s ? "" : TX(Math.abs(v), d)) + s; // término intermedio
function rk4(f, y0, t0, t1, h) {                                     // y' = f(t, y), y vector
  const out = [{t: t0, y: y0.slice()}]; let y = y0.slice(), t = t0; const n = Math.round((t1 - t0) / h);
  for (let i = 0; i < n; i++) {
    const k1 = f(t, y), k2 = f(t + h / 2, y.map((v, j) => v + h / 2 * k1[j])), k3 = f(t + h / 2, y.map((v, j) => v + h / 2 * k2[j])), k4 = f(t + h, y.map((v, j) => v + h * k3[j]));
    y = y.map((v, j) => v + h / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j])); t += h; out.push({t, y: y.slice()});
  }
  return out;
}
function interp(arr, t) {                                            // arr ordenado por t
  if (t <= arr[0].t) return arr[0].y[0];
  if (t >= arr[arr.length - 1].t) return arr[arr.length - 1].y[0];
  const h = arr[1].t - arr[0].t, i = Math.floor((t - arr[0].t) / h), a = arr[i], b = arr[i + 1] || a, w = (t - a.t) / h;
  return a.y[0] * (1 - w) + b.y[0] * w;
}
function stepper(el, U, problemas) {                                 // ejercicio con pasos revelables

}

/* ===== T1: intervalo del teorema ===== */
GADGETS["g_intervalo"] = (el, U) => {
  const P = Math.PI;
  const eqs = [
    {n: "(x−1)y'' − xy' + y = 0", tex: "(x-1)y''-xy'+y=0", s: [1], why: "a_2(x)=x-1"},
    {n: "x²y'' − xy' + y = 0", tex: "x^2y''-xy'+y=0", s: [0], why: "a_2(x)=x^2"},
    {n: "(1−x²)y'' − 2xy' + 2y = 0", tex: "(1-x^2)y''-2xy'+2y=0", s: [-1, 1], why: "a_2(x)=1-x^2"},
    {n: "xy'' − (x+1)y' + y = x²", tex: "xy''-(x+1)y'+y=x^2", s: [0], why: "a_2(x)=x"},
    {n: "y'' + y = tan x", tex: "y''+y=\\tan x", s: [-3 * P / 2, -P / 2, P / 2, 3 * P / 2], why: "g(x)=\\tan x \\text{ no es continua}"},
    {n: "3y''' + 5y'' − y' + 7y = 0", tex: "3y'''+5y''-y'+7y=0", s: [], why: "a_3=3\\neq0"},
  ];

  const out = U.el("div", {class: "g-out"});
  U.select(el, {label: "Ecuación", options: eqs.map(e => e.n), onChange: v => { eq = eqs.find(e => e.n === v); upd(); }});
  U.slider(el, {label: "Punto inicial x₀", min: -5, max: 5, step: 0.1, value: 2, onInput: v => { x0 = v; upd(); }});
  const plot = U.plot(el, {xmin: -5, xmax: 5, ymin: -1, ymax: 1, height: 110});
  el.append(out);
  function upd() {
    const s = eq.s;
    if (s.some(p => Math.abs(p - x0) < 0.05)) {
      plot.draw({vlines: s.map(p => ({x: p, c: 3})), points: [{x: x0, y: 0, c: 3, r: 6}]});
      out.innerHTML = `<span class="pill bad">Punto singular</span> En $x_0=${TX(x0, 2)}$ se tiene $${eq.why}$ problemática: el teorema <b>no</b> garantiza nada.`;
      return U.tex(out);
    }
    const L = Math.max(-Infinity, ...s.filter(p => p < x0)), R = Math.min(Infinity, ...s.filter(p => p > x0));
    const a = isFinite(L) ? L : -5, b = isFinite(R) ? R : 5;
    plot.draw({vlines: s.map(p => ({x: p, c: 3})), shade: {f: () => 0.5, a, b, c: 0}, points: [{x: x0, y: 0, c: 1, r: 6}]});
    const f = v => isFinite(v) ? (near(Math.abs(v), P / 2, 1e-6) ? (v < 0 ? "-\\tfrac{\\pi}{2}" : "\\tfrac{\\pi}{2}") : near(Math.abs(v), 3 * P / 2, 1e-6) ? (v < 0 ? "-\\tfrac{3\\pi}{2}" : "\\tfrac{3\\pi}{2}") : TX(v, 2)) : (v < 0 ? "-\\infty" : "\\infty");
    out.innerHTML = `Para $${eq.tex}$ con $x_0=${TX(x0, 2)}$: solución única garantizada en $I=(${f(L)},\\ ${f(R)})$` + (s.length ? `, porque ahí $${eq.why}$ no da problemas.` : `, porque $${eq.why}$ en todo $\\mathbb R$.`);
    U.tex(out);
  }
};

/* ===== Núcleo del modelo (mismo cálculo que modelo_dia.py) =====
   x = elongación de la cuerda (x < 0: cuerda floja). F = caída libre efectiva = ℓ + L0 + h_s + δ.
   Con la cuerda tensa: m x'' = m g − k x − b x'. b = 2 ζ √(k m). */
const BG = 9.81, BK = 25.72, BL0 = 0.59, BHS = 0.18, BZETA = 0.094;

function bSim(m, F, b, k, dt, wantTraj) {
  dt = dt || 0.0002;
  const acc = (x, v) => x > 0 ? BG - (k * x + b * v) / m : BG;
  let x = -F, v = 0, t = 0, taut = false, passed = false, xmax = -Infinity, tmin = 0, xap = Infinity, tap = 0;
  const traj = wantTraj ? [] : null, every = Math.max(1, Math.round(0.008 / dt));
  let step = 0;
  while (t < 4) {
    if (traj && step % every === 0) traj.push([t, x]);
    const a1 = acc(x, v);
    const x2 = x + v * dt / 2, v2 = v + a1 * dt / 2, a2 = acc(x2, v2);
    const x3 = x + v2 * dt / 2, v3 = v + a2 * dt / 2, a3 = acc(x3, v3);
    const x4 = x + v3 * dt, v4 = v + a3 * dt, a4 = acc(x4, v4);
    const nx = x + dt / 6 * (v + 2 * v2 + 2 * v3 + v4);
    const nv = v + dt / 6 * (a1 + 2 * a2 + 2 * a3 + a4);
    t += dt; step++;
    if (!passed) {
      if (nx > 0) taut = true;
      if (taut && nv < 0) { passed = true; xmax = nx; tmin = t; xap = nx; }
    } else {
      if (nx < xap) xap = nx;
      if (nv > 0) { tap = t; if (traj) traj.push([t, nx]); break; }
    }
    x = nx; v = nv;
  }
  return {xmax, xap, tmin, tap, traj};
}

/* Predicción de h1 (punto más bajo) y h2 (ápice del primer rebote). Longitudes en m; zeta = 0 es el modelo ideal. */
function bPred(o) {
  const H = o.H, m = o.m, ell = o.ell || 0, delta = o.delta || 0, zeta = o.zeta == null ? BZETA : o.zeta;
  const hs = o.hs == null ? BHS : o.hs, k = o.k || BK, l0 = o.l0 == null ? BL0 : o.l0;
  const F = ell + l0 + hs + delta, b = 2 * zeta * Math.sqrt(k * m);
  const r = bSim(m, F, b, k, o.dt, o.traj);
  const h1 = H - ell - l0 - hs - r.xmax, reb = r.xmax - r.xap, desc = F + r.xmax;
  const traj = r.traj ? r.traj.map(([t, x]) => [t, (H + delta - (F + x)) * 100]) : null;
  return {h1, h2: h1 + reb, reb, desc, ratio: reb / desc, xmax: r.xmax, tmin: r.tmin, F,
          ts: Math.sqrt(2 * F / BG), amaxG: Math.sqrt(1 + 2 * k * F / (m * BG)), traj};
}

/* hilo ℓ que deja h1 = target (m) con el modelo pedido; null si no hay solución con ℓ ≥ 0 */
function bDisenoEll(o) {
  const f = ell => bPred(Object.assign({}, o, {ell, traj: false, dt: o.dt || 0.001})).h1 - o.target;
  let lo = 0, hi = 1.6;
  if (f(lo) < 0) return {ell: 0, ok: false, motivo: "aun con ℓ = 0 queda más abajo que el objetivo"};
  if (f(hi) > 0) return {ell: hi, ok: false, motivo: "no alcanza ni con ℓ = 1,6 m"};
  for (let i = 0; i < 26; i++) { const mid = (lo + hi) / 2; (f(mid) > 0 ? (lo = mid) : (hi = mid)); }
  return {ell: (lo + hi) / 2, ok: true};
}

if (typeof module !== "undefined") module.exports = {bSim, bPred, bDisenoEll, BG, BK, BL0, BHS, BZETA};

/* ---------- Euler, RK2 y RK4 sobre la etapa 2 ---------- */
GADGETS["g_numerico"] = (el, U) => {
  const S = {h: 0.02, met: "Euler", m: 514, k: 25.72, L: 0.77};
  const out = U.el("div", {class: "g-out"});
  const ch = bChart(U, el, [], "s = t − t* [s]", "elongación u [cm]");
  U.select(el, {label: "Método", options: ["Euler", "RK2", "RK4"], onChange: v => { S.met = v; upd(); }});
  const mk = (key, label, min, max, step) => U.slider(el, {label, min, max, step, value: S[key], onInput: v => { S[key] = v; upd(); }});
  mk("h", "Paso h [s]", 0.005, 0.08, 0.005); mk("m", "Masa m [g]", 100, 700, 1);
  el.append(out);
  function upd() {
    const m = S.m / 1000, k = S.k, w = Math.sqrt(k / m), de = m * BG / k, vs = Math.sqrt(2 * BG * S.L), h = S.h;
    const R = Math.hypot(de, vs / w), umE = de + R, tmE = (Math.PI - Math.atan(vs / (w * de))) / w;
    const f = ([u, v]) => [v, BG - (k / m) * u];
    const add = (a, b, s) => [a[0] + s * b[0], a[1] + s * b[1]];
    let y = [0, vs], t = 0, umax = 0; const pts = [{x: 0, y: 0}];
    const T = tmE * 1.6, n = Math.round(T / h);
    for (let i = 0; i < n; i++) {
      if (S.met === "Euler") y = add(y, f(y), h);
      else if (S.met === "RK2") { const k1 = f(y), k2 = f(add(y, k1, h)); y = [y[0] + h / 2 * (k1[0] + k2[0]), y[1] + h / 2 * (k1[1] + k2[1])]; }
      else { const k1 = f(y), k2 = f(add(y, k1, h / 2)), k3 = f(add(y, k2, h / 2)), k4 = f(add(y, k3, h)); y = [y[0] + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]), y[1] + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1])]; }
      t += h; pts.push({x: t, y: y[0] * 100}); if (y[0] > umax) umax = y[0];
    }
    const ex = []; for (let i = 0; i <= 80; i++) { const s = T * i / 80; ex.push({x: s, y: 100 * (de * (1 - Math.cos(w * s)) + vs / w * Math.sin(w * s))}); }
    ch.data.datasets = [ds("Solución exacta", ex, U.color(2), {borderDash: [6, 4]}), ds(S.met + " con h = " + U_fmt(h, 3) + " s", pts, U.color(0), {pointRadius: 2})];
    ch.update("none");
    out.innerHTML = `$u_{\\max}$ exacto $=${TX(umE * 100, 2)}$ cm · con ${S.met}: $${TX(umax * 100, 2)}$ cm (error ${U_fmt((umax - umE) / umE * 100, 2)} %) · ${n} pasos.<br><small>Euler explícito agrega energía al oscilador: sobreestima la amplitud y el error crece con el tiempo. RK2 y RK4 la conservan mucho mejor con el mismo paso.</small>`;
    U.tex(out);
  }
  upd();
};

    case "formula": return blk(`<div class="formula"><div class="mx">${esc("$$" + b.tex + "$$")}</div><span class="num">(${n}.${++c.eq})</span></div>${b.nota ? md(b.nota) : ""}`);
    case "nota": return node(`<aside class="nota"><span class="lbl">Nota ${n}.${String.fromCharCode(97 + (c.nota = (c.nota || 0) + 1) - 1)}</span>${md(b.md)}</aside>`);
    case "lapiz": return node(`<div class="pen lapiz">${inl(b.texto || b.md)}</div>`);
    case "tabla": return blk((b.titulo ? `<h3 class="h3" style="font-size:1.15rem">${esc(b.titulo)}</h3>` : "") + `<div class="tbl"><table><tr>${(b.columnas || []).map(x => `<th>${inl(x)}</th>`).join("")}</tr>${(b.filas || []).map(f => `<tr>${f.map(x => `<td>${inl(x)}</td>`).join("")}</tr>`).join("")}</table></div>`);
    case "ojo": return blk(`<div class="ojo"><span class="lbl">Errores típicos</span>${md((b.items || []).map(i => "- " + i).join("\n"))}</div>`);
    case "codigo": return blk((b.titulo ? `<h3 class="h3" style="font-size:1.15rem">${esc(b.titulo)}</h3>` : "") + `<pre class="code">${esc(b.codigo)}</pre>${b.salida ? `<div class="out">${esc(b.salida)}</div>` : ""}${b.nota ? md(b.nota) : ""}`);
    case "ejemplo": {
      const e = blk(`<p><b>Ejemplo ${n}.${++c.ej}${b.titulo ? ` — ${esc(b.titulo)}` : ""}.</b></p>${md(b.enunciado)}<div class="row" style="margin-top:8px"></div><div class="hide sol"><p><span class="serif" style="font-style:italic;font-size:1.1em">Solución.</span></p>${pasosHTML(b.pasos)}${b.respuesta ? `<div class="ans">${md(b.respuesta)}</div>` : ""}${b.lapiz ? `<div class="pen" style="margin-top:6px">${inl(b.lapiz)}</div>` : ""}<div class="qed">∎</div></div>`);
      const sol = e.querySelector(".sol"), bt = btn("Ver solución", () => { sol.classList.toggle("hide"); bt.textContent = sol.classList.contains("hide") ? "Ver solución" : "Ocultar solución"; tex(sol); });
      e.querySelector(".row").append(bt); return e;
    }
    case "gadget": {
      const L = String.fromCharCode(65 + c.lab++);
      const e = blk(`<section class="sheet gadget">${sh(`<span class="sec">LAB ${n}.${L}</span>${esc(b.titulo || "")}`, `<span class="lbl">Interactivo</span>`)}<div class="sb">${md(b.instrucciones)}<div class="g-body"></div>${b.figura ? `<p style="font-size:.9rem;color:var(--muted);margin-top:10px"><b>Figura ${n}.${++c.fig}</b> — ${inl(b.figura)}</p>` : ""}</div></section>`);
      const body = e.querySelector(".g-body");
      setTimeout(() => { try { GADGETS[b.id] ? GADGETS[b.id](body, U) : body.append("Gadget no encontrado: " + b.id); tex(body); } catch (err) { body.append("Error en el gadget: " + err.message); console.error(err); } });
      return e;
    }
    default: return blk(md(b.md || ""));
  }
}

/* ---------- autoevaluación ---------- */
function vQuiz(pre) {
  const temas = T.filter(t => Q.some(q => q.tema === t.id));
  const sel = new Set(pre?.temas || temas.map(t => t.id)); let cant = 10, modo = "mix";
  const fall = store.get("fallidas", []);
  main.append(hdr("Autoevaluación · " + Q.length + " preguntas disponibles", "Autoevaluación con diagnóstico", `Responde como en la prueba. Cada respuesta actualiza tu dominio por ${esc(UNI.toLowerCase())}; al final verás tu nota estimada y qué repasar primero.`));
  const c = node(`<section class="sheet">${sh("Configurar ronda")}<div class="sb" style="display:flex;flex-direction:column;gap:12px"></div></section>`), sb = c.querySelector(".sb");
  const grupo = (titulo, items, isOn, onPick) => { const w = node(`<div><div class="lbl" style="margin-bottom:6px">${titulo}</div><div class="row"></div></div>`), r = w.querySelector(".row");
    items.forEach(([v, l]) => { const b = node(`<button class="chip${isOn(v) ? " on" : ""}">${esc(l)}</button>`); b.onclick = () => { onPick(v); r.querySelectorAll(".chip").forEach((x, i) => x.classList.toggle("on", isOn(items[i][0]))); }; r.append(b); }); return w; };
  sb.append(grupo(UNI + "es", temas.map(t => [t.id, `§${idx(t.id)} ${t.titulo}`]), v => sel.has(v), v => sel.has(v) ? sel.delete(v) : sel.add(v)),
    grupo("Cantidad", [[5, "5"], [10, "10"], [20, "20"], [999, "Todas"]], v => v === cant, v => cant = v),
    grupo("Modo", [["mix", "Mezcladas"], ["err", `Solo las que fallé (${fall.length})`]], v => v === modo, v => modo = v),
    node(`<div class="row"></div>`));
  sb.lastChild.append(btn("Comenzar", () => {
    let pool = Q.map((q, i) => ({...q, i})).filter(q => sel.has(q.tema));
    if (modo === "err") pool = pool.filter(q => fall.includes(q.i));
    if (!pool.length) return alert("No hay preguntas con esa selección.");
    pool.sort(() => Math.random() - .5); correr(pool.slice(0, cant));
  }, true));
  main.append(c);
  const hist = store.get("hist", {});
  if (Object.keys(hist).length) main.append(hoja("Historial acumulado", hist, true));
}
function hoja(titulo, st, reset) {
  const ok = Object.values(st).reduce((a, s) => a + s.ok, 0), n = Object.values(st).reduce((a, s) => a + s.n, 0), flojos = [];
  const rows = Object.entries(st).map(([id, s]) => { const p = s.ok / s.n; if (p < 0.6) flojos.push(id);
    return `<tr><td><span class="sec">§${idx(id)}</span>${esc(tituloTema(id))}</td><td class="mono" style="text-align:right;${p < 0.6 ? "color:var(--pen);font-weight:600" : ""}">${s.ok}/${s.n}</td></tr>`; }).join("");
  const c = node(`<section class="sheet">${sh(esc(titulo))}<div class="sb">
    <div class="row" style="gap:16px;align-items:baseline;margin-bottom:12px"><span class="big">${ok}<small>/${n}</small></span><span class="pen" style="font-size:1.7rem">nota estimada ${fmtN(notaCL(n ? ok / n : 0))}</span></div>
    <div class="tbl"><table><tr><th>${esc(UNI)}</th><th style="text-align:right">Correctas</th></tr>${rows}</table></div>
    <p class="lbl" style="margin-top:8px">Escala 1 a 7 con 60 % de exigencia</p></div></section>`);
  if (flojos.length) { const d = node(`<div class="ojo" style="margin-top:14px"><span class="lbl">Repasa primero</span><div class="row" style="margin-top:6px"></div></div>`);
    flojos.forEach(id => d.querySelector(".row").append(btn(`§${idx(id)} ${tituloTema(id)} →`, () => { temaActual = id; go("temas"); }))); c.querySelector(".sb").append(d); }
  if (reset) { const r = node(`<div class="row" style="margin-top:12px"></div>`); r.append(btn("Borrar historial", () => { if (confirm("¿Borrar historial?")) { store.set("hist", {}); store.set("fallidas", []); go("quiz"); } })); c.querySelector(".sb").append(r); }
  return c;
}
function correr(qs) {
  let k = 0; const ses = {}, hist = store.get("hist", {}), fall = new Set(store.get("fallidas", []));
  const show = () => {
    main.innerHTML = "";
    if (k >= qs.length) { main.append(hdr("Autoevaluación · Resultado", "Hoja de resultados", "")); main.append(hoja("Esta ronda", ses));
      const r = node(`<div class="row"></div>`); r.append(btn("Otra ronda", () => go("quiz"), true), btn("Ir a preguntas de práctica", () => go("evals"))); main.append(r); side(); tex(main); return; }
    const q = qs[k], dif = "●".repeat(q.dif || 1) + "○".repeat(3 - (q.dif || 1));
    const c = node(`<section class="sheet">${sh(`<span class="mono" style="font-size:.9rem">Pregunta ${k + 1} de ${qs.length} <span style="color:var(--muted);font-weight:400">· §${idx(q.tema)} · Dificultad ${dif}</span></span>`, q.pts ? `<span class="mono">(${esc(q.pts)} pts)</span>` : "")}<div class="sb"><div class="serif" style="font-size:1.35rem;line-height:1.45;margin-bottom:10px">${md(q.q)}</div><div class="ops"></div><div class="fb"></div><div class="row sp" style="margin-top:14px"><span></span></div></div></section>`);
    const fb = c.querySelector(".fb"), ops = c.querySelector(".ops"), foot = c.querySelector(".row.sp");
    const next = btn(k + 1 < qs.length ? "Siguiente pregunta →" : "Ver hoja de resultados", () => { k++; show(); }, true); next.classList.add("hide"); foot.append(next);
    const mark = ok => {
      for (const o of [ses, hist]) { o[q.tema] = o[q.tema] || {ok: 0, n: 0}; o[q.tema].n++; if (ok) o[q.tema].ok++; }
      ok ? fall.delete(q.i) : fall.add(q.i); store.set("hist", hist); store.set("fallidas", [...fall]);
      fb.innerHTML = `<div style="border-top:1px solid var(--ink);padding-top:12px;margin-top:10px"><span class="serif" style="font-style:italic;font-size:1.15rem">${ok ? "Correcto." : "Incorrecto."}</span> ${md(q.exp)}</div>`;
      next.classList.remove("hide"); side(); tex(fb);
    };
    if (q.tipo === "num") {
      const r = node(`<div class="g-row"><label>Tu respuesta</label><input type="text" inputmode="decimal" placeholder="ej. 4,2"></div>`), i = r.querySelector("input");
      const b = btn("Responder", () => { const x = U.num(i.value); if (isNaN(x)) return; b.disabled = i.disabled = true; const ok = Math.abs(x - q.ok) <= (q.tol ?? 1e-6);
        if (!ok) r.append(node(`<span class="pen">esperado: ${U.fmt(q.ok, 4)}</span>`)); mark(ok); });
      i.addEventListener("keydown", e => e.key === "Enter" && b.click()); r.append(b); ops.append(r);
    } else {
      (q.op || []).map((t, j) => ({t, j})).sort(() => Math.random() - .5).forEach((o, pos) => {
        const b = node(`<button class="opt"><span class="bub">${"abcdefgh"[pos]})</span><span class="tx">${inl(o.t)}</span><span class="tg"></span></button>`);
        b.onclick = () => { ops.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.j === q.ok) { x.classList.add("ok"); x.querySelector(".tg").textContent = "✓ correcta"; } });
          if (o.j !== q.ok) { b.classList.add("bad"); b.querySelector(".tg").textContent = "✗ tu respuesta"; } mark(o.j === q.ok); };
        b.dataset.j = o.j; ops.append(b);
      });
    }
    main.append(c); tex(main);
  };
  show();
}

/* ---------- preguntas de practica ---------- */
function vEvals(pre) {
  const hechas = new Set(store.get("hechas", [])); let ft = pre?.tema || "todos", ff = "todas";
  const fuentes = [...new Set(E.map(e => e.fuente))];
  main.append(hdr(`Preguntas de práctica · ${E.length} preguntas`, "Banco de preguntas de práctica", "Hay dos tipos: preguntas de controles anteriores con pauta oficial, y preguntas probables del profesor en la validación y el control, con resolución propuesta (se indica en cada una). Respóndelas en voz alta antes de abrir la solución."));
  const freq = {}; E.forEach(e => freq[e.tema] = (freq[e.tema] || 0) + 1); const mx = Math.max(1, ...Object.values(freq));
  const top = node(`<section style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end"><div><div class="lbl" style="margin-bottom:6px">Frecuencia por ${esc(UNI.toLowerCase())}</div>${Object.entries(freq).sort((a, b) => b[1] - a[1]).map(([id, n]) => `<div class="freq"><span><span class="sec">§${idx(id)}</span>${esc(tituloTema(id))}</span><div class="hbar"><i style="width:${100 * n / mx}%"></i></div><span class="mono" style="text-align:right">${n}</span></div>`).join("")}</div>
    <div class="sheet" style="padding:14px 20px"><div class="lbl">Resueltas</div><div class="big" id="prog"></div></div></section>`);
  main.append(top);
  const fil = node(`<div class="row"></div>`);
  [["todos", "Todos"], ...Object.keys(freq).map(id => [id, `§${idx(id)} ${tituloTema(id)}`])].forEach(([id, l]) => { const b = node(`<button class="chip${id === ft ? " on" : ""}">${esc(l)}</button>`); b.onclick = () => { ft = id; fil.querySelectorAll(".chip").forEach(x => x.classList.remove("on")); b.classList.add("on"); lista(); }; fil.append(b); });
  if (fuentes.length > 1) { const s = node(`<select aria-label="Filtrar por evaluación"><option value="todas">Todas las evaluaciones</option>${fuentes.map(f => `<option>${esc(f)}</option>`).join("")}</select>`); s.onchange = () => { ff = s.value; lista(); }; fil.append(s); }
  main.append(fil);
  const cont = node(`<div style="display:flex;flex-direction:column;gap:30px"></div>`); main.append(cont);
  const prog = () => $("#prog").innerHTML = `${hechas.size}<small>/${E.length}</small>`;
  function lista() {
    cont.innerHTML = ""; prog();
    E.map((e, i) => ({...e, i})).filter(e => (ft === "todos" || e.tema === ft) && (ff === "todas" || e.fuente === ff)).forEach(e => {
      const of = e.confianza === "pauta";
      const rub = (e.rubrica || []).length ? `<div class="tbl"><table><tr><th>Criterio de la pauta</th><th style="text-align:right">Pts</th></tr>${e.rubrica.map(r => `<tr><td>${inl(r.criterio)}</td><td class="mono" style="text-align:right">${esc(r.pts)}</td></tr>`).join("")}</table></div>`
        : (e.puntaje_max || []).length ? `<div class="lbl" style="color:var(--acc)">Lo que suma puntos</div>${md(e.puntaje_max.map(x => "- " + x).join("\n"))}` : "";
      const desc = [...(e.descuentos || []), ...(e.errores || [])];
      const panes = [
        ["I · Estrategia", (e.estrategia ? md(e.estrategia) : "") + (e.tiempo ? `<div class="pen">tiempo sugerido: ${esc(e.tiempo)}</div>` : "")],
        ["II · Solución", pasosHTML(e.pasos) + (e.respuesta ? `<div class="ans">${md(e.respuesta)}</div>` : "") + `<div class="qed">∎</div>`],
        ["III · Rúbrica de puntaje", rub + (desc.length ? `<div style="margin-top:12px"><div class="lbl" style="color:var(--pen)">Descuentos frecuentes</div>${desc.map(d => `<div class="pen">${inl(d)}</div>`).join("")}</div>` : "") + ((e.variantes || []).length ? `<p class="lbl" style="margin-top:12px">También apareció en: ${e.variantes.map(esc).join(" · ")}</p>` : "")]
      ].filter(p => p[1].replace(/<[^>]+>|∎/g, "").trim());
      const k = node(`<article class="exam"><div class="rot"><div><span class="lbl">Fuente</span>${esc(e.fuente)}${e.pregunta ? " — " + esc(e.pregunta) : ""}</div><div><span class="lbl">Puntaje</span>${esc(e.puntaje || "—")}</div><div class="${of ? "of" : "pr"}"><span class="lbl" style="color:inherit">Solución</span>${of ? "Pauta oficial" : "Propuesta"}</div></div>
        <div class="en"><div class="lbl" style="margin-bottom:6px">§${idx(e.tema)} · ${esc(tituloTema(e.tema))}</div>${md(e.enunciado)}</div><div class="tabs"></div><div class="pane"><p class="lbl">Intenta resolverla antes de abrir la solución.</p></div>
        <div class="foot"><span></span><label class="chk"><input type="checkbox"${hechas.has(e.i) ? " checked" : ""}> La resolví</label></div></article>`);
      const tabs = k.querySelector(".tabs"), pane = k.querySelector(".pane");
      panes.forEach(([l, h]) => { const b = node(`<button class="tab">${l}</button>`); b.onclick = () => { tabs.querySelectorAll(".tab").forEach(x => x.classList.remove("on")); b.classList.add("on"); pane.innerHTML = h; tex(pane); }; tabs.append(b); });
      k.querySelector("input").onchange = ev => { ev.target.checked ? hechas.add(e.i) : hechas.delete(e.i); store.set("hechas", [...hechas]); prog(); };
      cont.append(k);
    });
    if (!cont.children.length) cont.append(node(`<p class="lbl">No hay preguntas con ese filtro.</p>`));
    tex(cont);
  }
  lista();
}

go(store.get("tab", "resumen"));
})();
