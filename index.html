<script>
const DATA = {"meta": {"ramo": "Ecuaciones Diferenciales (MAT-208)", "evaluacion": "Proyecto Bungee: validación y control individual", "fecha": "Control: martes 3 nov", "carrera": "Universidad Adolfo Ibáñez", "semestre": "2026-2", "contenidos": "Validación (h₁, h₂) y repaso del control: EDO lineales de 2.º orden, masa-resorte, 1.er orden, Euler/Runge-Kutta, mínimos cuadrados", "fuentes": ["Enunciado del proyecto (PDF) y reglas de la validación experimental", "Informe en Google Docs (versión del 1 nov)", "Los 8 saltos en video (IMG_0621 a IMG_0631) y el ajuste F vs x", "Clases 2, 4, 8, 9, 10 a 12, 14 y 15 del curso", "Controles 2 anteriores con pauta (10 preguntas)"], "estilo": {"preset": "fisica", "papel": "milimetrado", "unidad": "Capítulo"}}, "resumen": [{"tema": "t1", "ideas": ["Dos etapas: caída libre con la cuerda floja ($a=g$) y resorte con la cuerda tensa ($m\\ddot u+ku=mg$).", "Se conectan en $t^*$ con continuidad de la posición y de la velocidad. La aceleración sí salta.", "El punto más bajo sale por energía: $mg(L+u)=\\tfrac12 ku^2$.", "La aceleración máxima ocurre en el punto más bajo y es siempre mayor que $g$.", "En el prototipo la caída libre efectiva es $L_c=\\ell+L_0+h_s+\\delta$: la base parte a nivel de la varilla y el mosquetón queda $h_s$ más arriba."], "formulas": [{"tex": "u_{\\max}=\\frac{mg}{k}\\left(1+\\sqrt{1+\\frac{2kL_c}{mg}}\\right)", "nota": "elongación máxima"}, {"tex": "h_1=H-\\ell-L_0-h_s-u_{\\max}", "nota": "altura del punto más bajo (la D del informe)"}], "ojo": ["En la raíz va $L_c$ (0,77 m), no $L_0$ (0,59 m)."]}, {"tema": "t2", "ideas": ["$h_1$ es la altura del peso en su punto más bajo y $h_2$ la altura a la que sube en el primer rebote; ambas desde el suelo hasta la base del peso.", "El modelo ideal deja $h_1$ en promedio 12 cm por debajo de lo medido y manda el peso de vuelta a la altura de partida ($h_2=H$).", "En tus saltos el peso recuperó solo 61 a 69 % de lo que bajó (media 64 %).", "Predicción del día: modelo con amortiguamiento ($\\zeta=0{,}094$). Error típico en los 8 saltos: $h_1$ ±7 cm y $h_2$ ±4 cm.", "Regla rápida: $h_2=h_1+r\\,(H+\\delta-h_1)$ con $r=0{,}64$."], "formulas": [{"tex": "m\\ddot u+c\\,\\dot u+ku=mg,\\quad c=2\\zeta\\sqrt{km}", "nota": "etapa 2 con pérdidas; $\\zeta\\approx0{,}094$"}, {"tex": "h_2=h_1+r\\,(H+\\delta-h_1)", "nota": "$r\\approx0{,}64$"}], "ojo": ["Mide $h_1$ y $h_2$ hasta la base del peso, no hasta el mosquetón.", "$\\zeta$ se calibró con los mismos videos: el acierto en $h_2$ no es una prueba independiente."]}, {"tema": "t3", "ideas": ["La masa sorteada cambia mucho $h_1$: con el elástico validado, 500 g queda cerca del suelo y 150 g queda muy arriba.", "La perilla que queda es el hilo inextensible $\\ell$: alarga la caída libre sin cambiar $k$.", "Menos masa pide más hilo. Más altura $H$ pide más hilo (unos 8 a 9 cm por cada 10 cm de $H$).", "Se resuelve $h_1(\\ell)=h_{obj}$ con el modelo amortiguado; con pérdidas se necesitan 4 a 8 cm más de hilo que con el ideal.", "Objetivo recomendado: 8 cm, no 5 cm, para no tocar el suelo si el modelo se equivoca ±7 cm."], "formulas": [{"tex": "h_1(\\ell)=h_{obj}", "nota": "se resuelve numéricamente; $h_1$ decrece al subir $\\ell$"}], "ojo": ["Si $h_1$ predicho sale negativo, ACORTA el hilo (o sube H): más hilo baja más el peso."]}, {"tema": "t4", "ideas": ["Se midió $F=Mg$ contra $x$ = largo − 59 cm con 6 masas (187 a 1934 g), una sola pasada.", "Ajuste lineal: $k=25{,}7\\pm1{,}9$ N/m, $b=0{,}49\\pm0{,}78$ N (compatible con 0), $R^2=0{,}978$.", "Los residuos tienen forma curva: la rigidez local baja de ~30 a ~17 N/m entre 16 y 76 cm.", "Pasar de recta a parábola cambia la predicción solo 2 a 3 cm."], "formulas": [{"tex": "F=kx+b", "nota": "$k$ = pendiente"}], "ojo": ["Un $R^2$ alto no prueba linealidad: mira los residuos.", "Una sola pasada: no se cumple el criterio de 3 ensayos al 5 %."]}, {"tema": "t5", "ideas": ["$D_{exp}$ es el promedio de las $D_i$, $s$ su desviación estándar muestral.", "$E_{abs}=|D_{exp}-D_{pred}|$ y $E_H=E_{abs}/H\\cdot100$.", "Tus resultados: $s$ de 1,7 a 3,0 cm; $E_{abs}$ de 7,0 a 17,8 cm; $E_H$ de 3,9 a 11,7 %.", "$E_{abs}\\gg s$ y siempre con el mismo signo: error sistemático (pérdida de energía), no ruido.", "Ningún salto llegó a 5 cm: el menor fue 12,3 cm."], "formulas": [{"tex": "E_H=\\frac{|D_{exp}-D_{pred}|}{H}\\times100", "nota": "discrepancia relativa a la altura"}], "ojo": ["$E_H$ se divide por $H$, no por $D$."]}, {"tema": "t6", "ideas": ["Limitaciones del modelo: pérdida de energía, no linealidad, histéresis, masa de la cuerda, movimientos no verticales.", "Incertidumbre experimental: escala del video (3 a 4 cm), perspectiva, forma de soltar, $k\\pm1{,}9$, $h_s\\pm1{,}5$.", "Mejora: fuerza de amortiguamiento $-c\\dot u$ mientras la cuerda está tensa.", "$b$ cambió con la masa (0,43 a 0,74 kg/s) pero $\\zeta$ casi no (0,088 a 0,102).", "Sin explicar: los saltos a 1,52 m fallaron más que los de 1,81 m."], "formulas": [{"tex": "c=2\\zeta\\sqrt{km}", "nota": "pasa el amortiguamiento de una masa a otra"}], "ojo": ["El decremento logarítmico no se aplica tal cual: la cuerda se afloja al subir."]}, {"tema": "t7", "ideas": ["Con $k=EA/L_0$ aparece $\\lambda=EA/(mg)$, que no depende de $L_0$.", "$u_{\\max}/L_0=(1+\\sqrt{1+2\\lambda})/\\lambda$ y $|a|_{\\max}/g=\\sqrt{1+2\\lambda}$.", "Duplicar $L_0$ escala todo el salto ×2 (misma aceleración). Duplicar $A$ endurece la cuerda.", "Seguridad: 400 % pide $\\lambda\\ge5/8$; 3 g pide $\\lambda\\le4$.", "A 60 m con tolerancia de 30 cm, $E_H\\le0{,}5\\,\\%$: el prototipo está entre 8 y 23 veces por encima."], "formulas": [{"tex": "\\frac58\\le\\lambda=\\frac{EA}{mg}\\le4", "nota": "cuerda segura"}], "ojo": ["Para dos masas distintas mantén $\\lambda$ con hebras en paralelo: $n\\propto m$."]}, {"tema": "c1", "ideas": ["Lineal de orden $n$: $a_n(x)y^{(n)}+\\dots+a_1(x)y'+a_0(x)y=g(x)$. Homogénea si $g=0$.", "**Existencia y unicidad:** si $a_i, g$ son continuas en $I$ y $a_n(x)\\neq 0$ en $I$, el PVI con $y(x_0),\\dots,y^{(n-1)}(x_0)$ tiene solución única en $I$.", "**Superposición:** combinaciones lineales de soluciones de $L(y)=0$ también son solución.", "$n$ soluciones de la homogénea son LI $\\iff W\\neq 0$ en $I$ → forman un **conjunto fundamental** y $y_h=c_1y_1+\\dots+c_ny_n$.", "No homogénea: $y=y_h+y_p$. Si $g=g_1+g_2$, entonces $y_p=y_{p1}+y_{p2}$."], "formulas": [{"tex": "W[y_1,y_2]=\\begin{vmatrix}y_1&y_2\\\\y_1'&y_2'\\end{vmatrix}=y_1y_2'-y_1'y_2", "nota": "Wronskiano 2×2"}], "ojo": ["$W=0$ en un punto no basta para decir LD si las funciones no son soluciones de la misma EDO.", "Las constantes del PVI se calculan con $y_h+y_p$, nunca solo con $y_h$."]}, {"tema": "c2", "ideas": ["Se prueba $y=e^{mx}$ → ecuación auxiliar $a_nm^n+\\dots+a_1m+a_0=0$.", "Reales distintas: $c_1e^{m_1x}+c_2e^{m_2x}$. Doble $m$: $(c_1+c_2x)e^{mx}$. Complejas $\\alpha\\pm\\beta i$: $e^{\\alpha x}(c_1\\cos\\beta x+c_2\\sin\\beta x)$.", "Raíz de multiplicidad $k$: $e^{mx},xe^{mx},\\dots,x^{k-1}e^{mx}$ (igual con los pares complejos).", "Orden $n$ ⇒ exactamente $n$ funciones en $y_h$. $\\sin x$ sola no puede ser solución sin $\\cos x$."], "formulas": [{"tex": "m=\\frac{-b\\pm\\sqrt{b^2-4ac}}{2a}", "nota": "para $ay''+by'+cy=0$"}], "ojo": ["Raíz $\\pm 2i$ da $\\cos 2x,\\ \\sin 2x$ (sin exponencial, porque $\\alpha=0$).", "En orden 3 factoriza por agrupación: $r^2(r-3)+4(r-3)$."]}, {"tema": "c3", "ideas": ["**Coef. indeterminados:** solo con coeficientes constantes y $g$ = polinomio · $e^{kx}$ · $\\cos/\\sin\\beta x$ (o sumas).", "Propuesta: misma forma que $g$, con polinomio completo del mismo grado y **seno y coseno juntos**.", "Si $k+i\\beta$ es raíz de la auxiliar con multiplicidad $s$, multiplica la propuesta por $x^s$.", "**Variación de parámetros:** sirve siempre (tan, sec, $1/t$, ln, coeficientes variables). Normaliza primero.", "Puedes separar $g=g_1+g_2$ y sumar las particulares (superposición)."], "formulas": [{"tex": "u_1'=\\frac{W_1}{W}=\\frac{-y_2f}{W},\\qquad u_2'=\\frac{W_2}{W}=\\frac{y_1f}{W}", "nota": "$f$ = lado derecho de la EDO normalizada"}, {"tex": "y_p=u_1y_1+u_2y_2", "nota": ""}], "ojo": ["Proponer $Ae^{3x}$ cuando $e^{3x}$ ya está en $y_h$: al reemplazar da $0=1$.", "En VP usar $f$ sin dividir por el coeficiente de $y''$."]}, {"tema": "c4", "ideas": ["Hooke en el equilibrio: $mg=ks$. En sistema inglés $m=W/32$ [slug]; en SI el peso es $9{,}8\\,m$ [N].", "Modelo: $mx''+cx'+kx=f(t)$. **Abajo positivo** (convención de clase), salvo que el enunciado diga otra cosa.", "Libre no amortiguado: $\\omega=\\sqrt{k/m}$, $T=2\\pi/\\omega$, $f=\\omega/2\\pi$, $A=\\sqrt{c_1^2+c_2^2}$.", "Amortiguado según $c^2-4mk$: $>0$ sobreamortiguado, $=0$ crítico (cruza 0 a lo más 1 vez), $<0$ subamortiguado (oscila).", "Forzado sin roce con frecuencia igual a $\\omega$: resonancia, $x_p=t(\\dots)$ crece sin límite."], "formulas": [{"tex": "\\lambda=\\frac{-c\\pm\\sqrt{c^2-4mk}}{2m}", "nota": "raíces del caso amortiguado"}, {"tex": "x(t)=A\\sin(\\omega t+\\varphi),\\quad \\sin\\varphi=\\tfrac{c_1}{A},\\ \\cos\\varphi=\\tfrac{c_2}{A}", "nota": "forma sinusoidal"}], "ojo": ["“1 pie sobre el equilibrio” con abajo positivo es $x(0)=-1$; “hacia arriba” es velocidad negativa.", "“Se libera desde el reposo” significa $x'(0)=0$."]}, {"tema": "c5", "ideas": ["Plantea cada etapa como PVI: etapa 1 $m\\ddot y=mg$ con $y(0)=\\dot y(0)=0$; etapa 2 $m\\ddot u+ku=mg$ con $u(t^*)=0$ y $\\dot u(t^*)=v^*$.", "Etapa 2: $r=\\pm i\\omega$, particular constante $\\delta_e=mg/k$, $c_1=-\\delta_e$, $c_2=v^*/\\omega$.", "Con $x=u-\\delta_e$ queda el movimiento libre $\\ddot x+\\omega^2x=0$.", "Con amortiguamiento se clasifica con $c^2$ contra $4mk$; subamortiguado: $\\alpha=c/(2m)$ y $\\omega^*=\\sqrt{\\omega^2-\\alpha^2}$."], "formulas": [{"tex": "u_{\\max}=\\delta_e+\\sqrt{\\delta_e^2+(v^*/\\omega)^2}", "nota": "sin amortiguamiento"}], "ojo": ["Las condiciones iniciales de la etapa 2 van en $t^*$."]}, {"tema": "c6", "ideas": ["Resistencia lineal: $m\\dot v=mg-\\beta v$, de primer orden, lineal y autónoma.", "Solución: $v=\\frac{mg}{\\beta}(1-e^{-\\beta t/m})$; velocidad terminal $mg/\\beta$.", "Con velocidades de 4 m/s el aire casi no cambia $v^*$; a escala real sí."], "formulas": [{"tex": "v(t)=\\frac{mg}{\\beta}\\left(1-e^{-\\beta t/m}\\right)", "nota": "con $v(0)=0$"}], "ojo": ["No es de segundo orden: no uses ecuación auxiliar."]}, {"tema": "c7", "ideas": ["Euler: $y_{n+1}=y_n+hf(x_n,y_n)$. RK2: promedia dos pendientes, $\\frac h2(k_1+k_2)$.", "Una EDO de segundo orden se convierte en sistema de dos de primer orden.", "Euler explícito sobreestima la amplitud del oscilador; RK2 y RK4 mucho menos."], "formulas": [{"tex": "y_{n+1}=y_n+\\frac h2(k_1+k_2)", "nota": "$k_2=f(x_n+h,y_n+hk_1)$"}], "ojo": ["Evalúa $f$ en $(x_n,y_n)$ en Euler."]}, {"tema": "c8", "ideas": ["$k=S_{xy}/S_{xx}$ y $b=\\bar y-k\\bar x$.", "$s^2=SSE/(n-2)$; $SE(k)=s/\\sqrt{S_{xx}}$; $R^2=1-SSE/S_{yy}$.", "Para $h_1$: $\\sigma^2=\\sum(\\partial h_1/\\partial p_i)^2\\sigma_i^2$. Dominan $k$ y $h_s$."], "formulas": [{"tex": "SE(k)=\\frac{s}{\\sqrt{S_{xx}}}", "nota": "con $s^2=SSE/(n-2)$"}], "ojo": ["Divide por $n-2$, no por $n$."]}], "temas": [{"id": "t1", "titulo": "El modelo del salto", "peso": 3, "intro": "Todo el proyecto parte de este modelo. Si lo dominas, en el control puedes deducir cualquier fórmula del informe en vez de memorizarla.", "bloques": [{"tipo": "texto", "titulo": "Las dos etapas", "md": "Se usa un eje $y$ hacia abajo con origen donde parte el punto de amarre.\n\n**Etapa 1, cuerda floja.** Solo actúa el peso: $m\\ddot y=mg$, con $y(0)=0$ y $\\dot y(0)=0$. Resulta $y=\\tfrac12gt^2$.\n\n**Etapa 2, cuerda tensa.** Además actúa la fuerza elástica $ku$, con $u=y-L$: $m\\ddot u+ku=mg$. Es una EDO lineal de segundo orden, de coeficientes constantes y no homogénea."}, {"tipo": "texto", "titulo": "Cómo se conectan", "md": "La cuerda no puede producir saltos bruscos de posición ni de velocidad. Por eso en $t^*=\\sqrt{2L/g}$ se exige $u(t^*)=0$ y $\\dot u(t^*)=v^*=\\sqrt{2gL}$. La aceleración sí cambia de golpe: pasa de $g$ a $g-ku/m$."}, {"tipo": "formula", "tex": "u(t)=\\delta_e\\left[1-\\cos\\omega(t-t^*)\\right]+\\frac{v^*}{\\omega}\\operatorname{sen}\\omega(t-t^*)", "nota": "$\\omega=\\sqrt{k/m}$ y $\\delta_e=mg/k$ es la elongación de equilibrio (con $a=0$)."}, {"tipo": "formula", "tex": "u_{\\max}=\\frac{mg}{k}\\left(1+\\sqrt{1+\\frac{2kL}{mg}}\\right)", "nota": "Sale del extremo de la oscilación o por energía: $mg(L+u)=\\tfrac12ku^2$."}, {"tipo": "formula", "tex": "D=H-\\ell-L_0-u_{\\max}-h_s", "nota": "Distancia mínima al suelo (ecs. 14 y 17 del informe). En la validación se llama $h_1$."}, {"tipo": "formula", "tex": "|a|_{\\max}=g\\sqrt{1+\\frac{2kL}{mg}}", "nota": "Ocurre en el punto más bajo y siempre es mayor que $g$."}, {"tipo": "definicion", "etiqueta": "Concepto", "nombre": "Caída libre efectiva $L_c$", "md": "En el modelo el punto de amarre parte en el punto de sujeción. En el prototipo se suelta con la **base** de la pesa a nivel de la varilla, así que el mosquetón (el amarre) parte $h_s=18$ cm más arriba. Entonces el amarre cae libremente $L_c=\\ell+L_0+h_s+\\delta$, que con $\\ell=0$ y $\\delta=0$ vale $0{,}59+0{,}18=0{,}77$ m. Esa $L_c$ es la que va dentro de la raíz. $\\delta$ es lo que sube la base sobre la varilla al soltar (0 a 6 cm en tus saltos)."}, {"tipo": "lapiz", "texto": "en la raíz va L_c, no L₀"}, {"tipo": "gadget", "id": "g_salto", "titulo": "Las dos etapas del salto ideal", "instrucciones": "Mueve m, k y L. Fíjate en que la curva no tiene quiebre en t*: posición y velocidad son continuas."}, {"tipo": "ejemplo", "titulo": "514 g y H = 1,60 m", "enunciado": "Con $k=25{,}72$ N/m, $L_0=0{,}59$ m, $h_s=0{,}18$ m, $\\ell=0$ y $\\delta=0$, calcula la distancia mínima al suelo con el modelo ideal.", "pasos": [{"titulo": "Datos", "md": "$mg=0{,}514\\cdot9{,}81=5{,}04$ N y $L_c=0{,}59+0{,}18=0{,}77$ m."}, {"titulo": "Elongación máxima", "md": "$\\dfrac{mg}{k}=0{,}196$ m y $\\dfrac{2kL_c}{mg}=7{,}86$.\n\n$u_{\\max}=0{,}196\\left(1+\\sqrt{8{,}86}\\right)=0{,}779$ m."}, {"titulo": "Distancia al suelo", "md": "$D=1{,}60-0{,}59-0{,}18-0{,}779=0{,}051$ m."}], "respuesta": "$D\\approx5$ cm. Es la $H=1{,}600$ m que el informe calcula para 514 g.", "lapiz": "sin la unidad o sin h_s la respuesta queda mal"}, {"tipo": "ojo", "items": ["Confundir el instante de máxima velocidad ($u=\\delta_e$, $a=0$) con el punto más bajo.", "Poner $L_0$ en vez de $L_c$ dentro de la raíz en el prototipo.", "Olvidar $h_s$ al pasar de la posición del amarre a la base del peso."]}]}, {"id": "t2", "titulo": "Cómo predecimos h₁ y h₂", "peso": 3, "intro": "El día de la validación te sortean una altura H (entre 1,6 y 1,8 m) y una masa (entre 0 y 500 g), y se mide a qué altura llega el peso en dos momentos. Las dos predicciones tienen que quedar escritas antes de soltar.", "bloques": [{"tipo": "texto", "titulo": "Qué se mide", "md": "- La plataforma la ponen los profes; si ya tienen una, pueden usarla.\n- Se sortea $H\\in[1{,}6;\\,1{,}8]$ m y la masa $m\\in[0;\\,500]$ g. Cada grupo arma el resorte adecuado y le agrega el peso.\n- **Momento 1:** altura $h_1$ del peso en su punto más bajo, medida desde el suelo.\n- **Momento 2:** altura $h_2$ a la que se devuelve en el primer rebote (su punto más alto después del primer descenso).\n- $h_1$ es la $D$ del informe. $h_2$ no estaba en el informe: se predice con la mejora de amortiguamiento (sección 2.4.2)."}, {"tipo": "texto", "titulo": "Predecir h₁", "md": "1. Mide la masa total colgada $m$ (peso más mosquetón) en la balanza, $H$ con la huincha y $h_s$ del objeto.\n2. Caída libre efectiva: $L_c=\\ell+L_0+h_s+\\delta$.\n3. Elongación máxima $u_{\\max}$ con la fórmula del capítulo 1.\n4. $h_1=H-\\ell-L_0-h_s-u_{\\max}$.\n\nEso es el modelo ideal. En tus 8 saltos quedó por debajo de lo medido en todos ellos (12 cm en promedio): el peso real llega menos abajo porque pierde energía. Con amortiguamiento el error promedio baja a 3 cm, con un error típico de ±7 cm."}, {"tipo": "texto", "titulo": "Predecir h₂", "md": "En el modelo ideal no se pierde energía, así que el peso vuelve exactamente a la altura de partida: $h_2=H+\\delta$. En tus videos solo subió entre 61 y 69 % de lo que había bajado (media 64 %). Por eso $h_2$ necesita pérdidas.\n\nHay dos formas, que dan casi lo mismo:\n\n- **Regla rápida:** $h_2=h_1+r\\,(H+\\delta-h_1)$ con $r=0{,}64\\pm0{,}03$.\n- **Simulación (sección 2.4.2):** se agrega la fuerza $-c\\dot u$ mientras la cuerda está tensa, con $c=2\\zeta\\sqrt{km}$ y $\\zeta=0{,}094$. Cuando la cuerda se afloja el peso sube como proyectil hasta su punto más alto."}, {"tipo": "formula", "tex": "h_2=h_1+r\\,(H+\\delta-h_1)", "nota": "$r\\approx0{,}64$ es la fracción del descenso que se recupera."}, {"tipo": "formula", "tex": "m\\ddot u+c\\,\\dot u+ku=mg,\\qquad c=2\\zeta\\sqrt{km}", "nota": "$\\zeta\\approx0{,}094$ en las tres masas ensayadas (0,088; 0,102 y 0,092)."}, {"tipo": "tabla", "titulo": "Cómo funciona el predictor con tus 8 saltos (cm sobre el suelo)", "columnas": ["Configuración", "$h_1$ medido", "$h_1$ ideal", "$h_1$ amortiguado", "$h_2$ medido", "$h_2$ amortiguado"], "filas": [["514,5 g; 1,52 m (2 saltos)", "13,8", "−4,0", "6,9", "101,2", "101,9"], ["214,5 g; 1,52 m (2 saltos)", "47,4", "30,3", "36,4", "113,1", "107,6"], ["514 g; 1,81 m (3 saltos)", "32,3", "25,1", "35,9", "132,3", "130,9"], ["214,5 g; 1,81 m (1 salto)", "66,4", "59,4", "65,4", "136,3", "136,5"], ["Error típico (RMS, 8 saltos)", "—", "13,4", "7,0", "—", "3,9"]]}, {"tipo": "nota", "md": "**Ojo con la honestidad del resultado.** $\\zeta$ se calibró con el rebote de estos mismos videos, así que el acierto en $h_2$ (y en parte en $h_1$) no es una prueba independiente. El $h_2$ medido sale de $D$ más el rebote observado en el video, con la escala de cada salto. La prueba de verdad es el día de la validación."}, {"tipo": "gadget", "id": "g_predictor", "titulo": "Predictor de h₁ y h₂", "instrucciones": "Pon la H y la masa sorteadas (y el hilo ℓ si lo usas). Compara el modelo ideal con el amortiguado y anota lo medido para ver E_abs y E_H."}, {"tipo": "ejemplo", "titulo": "Te tocó 300 g y H = 1,7 m, con el elástico validado y sin hilo", "enunciado": "Predice $h_1$ y $h_2$ con $k=25{,}72$ N/m, $L_0=0{,}59$ m, $h_s=0{,}18$ m, $\\ell=0$ y $\\delta=0$.", "pasos": [{"titulo": "Modelo ideal", "md": "$mg=2{,}94$ N, $L_c=0{,}77$ m. $u_{\\max}=0{,}114\\left(1+\\sqrt{1+2\\cdot25{,}72\\cdot0{,}77/2{,}94}\\right)=0{,}550$ m.\n\n$h_1=1{,}70-0{,}59-0{,}18-0{,}550=0{,}380$ m y $h_2=H=1{,}70$ m."}, {"titulo": "Con amortiguamiento ($\\zeta=0{,}094$)", "md": "Simulando las dos etapas: $h_1=45{,}5$ cm. El peso recupera 62 % del descenso, así que $h_2=h_1+0{,}62\\,(170-45{,}5)=123$ cm."}], "respuesta": "Ideal: $h_1=38{,}0$ cm y $h_2=170$ cm. Con pérdidas: $h_1\\approx45{,}5$ cm y $h_2\\approx123$ cm.", "lapiz": "h₂ = H es el modelo sin pérdidas: no lo entregues como predicción"}, {"tipo": "gadget", "id": "g_ej", "titulo": "Practica el cálculo de h₁ ideal", "instrucciones": "Cada vez cambian la masa y la altura. Calcula a mano y revisa."}, {"tipo": "ojo", "items": ["Entregar $h_2=H$: eso es el modelo sin pérdidas.", "Medir hasta el mosquetón en vez de la base del peso: son 18 cm de diferencia.", "Trasladar el $b$ de una masa a otra: $b$ cambia con la masa, $\\zeta$ casi no.", "Usar $H$ del soporte sin sumarle la corrección $\\delta$ de la suelta."]}]}, {"id": "t3", "titulo": "Armar el resorte para la masa sorteada", "peso": 3, "intro": "El enunciado dice que cada grupo debe disponer del resorte adecuado para el peso que le toque. Con el elástico que ya caracterizaste, la masa cambia mucho h₁: la perilla que te queda es el hilo inextensible ℓ, que no cambia k.", "bloques": [{"tipo": "gadget", "id": "g_h_masa", "titulo": "Si no se ajusta nada: h₁ y h₂ según la masa", "instrucciones": "Con el elástico validado y sin hilo, mira qué pasa en el rango 50 a 500 g y para H = 1,6; 1,7 y 1,8 m."}, {"tipo": "texto", "titulo": "La idea", "md": "El hilo $\\ell$ se agrega en serie al elástico: la caída libre crece a $L_c=\\ell+L_0+h_s+\\delta$, pero la base también queda $\\ell$ más abajo desde el comienzo. Con una masa chica el elástico se estira poco, y hay que \"comprar\" bajada con hilo.\n\nSe resuelve $h_1(\\ell)=h_{obj}$ con el modelo amortiguado. Como $h_1$ baja cuando sube $\\ell$, hay una sola solución. Con pérdidas de energía necesitas entre 4 y 8 cm más de hilo que con el modelo ideal."}, {"tipo": "tabla", "titulo": "Hilo ℓ [cm] para h₁ = 8 cm (h₂ predicho entre paréntesis)", "columnas": ["Masa [g]", "H = 1,6 m", "H = 1,7 m", "H = 1,8 m"], "filas": [["100", "45 (97)", "54 (103)", "63 (109)"], ["150", "38 (99)", "47 (104)", "56 (110)"], ["200", "32 (100)", "41 (106)", "50 (111)"], ["250", "27 (101)", "36 (107)", "44 (112)"], ["300", "23 (102)", "31 (108)", "39 (113)"], ["350", "18 (103)", "27 (109)", "35 (114)"], ["400", "14 (104)", "23 (109)", "31 (115)"], ["450", "11 (104)", "19 (110)", "27 (116)"], ["500", "7 (105)", "15 (111)", "23 (117)"]]}, {"tipo": "nota", "md": "Con $h_s=18$ cm, $\\delta=0$, $k=25{,}72$ N/m, $L_0=0{,}59$ m y $\\zeta=0{,}094$. Si el objeto que te dan tiene otro $h_s$, o si no sueltas con la base a nivel de la varilla, rehaz el cálculo en el gadget de abajo."}, {"tipo": "texto", "titulo": "Por qué 8 cm y no 5 cm", "md": "El proyecto pide quedar a 5 cm o menos sin tocar el suelo. El modelo amortiguado se equivocó ±7 cm en tus saltos: a 1,52 m el peso quedó más arriba de lo predicho (6 a 12 cm), pero a 1,81 m quedó entre 1 cm más arriba y 6 cm más abajo. Con un objetivo de 5 cm hay riesgo real de tocar el suelo cuando H es alta. Con 8 cm el margen cubre ese error.\n\nSi la rúbrica premia acercarse más al suelo, bajen el objetivo; decídanlo antes con el profe."}, {"tipo": "gadget", "id": "g_diseno", "titulo": "Diseñador de resorte", "instrucciones": "Ingresa la H y la masa sorteadas, el h_s del objeto y el objetivo. Entrega el hilo ℓ y las dos predicciones."}, {"tipo": "texto", "titulo": "Cómo hacerlo en la práctica", "md": "- Lleva el elástico validado (3 en paralelo, $L_0=0{,}59$ m) y un cordel inextensible de unos 80 cm, con lazo regulable o nudos.\n- Mide $\\ell$ efectivo con la huincha, ya amarrado: los nudos se comen largo.\n- No cambies los elásticos: así la $k$ medida sigue valiendo.\n- Mide $h_s$ del objeto que te den. Si no son tus bronces, no es 18 cm.\n- Suelta sin impulso con la base a la altura de la varilla ($\\delta\\approx0$).\n- Pregunta si se permite un salto de prueba. El informe dice que la configuración no se ajusta por ensayo y error."}, {"tipo": "texto", "titulo": "Masas muy chicas", "md": "Bajo unos 150 g el hilo necesario pasa de 40 cm y el elástico es muy rígido para esa masa. Un elástico más blando (1 o 2 en paralelo) sería más natural, pero no tienes su $k$ medido: úsalo solo si lo mides antes (tres masas, 20 minutos). Con los 3 en paralelo sigue funcionando con hilo largo. Si sortean un valor cercano a 0 g, el peso es solo el mosquetón: usa lo que pese en la balanza."}, {"tipo": "ojo", "items": ["Si $h_1$ predicho sale negativo, ACORTA el hilo (o sube H): más hilo baja más el peso.", "Usar el $\\ell$ del modelo ideal: falta de 4 a 8 cm de hilo.", "No volver a medir $h_s$ del objeto que entregan los profes.", "Dejar el hilo con nudos sin medir el largo efectivo."]}]}, {"id": "t4", "titulo": "La constante k: del gráfico F vs x al ajuste", "peso": 2, "intro": "Todo lo que predice el modelo depende de un número, k. Aquí está de dónde sale y qué tan confiable es.", "bloques": [{"tipo": "texto", "titulo": "Qué se hizo", "md": "Se colgaron 6 masas (187 a 1934 g) del elástico (3 en paralelo, $L_0=0{,}59$ m). El largo se midió con huincha desde la vara hasta el final de la cuerda, antes del mosquetón, con resolución de 1 cm. La elongación es $x=$ largo $-\\,59$ cm y la fuerza es $F=Mg$. Fue una sola pasada, con 20 s de espera entre medidas."}, {"tipo": "tabla", "titulo": "Datos (tabla 3 del informe)", "columnas": ["Masa [g]", "Fuerza [N]", "Elongación [cm]"], "filas": [["187,2", "1,84", "9"], ["327,7", "3,21", "13"], ["512,1", "5,02", "16"], ["1009,7", "9,91", "32"], ["1492,2", "14,64", "51"], ["1933,5", "18,97", "76"]]}, {"tipo": "formula", "tex": "F=kx+b,\\quad k=25{,}7\\pm1{,}9\\ \\text{N/m},\\ b=0{,}49\\pm0{,}78\\ \\text{N},\\ R^2=0{,}978", "nota": "Mínimos cuadrados con los 6 puntos."}, {"tipo": "gadget", "id": "g_ajuste", "titulo": "Ajuste de la recta y de la parábola", "instrucciones": "Desmarca puntos para ver cómo se mueven k, su error y R². Fíjate en la rigidez local de la parábola a 76 cm."}, {"tipo": "texto", "titulo": "¿Es razonable suponer una relación lineal?", "md": "$R^2=0{,}978$ es cercano a 1, pero los residuos no son aleatorios: van −, −, +, +, +, −, lo que indica una curvatura. La pendiente entre puntos consecutivos baja de unos 30 N/m (16 a 32 cm) a unos 17 N/m (51 a 76 cm): los elásticos se ablandan.\n\nEn el salto la elongación máxima es de 45 a 79 cm (214,5 a 514 g), justo en la zona más blanda. Aun así la ley de Hooke sirve como primera aproximación: reemplazar la recta por una parábola cambia la predicción de la caída solo 2 a 3 cm para 514 g, menos que la diferencia con lo medido (7 a 18 cm). Como mejora futura se puede usar un $k$ que dependa de la elongación."}, {"tipo": "texto", "titulo": "Cuánto afecta el error de k", "md": "Un error de $\\pm1{,}9$ N/m en $k$ (7 %) se traduce en unos $\\pm2$ a $\\pm4$ cm en $h_1$, según la masa. Es menor que el error por pérdida de energía, pero no es despreciable. Lo mismo con $h_s\\pm1{,}5$ cm: cambia $h_1$ en unos $\\mp1{,}8$ cm."}, {"tipo": "ojo", "items": ["Un $R^2$ alto no prueba linealidad: hay que mirar los residuos.", "El intercepto $b=0{,}49\\pm0{,}78$ N es compatible con cero: Hooke sin pretensión.", "Hay 6 puntos (lo que pide la norma) pero una sola pasada: no se cumple el criterio de 3 ensayos que coincidan dentro de 5 %."]}]}, {"id": "t5", "titulo": "Validación: D_i, desviación y discrepancias", "peso": 2, "intro": "Cómo se compara la predicción con los saltos y qué dicen los números. El día de la validación harás exactamente esto con h₁ y h₂.", "bloques": [{"tipo": "texto", "titulo": "Las definiciones", "md": "Para cada salto se mide la distancia mínima $D_i$ entre el peso y el suelo. Con $n$ saltos:\n\n$$D_{exp}=\\bar D=\\frac1n\\sum D_i,\\qquad s=\\sqrt{\\frac1{n-1}\\sum(D_i-\\bar D)^2}$$\n\n$s$ mide cuánto cambian los saltos entre sí (reproducibilidad)."}, {"tipo": "formula", "tex": "E_{abs}=\\left|D_{exp}-D_{pred}\\right|,\\qquad E_H=\\frac{\\left|D_{exp}-D_{pred}\\right|}{H}\\times100", "nota": "$E_{abs}$ es cuántos cm se equivoca el modelo; $E_H$ lo compara con la altura del montaje."}, {"tipo": "tabla", "titulo": "Resultados de los 8 saltos (modelo ideal, tablas 5 y 6)", "columnas": ["Configuración", "$D_{exp}\\pm s$ [cm]", "$D_{pred}$ [cm]", "$E_{abs}$ [cm]", "$E_H$ [%]"], "filas": [["514,5 g; 1,52 m", "13,8 ± 2,2", "−4,0", "17,8", "11,7"], ["214,5 g; 1,52 m", "47,4 ± 1,7", "30,3", "17,1", "11,2"], ["514 g; 1,81 m (3 saltos)", "32,3 ± 3,0", "25,1", "7,2", "4,0"], ["214,5 g; 1,81 m (1 salto)", "66,4", "59,4", "7,0", "3,9"]]}, {"tipo": "texto", "titulo": "Cómo se interpreta", "md": "- La desviación $s$ (1,7 a 3,0 cm) es del orden de la incertidumbre de la escala (3 a 4 cm): los saltos son repetibles dentro de lo que permite la medición.\n- $E_{abs}$ (7,0 a 17,8 cm) es mucho mayor que $s$ y tiene siempre el mismo signo (el modelo predice un punto más bajo que el real). No es ruido: es un error sistemático que el modelo ideal no captura.\n- $E_H$ va de 3,9 a 11,7 %. A escala real se pide 0,5 % (60 m con 30 cm de tolerancia): estamos entre 8 y 23 veces por encima.\n- Con amortiguamiento $E_{abs}$ baja a entre 1,1 y 11,2 cm, pero el coeficiente se ajustó con los mismos videos."}, {"tipo": "gadget", "id": "g_estad", "titulo": "Calculadora de discrepancias", "instrucciones": "Cambia los D_i, la predicción y H. El día de la validación usa esto con h₁ y h₂ medidos."}, {"tipo": "ojo", "items": ["$s$ es muestral ($n-1$) y con un solo salto no existe.", "$E_H$ se divide por $H$, no por $D$.", "Ningún salto llegó a 5 cm: el menor fue 12,3 cm. No lo escondas.", "Los saltos se hicieron antes de caracterizar $k$: no se eligieron con el modelo."]}]}, {"id": "t6", "titulo": "Limitaciones y mejora del modelo", "peso": 2, "intro": "El profe suele preguntar por qué se equivoca el modelo y cómo lo mejorarían. Esta es la respuesta ordenada.", "bloques": [{"tipo": "texto", "titulo": "Dos tipos de causas", "md": "**Limitaciones del modelo (error sistemático):**\n\n- Pérdida de energía: fricción interna de la goma y resistencia del aire.\n- No linealidad e histéresis de los elásticos.\n- Masa de la cuerda despreciada (Heck et al., 2010).\n- Movimientos no verticales.\n\n**Incertidumbre experimental (error aleatorio o de medición):**\n\n- Escala del video (3 a 4 cm, de la caída libre) y perspectiva de la cámara: la varilla queda unos 7 cm delante del poste.\n- $k\\pm1{,}9$ N/m y $h_s\\pm1{,}5$ cm.\n- Forma de soltar ($\\delta$ de 0 a 6 cm).\n- Resolución del video."}, {"tipo": "texto", "titulo": "La mejora: amortiguamiento viscoso", "md": "Se agrega a la etapa 2 una fuerza proporcional a la velocidad y opuesta a ella:\n\n$$m\\ddot u+c\\,\\dot u+ku=mg,\\qquad u(t^*)=0,\\ \\dot u(t^*)=v^*$$\n\n$c$ [kg/s] convierte energía mecánica en calor. Con $c>0$ el peso llega menos abajo y rebota menos. Se escribe como $c=2\\zeta\\sqrt{km}$, con $\\zeta$ adimensional.\n\n**Cómo se mide.** Como la cuerda se afloja cuando el peso sube, la oscilación no es armónica y el decremento logarítmico no se puede aplicar tal cual. Por eso se ajustó numéricamente la solución de las dos etapas al primer rebote medido."}, {"tipo": "gadget", "id": "g_amort", "titulo": "Cuánto rebota según ζ", "instrucciones": "Mueve ζ y mira el rebote, h₁ y h₂ para 514 g y H = 1,81 m. La banda punteada es lo que se observó."}, {"tipo": "tabla", "titulo": "Amortiguamiento ajustado a cada masa", "columnas": ["Masa", "$b$ [kg/s]", "$\\zeta=b/(2\\sqrt{km})$"], "filas": [["514 g", "0,64", "0,088"], ["514,5 g", "0,74", "0,102"], ["214,5 g", "0,43", "0,092"]]}, {"tipo": "nota", "md": "$b$ cambia casi al doble entre masas, pero $\\zeta$ se mantiene entre 0,088 y 0,102. Por eso se usa $\\zeta\\approx0{,}094$ para una masa nueva."}, {"tipo": "texto", "titulo": "Lo que no sabemos", "md": "Con la misma cuerda, los saltos a $H=1{,}52$ m quedaron relativamente más arriba que los de 1,81 m ($E_{abs}$ de 17 contra 7 cm), aunque la física no depende de $H$. Podría ser un cambio de los elásticos con el uso entre las dos series o un error de escala en esos videos. No hay saltos extra para aclararlo."}, {"tipo": "ojo", "items": ["Decir que el modelo \"está mal\": el modelo ideal es un primer modelo y la discrepancia está explicada en gran parte por una causa identificada.", "Mezclar error de modelo con error de medición: no se corrigen igual.", "Afirmar que la causa de la diferencia entre 1,52 y 1,81 m está resuelta: no lo está."]}]}, {"id": "t7", "titulo": "Del prototipo a un salto real", "peso": 3, "intro": "La sección E del enunciado. El control individual evalúa si domina esto, así que conviene poder deducirlo en la pizarra.", "bloques": [{"tipo": "texto", "titulo": "El parámetro λ", "md": "Para una cuerda de sección uniforme $k=EA/L_0$ (Beer et al., 2002). Al reemplazar en las fórmulas aparece $kL_0=EA$, que no depende de $L_0$. Se define\n\n$$\\lambda=\\frac{kL_0}{mg}=\\frac{EA}{mg}$$\n\ny en un salto real (sin hilo, $L=L_0$) todo queda en función de $\\lambda$."}, {"tipo": "formula", "tex": "\\frac{u_{\\max}}{L_0}=\\frac{1+\\sqrt{1+2\\lambda}}{\\lambda},\\qquad \\frac{|a|_{\\max}}{g}=\\sqrt{1+2\\lambda}", "nota": "Ecuación (23) del informe."}, {"tipo": "texto", "titulo": "Efecto de L₀ y de A", "md": "- **Largo natural.** Con el mismo material y sección, $\\lambda$ no cambia: la deformación relativa y la aceleración máxima tampoco. El salto completo se escala en proporción a $L_0$ (el doble de largo, el doble de profundidad). $L_0$ ajusta la profundidad a la altura disponible.\n- **Sección.** Si sube $A$, sube $\\lambda$: la cuerda es más rígida, el salto es menos profundo pero la aceleración máxima aumenta. Hay un compromiso entre profundidad, deformación y aceleración."}, {"tipo": "tabla", "titulo": "Condiciones de seguridad", "columnas": ["Condición", "Se escribe", "Resultado"], "filas": [["No tocar el suelo", "$L_0\\left(1+\\frac{1+\\sqrt{1+2\\lambda}}{\\lambda}\\right)\\le H-h_s-D_{seg}$", "ecuación (24)"], ["Elongación máxima del 400 %", "$u_{\\max}\\le4L_0$", "$\\lambda\\ge5/8$"], ["Aceleración máxima ≤ 3 g", "$\\sqrt{1+2\\lambda}\\le3$", "$\\lambda\\le4$"], ["Ambas", "—", "$5/8\\le\\lambda\\le4$"], ["Hong Kong (largo estirado ≤ 4 $L_0$)", "$u_{\\max}\\le3L_0$", "$\\lambda\\ge8/9$"]]}, {"tipo": "gadget", "id": "g_lambda", "titulo": "Zona segura en λ", "instrucciones": "Mueve λ y mira si cumple las dos condiciones. Abajo, para una cuerda con EA dado, el rango de masas admisibles."}, {"tipo": "texto", "titulo": "Una cuerda para dos saltadores", "md": "Con $EA$ fijo, $\\lambda$ es inversamente proporcional a $m$, y $5/8\\le\\lambda\\le4$ se convierte en $\\dfrac{EA}{4g}\\le m\\le\\dfrac{8EA}{5g}$ (la masa máxima es 6,4 veces la mínima).\n\nEl más pesado tiene menor $\\lambda$: se estira más y llega más abajo (crítico para tocar el suelo y para el 400 %). El más liviano tiene mayor $\\lambda$: llega menos abajo pero sufre más aceleración (crítico para 3 g). Una misma cuerda no es razonable para masas muy distintas. Se propone mantener $\\lambda$ con hebras en paralelo, $n_2/n_1=m_2/m_1$; acortar $L_0$ solo corrige la profundidad."}, {"tipo": "texto", "titulo": "Precisión a gran escala", "md": "Para un salto de 60 m con tolerancia de 30 cm: $E_{H,\\max}=\\dfrac{0{,}30}{60}\\times100=0{,}5\\,\\%$. En el prototipo $E_H$ fue de 3,9 a 11,7 %: entre 8 y 23 veces mayor. Un salto de 60 m se predeciría con un error de entre 2,4 y 7,0 m.\n\nTampoco es razonable suponer que $E_H$ se mantiene: la resistencia del aire crece con la velocidad (más de 17 m/s en un salto real contra unos 4 m/s en el prototipo), la masa de la cuerda pesa más y la no linealidad del caucho depende de la deformación."}, {"tipo": "ojo", "items": ["Confundir el 400 % de elongación (largo estirado = 5 veces el natural) con \"largo estirado 4 veces\".", "Creer que alargar $L_0$ reduce la aceleración: no lo hace, solo profundiza el salto.", "El límite de 3 g es de personas: el prototipo llega a unos 3 g con 514 g y a 4,5 g con 214,5 g y no pasa nada."]}]}, {"id": "c1", "titulo": "Control · Teoría de las EDO lineales", "peso": 2, "intro": "Es la base de todo el control: te dice cuándo un PVI tiene solución única, cuántas soluciones necesitas para la solución general y cómo se arma la solución de una no homogénea. Rara vez sale sola, pero aparece en verdadero/falso y en la justificación de casi todas las preguntas.", "bloques": [{"tipo": "texto", "titulo": "Qué es una EDO lineal de orden n", "md": "Una EDO es **lineal** cuando $y$ y sus derivadas aparecen a la primera potencia y multiplicadas solo por funciones de $x$:\n$$a_n(x)\\frac{d^ny}{dx^n}+a_{n-1}(x)\\frac{d^{n-1}y}{dx^{n-1}}+\\dots+a_1(x)\\frac{dy}{dx}+a_0(x)y=g(x)$$\nSi $g(x)=0$ se llama **homogénea**. Con el operador $L=a_nD^n+\\dots+a_1D+a_0$ se escribe corto: $L(y)=g(x)$, y la homogénea asociada es $L(y)=0$.\n\nPara usar los teoremas y fórmulas conviene la **forma normalizada**: dividir todo por $a_n(x)$ para que $y^{(n)}$ quede con coeficiente 1."}, {"tipo": "definicion", "etiqueta": "Teorema", "nombre": "Existencia y unicidad", "md": "Sean $a_n,\\dots,a_1,a_0$ y $g$ continuas en un intervalo $I$ con $a_n(x)\\neq 0$ para todo $x\\in I$. Si $x_0\\in I$, entonces el PVI\n$$L(y)=g(x),\\quad y(x_0)=y_0,\\ y'(x_0)=y_1,\\ \\dots,\\ y^{(n-1)}(x_0)=y_{n-1}$$\ntiene solución en $I$ y es **única**."}, {"tipo": "nota", "md": "Para orden $n$ se necesitan $n$ condiciones iniciales, todas en el mismo punto $x_0$."}, {"tipo": "ejemplo", "titulo": "PVI con condiciones nulas (Clase 10)", "enunciado": "Considere $3y'''+5y''-y'+7y=0$ con $y(1)=y'(1)=y''(1)=0$. ¿Cuál es la solución?", "pasos": [{"titulo": "Candidato obvio", "md": "$y(x)=0$ cumple la EDO y las tres condiciones."}, {"titulo": "Unicidad", "md": "Los coeficientes son constantes (continuos en $\\mathbb R$) y $a_3=3\\neq 0$, así que el teorema garantiza que hay **una sola** solución."}], "respuesta": "$y(x)\\equiv 0$ es la única solución."}, {"tipo": "gadget", "id": "g_intervalo", "titulo": "¿En qué intervalo vale el teorema?", "instrucciones": "Elige una ecuación y mueve $x_0$. Las líneas punteadas son los puntos donde $a_n(x)=0$ (o donde $g$ no es continua). El intervalo sombreado es el mayor $I$ que contiene a $x_0$ donde el teorema garantiza solución única."}, {"tipo": "texto", "titulo": "Superposición y dependencia lineal", "md": "Si $y_1,\\dots,y_k$ resuelven $L(y)=0$, cualquier combinación $\\alpha_1y_1+\\dots+\\alpha_ky_k$ también la resuelve (porque $L$ es lineal). Por ejemplo, $e^x$ y $e^{-x}$ resuelven $y''-y=0$, así que $c_1e^x+c_2e^{-x}$ también.\n\nLa pregunta es: ¿cuántas soluciones necesito para tenerlas **todas**? Exactamente $n$, pero que no sean \"repetidas\", es decir, linealmente independientes."}, {"tipo": "definicion", "etiqueta": "Definición", "nombre": "Dependencia e independencia lineal", "md": "$u_1,\\dots,u_n$ son **linealmente dependientes (LD)** en $I$ si existen $c_1,\\dots,c_n$ **no todas nulas** con $c_1u_1(x)+\\dots+c_nu_n(x)=0$ para todo $x\\in I$. Son **LI** si eso solo ocurre con $c_1=\\dots=c_n=0$.\n\nCon dos funciones es fácil: son LD si y solo si una es múltiplo constante de la otra."}, {"tipo": "definicion", "etiqueta": "Definición", "nombre": "Wronskiano", "md": "$$W[u_1,\\dots,u_n](x)=\\det\\begin{bmatrix}u_1&u_2&\\cdots&u_n\\\\u_1'&u_2'&\\cdots&u_n'\\\\\\vdots&&&\\vdots\\\\u_1^{(n-1)}&u_2^{(n-1)}&\\cdots&u_n^{(n-1)}\\end{bmatrix}$$"}, {"tipo": "formula", "tex": "W[y_1,y_2]=y_1y_2'-y_1'y_2", "nota": "el caso 2×2, el que más se usa"}, {"tipo": "definicion", "etiqueta": "Teorema", "nombre": "Criterio de independencia y solución general", "md": "Si $y_1,\\dots,y_n$ son **soluciones** de la homogénea $L(y)=0$ en $I$, entonces son LI en $I$ **si y solo si** $W[y_1,\\dots,y_n](x)\\neq 0$ en $I$. En ese caso $\\{y_1,\\dots,y_n\\}$ es un **conjunto fundamental** y la solución general es\n$$y(x)=c_1y_1(x)+c_2y_2(x)+\\dots+c_ny_n(x).$$"}, {"tipo": "lapiz", "texto": "W ≠ 0 → LI → conjunto fundamental"}, {"tipo": "gadget", "id": "g_wronskiano", "titulo": "Calculadora de wronskianos", "instrucciones": "Elige un par de funciones. Verás $y_1$, $y_2$ y el gráfico de $W(x)$. Si $W$ nunca se anula en el intervalo, el par sirve como conjunto fundamental.", "figura": "Curva morada: $W(x)$. Las otras dos: $y_1$ y $y_2$."}, {"tipo": "ejemplo", "titulo": "Wronskiano y LD (Clase 10 y Guía 3)", "enunciado": "a) Calcule $W[e^x, xe^x]$. b) ¿Es $\\{1,\\cos 2x,\\cos^2x\\}$ LI en $\\mathbb R$?", "pasos": [{"titulo": "a) Derivadas", "md": "$y_1=e^x$, $y_1'=e^x$; $y_2=xe^x$, $y_2'=(1+x)e^x$."}, {"titulo": "a) Determinante", "md": "$W=e^x(1+x)e^x-e^x\\cdot xe^x=e^{2x}\\neq 0$ → LI en $\\mathbb R$."}, {"titulo": "b) Buscar una relación", "md": "Por la identidad $\\cos^2x=\\frac{1+\\cos 2x}{2}$: $\\ \\tfrac12\\cdot 1+\\tfrac12\\cos 2x-1\\cdot\\cos^2x=0$ con constantes no todas nulas."}], "respuesta": "a) $W=e^{2x}$. b) No: el conjunto es **LD**."}, {"tipo": "texto", "titulo": "Ecuaciones no homogéneas", "md": "La solución general de $L(y)=g(x)$ es\n$$y=y_h+y_p$$\ndonde $y_h$ es la solución general de la homogénea asociada y $y_p$ es **una** solución particular cualquiera de la no homogénea.\n\n**Superposición para no homogéneas:** si $L(y_{p1})=g_1$ y $L(y_{p2})=g_2$, entonces $L(y_{p1}+y_{p2})=g_1+g_2$. Por eso, ante $g(t)=t^2+1-e^t$ se buscan por separado la particular de $t^2+1$ y la de $-e^t$, y se suman (así lo hace la pauta del control de 60 min).\n\nOjo: cualquier pedazo de $y_p$ que sea solución de la homogénea se puede \"absorber\" en las constantes de $y_h$."}, {"tipo": "ojo", "items": ["Decir \"$W(0)=0$, entonces son LD\" con funciones que **no** son soluciones de una misma EDO regular: $x$ y $x^2$ tienen $W=x^2$, que se anula en 0, y aun así son LI.", "Aplicar el teorema en un punto donde $a_n(x_0)=0$: ahí no garantiza nada.", "Calcular $c_1, c_2$ del PVI con $y_h$ en vez de $y_h+y_p$.", "Contar mal: una EDO de orden $n$ necesita exactamente $n$ funciones LI en $y_h$."]}]}, {"id": "c2", "titulo": "Control · Coeficientes constantes: ecuación auxiliar", "peso": 3, "intro": "Aparece en **todas** las preguntas del control: es el primer paso para la homogénea, para coeficientes indeterminados, para variación de parámetros y para masa-resorte. Tiene que salirte automático.", "bloques": [{"tipo": "texto", "titulo": "La idea: probar con una exponencial", "md": "En $a_ny^{(n)}+\\dots+a_1y'+a_0y=0$ con $a_i$ constantes, se prueba $y=e^{mx}$. Como $(e^{mx})^{(k)}=m^ke^{mx}$, todo queda multiplicado por $e^{mx}\\neq 0$ y sobrevive solo el polinomio:"}, {"tipo": "formula", "tex": "a_nm^n+a_{n-1}m^{n-1}+\\dots+a_1m+a_0=0", "nota": "ecuación auxiliar o característica"}, {"tipo": "texto", "titulo": "Los tres casos de orden 2", "md": "Para $a_2y''+a_1y'+a_0y=0$ las raíces de $a_2m^2+a_1m+a_0=0$ caen en uno de tres casos:"}, {"tipo": "tabla", "columnas": ["Raíces", "Conjunto fundamental", "Solución general"], "filas": [["Reales distintas $m_1\\neq m_2$", "$e^{m_1x},\\ e^{m_2x}$", "$c_1e^{m_1x}+c_2e^{m_2x}$"], ["Real doble $m$", "$e^{mx},\\ xe^{mx}$", "$(c_1+c_2x)e^{mx}$"], ["Complejas $\\alpha\\pm\\beta i$", "$e^{\\alpha x}\\cos\\beta x,\\ e^{\\alpha x}\\sin\\beta x$", "$e^{\\alpha x}(c_1\\cos\\beta x+c_2\\sin\\beta x)$"]]}, {"tipo": "nota", "md": "El $xe^{mx}$ del caso doble sale de Abel: $y_2=e^{mx}\\int\\frac{e^{2mx}}{e^{2mx}}dx=xe^{mx}$. Y el caso complejo usa $e^{i\\theta}=\\cos\\theta+i\\sin\\theta$."}, {"tipo": "gadget", "id": "g_raices", "titulo": "Mueve a, b, c y mira qué caso te toca", "instrucciones": "Ajusta los coeficientes de $ay''+by'+cy=0$. Se muestran el discriminante, las raíces, la $y_h$ y la solución con $y(0)=1$, $y'(0)=0$. Busca: ¿qué pasa en el gráfico cuando las raíces son complejas? ¿Y cuando son positivas?"}, {"tipo": "texto", "titulo": "Orden mayor que 2: multiplicidades", "md": "Se factoriza la auxiliar (agrupando, Ruffini o reconociendo cuadrados). Si $m_1$ tiene **multiplicidad $k$**, aporta\n$$c_1e^{m_1x}+c_2xe^{m_1x}+\\dots+c_kx^{k-1}e^{m_1x}.$$\nSi $\\alpha+\\beta i$ tiene multiplicidad $k$, su conjugada también, y aportan $x^je^{\\alpha x}\\cos\\beta x$ y $x^je^{\\alpha x}\\sin\\beta x$ para $j=0,\\dots,k-1$ ($2k$ funciones).\n\nRegla de control: el total de funciones es **igual al orden** de la EDO."}, {"tipo": "gadget", "id": "g_constructor", "titulo": "Constructor de $y_h$ a partir de las raíces", "instrucciones": "Agrega raíces con su multiplicidad (o usa un ejemplo de clase o control) y mira cómo se arma $y_h$. Revisa que el número de funciones coincida con el orden."}, {"tipo": "ejemplo", "titulo": "Control 2 · 2026-1 (30/04), parte a)", "enunciado": "Encuentre la solución de la homogénea asociada a $y'''-3y''+4y'-12y=e^{3x}$.", "pasos": [{"titulo": "Auxiliar", "md": "$r^3-3r^2+4r-12=0$"}, {"titulo": "Agrupar", "md": "$r^2(r-3)+4(r-3)=0\\Rightarrow(r^2+4)(r-3)=0$"}, {"titulo": "Raíces", "md": "$r_1=3$, $r=\\pm 2i$ (aquí $\\alpha=0$, $\\beta=2$)"}], "respuesta": "$y_h=C_1e^{3x}+C_2\\cos 2x+C_3\\sin 2x$", "lapiz": "raíces: 4 de los 9 pts de la parte a)"}, {"tipo": "ejemplo", "titulo": "Clase 11: PVI con raíz doble", "enunciado": "Resuelva $y''-2\\sqrt5\\,y'+5y=0$, $y(0)=0$, $y'(0)=3$.", "pasos": [{"titulo": "Auxiliar", "md": "$m^2-2\\sqrt5m+5=(m-\\sqrt5)^2=0$ → $m=\\sqrt5$ doble."}, {"titulo": "General", "md": "$y=(c_1+c_2x)e^{\\sqrt5x}$"}, {"titulo": "Condiciones", "md": "$y(0)=c_1=0$. $y'=c_2e^{\\sqrt5x}+\\sqrt5(c_1+c_2x)e^{\\sqrt5x}$ ⇒ $y'(0)=c_2=3$."}], "respuesta": "$y=3xe^{\\sqrt5x}$"}, {"tipo": "ejemplo", "titulo": "Clase 11: orden 7", "enunciado": "Determine la solución general de $y^{(7)}-2y^{(5)}+y'''=0$.", "pasos": [{"titulo": "Factorizar", "md": "$m^7-2m^5+m^3=m^3(m^4-2m^2+1)=m^3(m^2-1)^2=m^3(m-1)^2(m+1)^2$"}, {"titulo": "Multiplicidades", "md": "$m=0$ triple, $m=1$ doble, $m=-1$ doble: $3+2+2=7$ funciones ✓."}], "respuesta": "$y=c_1+c_2x+c_3x^2+(c_4+c_5x)e^x+(c_6+c_7x)e^{-x}$"}, {"tipo": "texto", "titulo": "Al revés: de las soluciones a la ecuación", "md": "Pregunta típica de V/F (Control 2026-1, P1b, 10 pts): *¿existe una EDO lineal homogénea de orden 2 con coeficientes constantes que tenga como soluciones LI a $e^x$ y $\\sin x$?*\n\n- $e^x$ obliga a que $r=1$ sea raíz.\n- $\\sin x$ obliga a que $\\pm i$ sean raíces (factor $r^2+1$), y entonces $\\cos x$ también es solución.\n- Eso son 3 raíces: el polinomio tendría grado $\\ge 3$. Una EDO de orden 2 tiene auxiliar de grado 2.\n\n**Falso.** La menor sería de orden 3: $(r-1)(r^2+1)=r^3-r^2+r-1$, es decir $y'''-y''+y'-y=0$."}, {"tipo": "ojo", "items": ["Con raíces $\\pm\\beta i$ (sin parte real) poner $e^{x}$: si $\\alpha=0$ la exponencial es $e^{0}=1$.", "En la raíz doble escribir $c_1e^{mx}+c_2e^{mx}$ (son la misma función: falta la $x$).", "Usar $\\cos(\\beta x)$ con el $\\beta$ mal: para $r=-\\frac12\\pm\\frac{\\sqrt3}{2}i$ es $\\cos\\frac{\\sqrt3}{2}x$.", "En orden 3 o más, no revisar que el número de funciones sea igual al orden."]}]}, {"id": "c3", "titulo": "Control · Coeficientes indeterminados y variación de parámetros", "peso": 3, "intro": "Es el tema con más puntos en los controles anteriores: casi todos piden una $y_p$. La clave es reconocer rápido **qué método** usar y escribir bien la propuesta (la propuesta sola vale entre 3 y 12 pts según la pauta).", "bloques": [{"tipo": "texto", "titulo": "Coeficientes indeterminados: cuándo y cómo", "md": "Sirve **solo** si la EDO tiene coeficientes constantes y el lado derecho es de la forma\n$$g(x)=\\sum e^{r_ix}\\big[P_i(x)\\cos(q_ix)+Q_i(x)\\sin(q_ix)\\big]$$\n(polinomios, exponenciales, senos y cosenos, y sus productos y sumas). La idea: $y_p$ \"se parece\" a $g$, con coeficientes por determinar.\n\nPasos (clase 12): 1) resolver $L(y)=0$; 2) proponer $y_p$; 3) reemplazar en la EDO e igualar coeficientes; 4) $y=y_h+y_p$."}, {"tipo": "tabla", "columnas": ["Si $g(x)$ es…", "se propone $y_p$ =", "número de prueba"], "filas": [["$x^m$ (o polinomio de grado $m$)", "$A_mx^m+\\dots+A_1x+A_0$", "$0$"], ["$x^me^{kx}$", "$e^{kx}(A_mx^m+\\dots+A_0)$", "$k$"], ["$\\cos\\beta x$ o $\\sin\\beta x$", "$A\\cos\\beta x+B\\sin\\beta x$", "$\\beta i$"], ["$x^me^{kx}\\cos\\beta x$ o $x^me^{kx}\\sin\\beta x$", "$e^{kx}[(A_mx^m+\\dots)\\cos\\beta x+(B_mx^m+\\dots)\\sin\\beta x]$", "$k+\\beta i$"], ["suma $g_1+g_2$", "$y_{p1}+y_{p2}$ (cada una por separado)", "uno por cada término"]]}, {"tipo": "definicion", "etiqueta": "Regla", "nombre": "Corrección por duplicación", "md": "Si el **número de prueba** $k+\\beta i$ es raíz de la ecuación auxiliar con multiplicidad $s$, la propuesta se multiplica por $x^s$:\n$$y_p=x^s\\,e^{kx}\\big[P_m(x)\\cos\\beta x+Q_m(x)\\sin\\beta x\\big].$$\nEn palabras: si algún término de la propuesta ya está en $y_h$, multiplica por $x$ (y otra vez por $x$ si sigue estando)."}, {"tipo": "lapiz", "texto": "seno Y coseno, aunque g tenga solo uno"}, {"tipo": "gadget", "id": "g_propuesta", "titulo": "Generador de propuestas $y_p$", "instrucciones": "Elige la parte homogénea (cada una sale de un control o clase) y arma $g(x)=x^m e^{kx}\\cos\\beta x$ o con seno. El gadget te dice el número de prueba, si choca con las raíces y la propuesta correcta. Practica: piensa la respuesta antes de mirar."}, {"tipo": "ejemplo", "titulo": "Clase 12: suma de dos tipos", "enunciado": "Resuelva $y''-3y'+2y=2xe^{3x}+3\\sin x$.", "pasos": [{"titulo": "Homogénea", "md": "$m^2-3m+2=(m-1)(m-2)=0$ ⇒ $y_h=c_1e^x+c_2e^{2x}$."}, {"titulo": "Separar (superposición)", "md": "Para $2xe^{3x}$: número $3$, no es raíz ⇒ $y_{p1}=(Ax+B)e^{3x}$. Para $3\\sin x$: número $i$, no es raíz ⇒ $y_{p2}=C\\cos x+D\\sin x$."}, {"titulo": "Primera", "md": "Reemplazando: $e^{3x}[2Ax+3A+2B]=2xe^{3x}$ ⇒ $A=1$, $B=-\\frac32$."}, {"titulo": "Segunda", "md": "$(C-3D)\\cos x+(3C+D)\\sin x=3\\sin x$ ⇒ $C=3D$, $10D=3$ ⇒ $D=\\frac3{10}$, $C=\\frac9{10}$."}], "respuesta": "$y=c_1e^x+c_2e^{2x}+\\left(x-\\tfrac32\\right)e^{3x}+\\tfrac9{10}\\cos x+\\tfrac3{10}\\sin x$"}, {"tipo": "texto", "titulo": "Variación de parámetros", "md": "Sirve **siempre** que conozcas $y_h$, incluso con coeficientes variables o con $g$ como $\\tan x$, $\\sec x$, $\\ln x$, $1/t$, $t^{-3}e^{3t}$ (donde coef. indeterminados no funciona). Se reemplazan las constantes de $y_h$ por funciones: $y_p=u_1(x)y_1+u_2(x)y_2$, imponiendo\n$$\\begin{cases}u_1'y_1+u_2'y_2=0\\\\u_1'y_1'+u_2'y_2'=f(x)\\end{cases}$$\ny por Cramer se obtiene:"}, {"tipo": "formula", "tex": "W=\\begin{vmatrix}y_1&y_2\\\\y_1'&y_2'\\end{vmatrix},\\quad W_1=\\begin{vmatrix}0&y_2\\\\f&y_2'\\end{vmatrix}=-y_2f,\\quad W_2=\\begin{vmatrix}y_1&0\\\\y_1'&f\\end{vmatrix}=y_1f", "nota": "los \"3 wronskianos\" de la pauta (3 pts)"}, {"tipo": "formula", "tex": "u_1=\\int\\frac{W_1}{W}dx,\\qquad u_2=\\int\\frac{W_2}{W}dx,\\qquad y_p=u_1y_1+u_2y_2", "nota": "constantes de integración: se omiten"}, {"tipo": "lapiz", "texto": "f = lado derecho DESPUÉS de dividir por a₂(x)"}, {"tipo": "nota", "md": "Para orden $n$: $c_k=\\int\\frac{V_k(x)h(x)}{W}dx$, con $V_k$ el wronskiano con la columna $k$ cambiada por $(0,\\dots,0,1)^T$."}, {"tipo": "gadget", "id": "g_vp", "titulo": "Variación de parámetros paso a paso", "instrucciones": "Elige un ejercicio y avanza paso a paso. La secuencia es siempre la misma: normalizar → $y_1,y_2$ → $W,W_1,W_2$ → $u_1',u_2'$ → integrar → $y_p$."}, {"tipo": "ejemplo", "titulo": "Clase 12: $y''+y=\\tan x$", "enunciado": "Resuelva $y''+y=\\tan x$.", "pasos": [{"titulo": "Homogénea", "md": "$m=\\pm i$ ⇒ $y_1=\\cos x$, $y_2=\\sin x$, $W=\\cos^2x+\\sin^2x=1$."}, {"titulo": "$u_1$", "md": "$u_1'=-\\sin x\\tan x=-\\frac{\\sin^2x}{\\cos x}=\\cos x-\\sec x$ ⇒ $u_1=\\sin x-\\ln|\\sec x+\\tan x|$."}, {"titulo": "$u_2$", "md": "$u_2'=\\cos x\\tan x=\\sin x$ ⇒ $u_2=-\\cos x$."}, {"titulo": "Armar", "md": "$y_p=\\cos x\\sin x-\\cos x\\ln|\\sec x+\\tan x|-\\sin x\\cos x$"}], "respuesta": "$y=c_1\\cos x+c_2\\sin x-\\cos x\\ln|\\sec x+\\tan x|$"}, {"tipo": "tabla", "columnas": ["Situación", "Método recomendado"], "filas": [["Coef. constantes y $g$ = polinomio/exp/sen/cos", "Coef. indeterminados (más rápido)"], ["$g$ con $\\tan$, $\\sec$, $\\ln$, potencias negativas", "Variación de parámetros"], ["Coeficientes variables (te dan $y_1$, o es Cauchy-Euler)", "Variación de parámetros (normalizando)"], ["El enunciado nombra el método", "El que piden: el otro puede valer 0"]]}, {"tipo": "ojo", "items": ["Proponer $Ae^{3x}$ cuando $e^{3x}\\in y_h$: al reemplazar da $0=1$ (hay que usar $Axe^{3x}$).", "Raíz doble y $g=e^{rx}$ con esa misma $r$: se multiplica por $x^2$, no por $x$ (control 60 min: $Dt^2e^t$).", "Polinomio incompleto: para $g=t^2+1$ se propone $At^2+Bt+C$, no $At^2+C$.", "En VP olvidar normalizar: en $x^2y''-2xy'+2y=x^2\\ln x$ la $f$ es $\\ln x$, no $x^2\\ln x$.", "Confundir el orden de $W_1$ y el signo: $u_1'=-y_2f/W$."]}]}, {"id": "c4", "titulo": "Control · Sistemas masa-resorte", "peso": 3, "intro": "La aplicación del control: siempre vale una pregunta entera (20 pts). Los puntos están en plantear bien (Hooke, la EDO, los signos de las condiciones iniciales) más que en resolver, que ya sabes hacer por el capítulo 3.", "bloques": [{"tipo": "texto", "titulo": "Ley de Hooke y la constante k", "md": "El resorte ejerce una fuerza restauradora proporcional al estiramiento: $F=ks$. Al colgar la masa, llega al **equilibrio** cuando el peso iguala a esa fuerza:\n$$mg=ks.$$\nDe aquí sale $k$ (o $m$). Ojo con las unidades: si te dan el **peso** en libras, la masa es $m=W/g=W/32$ slug; si te dan la masa en kg, el peso es $W=9{,}8\\,m$ N."}, {"tipo": "tabla", "columnas": ["Sistema", "Masa", "Fuerza", "$g$"], "filas": [["Inglés", "slug", "libra (lb)", "$32$ pie/s²"], ["SI", "kg", "newton (N)", "$9{,}8$ m/s²"], ["CGS", "g", "dina", "$980$ cm/s²"]]}, {"tipo": "ejemplo", "titulo": "Clase 15, ejemplo 3: sacar m y k", "enunciado": "Una masa que pesa 16 lb se une a un resorte de 5 pies de largo. En equilibrio el resorte mide 8,2 pies. ¿Cuánto valen $m$ y $k$?", "pasos": [{"titulo": "Masa", "md": "$m=\\frac{W}{g}=\\frac{16}{32}=\\frac12$ slug"}, {"titulo": "Estiramiento", "md": "$s=8{,}2-5=3{,}2$ pies"}, {"titulo": "Hooke", "md": "$k=\\frac{W}{s}=\\frac{16}{3{,}2}=5$ lb/pie"}], "respuesta": "$m=\\tfrac12$ slug, $k=5$ lb/pie"}, {"tipo": "texto", "titulo": "La ecuación de movimiento", "md": "Si $x(t)$ es el desplazamiento medido **desde el equilibrio**, la segunda ley de Newton da (el peso se cancela con $ks$):\n$$m\\frac{d^2x}{dt^2}+c\\frac{dx}{dt}+kx=f(t)$$\n- $c\\ge 0$: constante de amortiguamiento (roce $=c\\,x'$). \"Fuerza amortiguadora igual a 2 veces la velocidad\" ⇒ $c=2$.\n- $f(t)$: fuerza externa (si no hay, movimiento **libre**).\n\n**Convención de clase: abajo es positivo.** Si el enunciado fija otra (la pauta 29/04 toma arriba positivo), úsala y dilo explícitamente."}, {"tipo": "tabla", "columnas": ["El enunciado dice…", "con abajo positivo"], "filas": [["\"se suelta / se libera desde el reposo\"", "$x'(0)=0$"], ["\"3 m bajo la posición de equilibrio\"", "$x(0)=3$"], ["\"1 pie sobre / arriba del equilibrio\"", "$x(0)=-1$"], ["\"desde la posición de equilibrio\"", "$x(0)=0$"], ["\"velocidad de 10 pie/s hacia arriba\" / \"ascendente\"", "$x'(0)=-10$"], ["\"velocidad hacia abajo de 2 m/s\"", "$x'(0)=2$"]]}, {"tipo": "lapiz", "texto": "condiciones iniciales: 2 a 3 pts por pregunta"}, {"tipo": "gadget", "id": "g_signos", "titulo": "Traductor de condiciones iniciales", "instrucciones": "Lee el enunciado generado al azar, escribe $x(0)$ y $x'(0)$ con la convención indicada y revisa. Repite hasta que no te equivoques nunca."}, {"tipo": "texto", "titulo": "Movimiento libre no amortiguado", "md": "Con $c=0$ y $f=0$: $x''+\\omega^2x=0$, $\\omega^2=\\frac km$. La auxiliar $r^2+\\omega^2=0$ da $r=\\pm\\omega i$:\n$$x(t)=c_1\\cos\\omega t+c_2\\sin\\omega t$$\n- **Frecuencia circular** $\\omega=\\sqrt{k/m}$ (rad/s)\n- **Periodo** $T=\\frac{2\\pi}{\\omega}$ (tiempo de un ciclo)\n- **Frecuencia** $f=\\frac1T=\\frac{\\omega}{2\\pi}$ (ciclos por segundo)\n- **Amplitud** $A=\\sqrt{c_1^2+c_2^2}$"}, {"tipo": "definicion", "etiqueta": "Propiedad", "nombre": "Forma sinusoidal", "md": "$c_1\\cos\\omega t+c_2\\sin\\omega t=A\\sin(\\omega t+\\varphi)$ con $A=\\sqrt{c_1^2+c_2^2}$ y\n$$\\sin\\varphi=\\frac{c_1}{A},\\qquad\\cos\\varphi=\\frac{c_2}{A},\\qquad\\tan\\varphi=\\frac{c_1}{c_2}.$$\nEl ángulo de fase $\\varphi$ debe quedar en el **cuadrante correcto** según los signos de $c_1$ y $c_2$: si $c_2<0$, hay que sumar $\\pi$ al $\\arctan(c_1/c_2)$."}, {"tipo": "gadget", "id": "g_fase", "titulo": "Amplitud y ángulo de fase", "instrucciones": "Mueve $c_1$ y $c_2$. La curva morada es $c_1\\cos\\omega t+c_2\\sin\\omega t$ y la punteada en verde es $A\\sin(\\omega t+\\varphi)$ con el $\\varphi$ correcto (deben coincidir). Si usas solo $\\arctan(c_1/c_2)$ con $c_2<0$, aparece en rojo la curva equivocada."}, {"tipo": "ejemplo", "titulo": "Guía 3, ejercicio 9", "enunciado": "Un cuerpo de 0,25 kg está unido a un resorte que se estira 0,25 m con una fuerza de 9 N. En $t=0$ se estira 1 m por debajo del equilibrio y se libera con velocidad de 5 m/s hacia arriba. Halle $x(t)$, amplitud y periodo.", "pasos": [{"titulo": "Constantes", "md": "$k=\\frac{9}{0{,}25}=36$ N/m, $\\omega=\\sqrt{36/0{,}25}=12$."}, {"titulo": "PVI", "md": "$x''+144x=0$, $x(0)=1$, $x'(0)=-5$."}, {"titulo": "Resolver", "md": "$x=c_1\\cos12t+c_2\\sin12t$: $c_1=1$, $12c_2=-5$ ⇒ $c_2=-\\frac5{12}$."}, {"titulo": "A y T", "md": "$A=\\sqrt{1+\\frac{25}{144}}=\\frac{13}{12}$ m, $T=\\frac{2\\pi}{12}=\\frac\\pi6$ s."}], "respuesta": "$x(t)=\\cos12t-\\frac5{12}\\sin12t$, $A=\\frac{13}{12}$ m, $T=\\frac\\pi6$ s"}, {"tipo": "texto", "titulo": "Movimiento libre amortiguado: los tres casos", "md": "Con roce: $mx''+cx'+kx=0$, o normalizada $x''+\\frac cmx'+\\frac kmx=0$. Las raíces son\n$$\\lambda_{1,2}=-\\frac{c}{2m}\\pm\\frac{1}{2m}\\sqrt{c^2-4mk}$$\ny el signo de $c^2-4mk$ decide el tipo de movimiento. Con $\\alpha=\\frac c{2m}$:"}, {"tipo": "tabla", "columnas": ["Caso", "Condición", "Solución", "Comportamiento"], "filas": [["Sobreamortiguado", "$c^2>4mk$", "$c_1e^{\\lambda_1t}+c_2e^{\\lambda_2t}$ (ambas $\\lambda<0$)", "No oscila; vuelve lento al equilibrio"], ["Crítico", "$c^2=4mk$", "$(c_1+c_2t)e^{-\\alpha t}$", "No oscila; cruza $x=0$ a lo más una vez"], ["Subamortiguado", "$c^2<4mk$", "$e^{-\\alpha t}(c_1\\cos\\omega^*t+c_2\\sin\\omega^*t)$", "Oscila con amplitud que decae como $Ae^{-\\alpha t}$"]]}, {"tipo": "formula", "tex": "\\omega^*=\\frac{1}{2m}\\sqrt{4mk-c^2}=\\sqrt{\\frac km-\\frac{c^2}{4m^2}}", "nota": "frecuencia del caso subamortiguado"}, {"tipo": "gadget", "id": "g_resorte", "titulo": "Simulador masa-resorte", "instrucciones": "Ajusta $m$, $c$, $k$, las condiciones iniciales y la fuerza externa $F_0\\cos\\gamma t$ (abajo positivo). Se clasifica el caso con $c^2$ vs $4mk$ y se cuentan los cruces por el equilibrio. Prueba los botones con los problemas de controles y busca la **resonancia** ($c=0$, $\\gamma=\\omega$)."}, {"tipo": "ejemplo", "titulo": "Clase 15, ejemplo 2 (amortiguamiento crítico)", "enunciado": "Una masa que pesa 8 lb alarga 2 pies un resorte. Una fuerza amortiguadora igual a dos veces la velocidad actúa sobre el sistema. Determine la ecuación de movimiento si se libera desde el equilibrio con velocidad ascendente de 3 pie/s.", "pasos": [{"titulo": "Datos", "md": "$m=\\frac8{32}=\\frac14$ slug, $k=\\frac82=4$ lb/pie, $c=2$."}, {"titulo": "EDO", "md": "$\\frac14x''+2x'+4x=0\\Rightarrow x''+8x'+16x=0$. Como $c^2=4=4mk=4$: **crítico**."}, {"titulo": "Resolver", "md": "$(r+4)^2=0$ ⇒ $x=(c_1+c_2t)e^{-4t}$. $x(0)=0$ ⇒ $c_1=0$; $x'(0)=c_2=-3$."}], "respuesta": "$x(t)=-3te^{-4t}$"}, {"tipo": "texto", "titulo": "Movimiento forzado y resonancia", "md": "Con fuerza externa: $mx''+cx'+kx=f(t)$. Es una no homogénea de coeficientes constantes: $x=x_h+x_p$ con coef. indeterminados o VP.\n\n- **Con amortiguamiento:** $x_h\\to 0$ (parte **transitoria**) y queda $x_p$ (parte **estacionaria**).\n- **Sin amortiguamiento y $f=F_0\\cos\\omega t$ con la misma $\\omega=\\sqrt{k/m}$:** el número de prueba $\\omega i$ es raíz, así que $x_p=t(A\\cos\\omega t+B\\sin\\omega t)$: la amplitud crece sin límite (**resonancia**). Ejemplo: $x''+x=2\\cos t$, $x(0)=x'(0)=0$ ⇒ $x=t\\sin t$ (Control 2025-2, P3)."}, {"tipo": "ejemplo", "titulo": "Clase 15, ejemplo 4 (forzado con amortiguamiento)", "enunciado": "Un objeto que pesa 32 lb alarga un resorte $\\frac{32}{9}$ pies. Se sumerge en un líquido con resistencia de 6 lb por pie/s y se aplica $f(t)=\\sin 4t$. Halle $x(t)$ si $x(0)=x'(0)=0$.", "pasos": [{"titulo": "Datos", "md": "$m=1$, $k=\\frac{32}{32/9}=9$, $c=6$: $x''+6x'+9x=\\sin4t$ (crítico, $r=-3$ doble)."}, {"titulo": "Particular", "md": "$x_p=A\\cos4t+B\\sin4t$: $(-7A+24B)\\cos4t+(-24A-7B)\\sin4t=\\sin4t$ ⇒ $A=-\\frac{24}{625}$, $B=-\\frac{7}{625}$."}, {"titulo": "Condiciones", "md": "$x=(c_1+c_2t)e^{-3t}+x_p$: $x(0)=0$ ⇒ $c_1=\\frac{24}{625}$; $x'(0)=-3c_1+c_2-\\frac{28}{625}=0$ ⇒ $c_2=\\frac{4}{25}$."}], "respuesta": "$x(t)=\\left(\\frac{24}{625}+\\frac{4}{25}t\\right)e^{-3t}-\\frac{24}{625}\\cos4t-\\frac{7}{625}\\sin4t$"}, {"tipo": "ojo", "items": ["Usar el peso (lb) como si fuera masa: 8 lb ⇒ $m=8/32$ slug.", "Signo de las condiciones iniciales: \"sobre\" y \"hacia arriba\" son negativos con abajo positivo.", "Contar cruces por el equilibrio con $t<0$: en $(2+4t)e^{-2t}=0$ la raíz $t=-\\frac12$ no cuenta → 0 cruces.", "Ángulo de fase en el cuadrante equivocado (revisa los signos de $c_1$ y $c_2$).", "Clasificar con $c^2$ vs $4k$ olvidando la $m$: es $c^2$ vs $4mk$."]}, {"tipo": "texto", "titulo": "Tu resorte del proyecto en las tres categorías", "md": "Para la pesa de 514 g y el elástico de $k=25{,}72$ N/m: $4mk=52{,}9$ y el amortiguamiento crítico es $c_{crit}=2\\sqrt{km}=7{,}27$ kg/s. El $c=0{,}68$ kg/s ajustado a los saltos da $c^2=0{,}46\\ll4mk$: **subamortiguado**, con $\\zeta=c/c_{crit}=0{,}094$.\n\nCon $\\alpha=c/(2m)=0{,}661$ 1/s y $\\omega^*=\\sqrt{\\omega^2-\\alpha^2}=7{,}043$ rad/s, el período es $T^*=2\\pi/\\omega^*=0{,}892$ s y en cada ciclo la amplitud se multiplica por $e^{-\\alpha T^*}=0{,}55$."}, {"tipo": "tabla", "titulo": "Clasificación con $m=0{,}514$ kg y $k=25{,}72$ N/m", "columnas": ["Caso", "Condición", "Ejemplo"], "filas": [["Subamortiguado", "$c^2<4mk$", "$c=0{,}68$ kg/s"], ["Crítico", "$c^2=4mk$", "$c=7{,}27$ kg/s"], ["Sobreamortiguado", "$c^2>4mk$", "$c=12$ kg/s"]]}, {"tipo": "nota", "md": "En el salto el oscilador no completa ciclos: cuando el peso sube, la cuerda se afloja y vuelve la caída libre. Pero la clasificación y las fórmulas de $\\alpha$ y $\\omega^*$ son las mismas del capítulo."}]}, {"id": "c5", "titulo": "Control · Resolver a mano el modelo del salto", "peso": 3, "intro": "El control evalúa si dominas la resolución del proyecto. Esto es lo que tienes que poder escribir en una hoja: el PVI de cada etapa, la solución, el empalme y los valores.", "bloques": [{"tipo": "texto", "titulo": "Plantear las dos etapas como PVI", "md": "**Etapa 1, cuerda floja.** $m\\ddot y=mg$, con $y(0)=0$ y $\\dot y(0)=0$. Integrando dos veces: $y=\\tfrac12gt^2$. Se tensa cuando $y=L_c$: $t^*=\\sqrt{2L_c/g}$ y $v^*=\\sqrt{2gL_c}$.\n\n**Etapa 2, cuerda tensa.** Con $u=y-L_c$: $m\\ddot u+ku=mg$, con $u(t^*)=0$ y $\\dot u(t^*)=v^*$.\n\nSi el enunciado da el peso $W$ y no la masa: $m=W/g$. Si un peso estira el resorte una distancia $s$ en equilibrio: $k=W/s$ (ley de Hooke)."}, {"tipo": "texto", "titulo": "Resolver la etapa 2 de dos maneras", "md": "**Coeficientes indeterminados.** La homogénea $m\\ddot u+ku=0$ tiene ecuación auxiliar $mr^2+k=0$, es decir $r=\\pm i\\omega$ con $\\omega=\\sqrt{k/m}$. Entonces $u_h=c_1\\cos\\omega s+c_2\\sin\\omega s$, con $s=t-t^*$. El lado derecho es constante, así que se propone $u_p=A$ y se obtiene $kA=mg$, o sea $A=\\delta_e=mg/k$. Las condiciones $u(t^*)=0$ y $\\dot u(t^*)=v^*$ dan $c_1=-\\delta_e$ y $c_2=v^*/\\omega$.\n\n**Cambio de variable (clase 14).** Con $x=u-\\delta_e$ (desplazamiento desde el equilibrio) queda $\\ddot x+\\omega^2x=0$, el movimiento libre no amortiguado, con $x(t^*)=-\\delta_e$ y $\\dot x(t^*)=v^*$. La solución es la misma."}, {"tipo": "formula", "tex": "u(t)=\\delta_e\\left[1-\\cos\\omega s\\right]+\\frac{v^*}{\\omega}\\sin\\omega s,\\qquad R=\\sqrt{\\delta_e^2+\\left(\\frac{v^*}{\\omega}\\right)^2},\\quad u_{\\max}=\\delta_e+R", "nota": "Oscilación armónica alrededor de $\\delta_e$; su extremo inferior es $u_{\\max}$."}, {"tipo": "formula", "tex": "u(t)=\\delta_e+e^{-\\alpha s}\\left[-\\delta_e\\cos\\omega^*s+\\frac{v^*-\\alpha\\delta_e}{\\omega^*}\\sin\\omega^*s\\right],\\quad \\alpha=\\frac{c}{2m},\\ \\omega^*=\\sqrt{\\omega^2-\\alpha^2}", "nota": "Con amortiguamiento subamortiguado ($c^2<4mk$). El punto más bajo ocurre en $s_{\\min}=\\frac1{\\omega^*}\\left[\\pi-\\arctan\\frac{v^*\\omega^*}{g-\\alpha v^*}\\right]$ (con $g-\\alpha v^*>0$)."}, {"tipo": "tabla", "titulo": "Notación del proyecto frente a la del curso", "columnas": ["Proyecto", "Curso (clases 14 y 15)", "Relación"], "filas": [["$u$: elongación desde el largo natural", "$x$: desplazamiento desde el equilibrio, positivo hacia abajo", "$x=u-\\delta_e$"], ["$\\omega=\\sqrt{k/m}$", "$w=\\sqrt{k/m}$, frecuencia circular", "igual"], ["$c=2\\zeta\\sqrt{km}$", "$c$: constante de amortiguamiento, $F=c\\,x'$", "igual; $\\zeta=c/c_{crit}$"], ["$t^*$: instante de empalme", "condiciones iniciales $x(t_0)$, $x'(t_0)$", "se resuelve con $s=t-t^*$"]]}, {"tipo": "gadget", "id": "g_resolver", "titulo": "Resolución completa con tus números", "instrucciones": "Mueve m, k, L_c y c. Se muestra el PVI, el caso de la ecuación auxiliar, la solución y los valores; compara con tu cálculo a mano."}, {"tipo": "ejemplo", "titulo": "Pesa de 214,5 g con el mismo elástico, sin amortiguamiento", "enunciado": "Con $k=25{,}72$ N/m y $L_c=0{,}77$ m, determina $t^*$, $v^*$, la solución de la etapa 2, $u_{\\max}$, $t_{\\min}$ y la distancia al suelo si $H=1{,}70$ m, $L_0=0{,}59$ m y $h_s=0{,}18$ m.", "pasos": [{"titulo": "Etapa 1", "md": "$t^*=\\sqrt{2\\cdot0{,}77/9{,}81}=0{,}396$ s y $v^*=\\sqrt{2\\cdot9{,}81\\cdot0{,}77}=3{,}887$ m/s."}, {"titulo": "Etapa 2: datos", "md": "$\\omega=\\sqrt{25{,}72/0{,}2145}=10{,}950$ rad/s y $\\delta_e=\\dfrac{0{,}2145\\cdot9{,}81}{25{,}72}=8{,}18$ cm."}, {"titulo": "Solución", "md": "$u=\\delta_e[1-\\cos\\omega s]+\\dfrac{v^*}{\\omega}\\sin\\omega s$ con $\\dfrac{v^*}{\\omega}=35{,}50$ cm."}, {"titulo": "Elongación máxima", "md": "$R=\\sqrt{8{,}18^2+35{,}50^2}=36{,}43$ cm y $u_{\\max}=\\delta_e+R=44{,}61$ cm."}, {"titulo": "Instante y distancia al suelo", "md": "$t_{\\min}=t^*+\\dfrac1\\omega\\left[\\pi-\\arctan\\dfrac{v^*}{\\omega\\delta_e}\\right]=0{,}560$ s. $D=1{,}70-0{,}59-0{,}18-0{,}446=48{,}4$ cm."}], "respuesta": "$u_{\\max}=44{,}6$ cm, $t_{\\min}=0{,}56$ s y $D=48{,}4$ cm.", "lapiz": "escribe el PVI antes de resolver: ahí está la mitad del puntaje"}, {"tipo": "ojo", "items": ["Dar las condiciones iniciales de la etapa 2 en $t=0$ en vez de $t^*$ (o no usar $s=t-t^*$).", "Olvidar la solución particular: sin $\\delta_e$ la oscilación quedaría centrada en $u=0$.", "Cambiar el signo de $g$ al pasar de $u$ a $x$: la ecuación en $x$ ya no tiene $mg$ a la derecha."]}]}, {"id": "c6", "titulo": "Control · Resistencia del aire: EDO de primer orden", "peso": 2, "intro": "El informe menciona que la etapa 1 podría incluir resistencia del aire. Es una EDO de primer orden lineal y autónoma (clases 3, 4 y 9). Entra como variante del modelo.", "bloques": [{"tipo": "texto", "titulo": "El modelo", "md": "Con resistencia proporcional a la velocidad, $m\\dot v=mg-\\beta v$, con $v(0)=0$. Es **lineal de primer orden** ($v'+\\frac{\\beta}{m}v=g$) y **autónoma** (el lado derecho no depende de $t$). Su campo direccional tiene pendiente positiva bajo $v_T=mg/\\beta$ y negativa sobre él: $v_T$ es un equilibrio estable, la **velocidad terminal**."}, {"tipo": "texto", "titulo": "Dos formas de resolver", "md": "**Variables separables.** $\\dfrac{dv}{g-\\frac{\\beta}{m}v}=dt$. Integrando, $-\\frac{m}{\\beta}\\ln\\left|g-\\frac{\\beta}{m}v\\right|=t+C$, y con $v(0)=0$ resulta $v=\\frac{mg}{\\beta}\\left(1-e^{-\\beta t/m}\\right)$.\n\n**Factor integrante.** $\\mu=e^{\\beta t/m}$ da $\\left(e^{\\beta t/m}v\\right)'=g\\,e^{\\beta t/m}$, que se integra igual."}, {"tipo": "formula", "tex": "v(t)=\\frac{mg}{\\beta}\\left(1-e^{-\\beta t/m}\\right),\\qquad y(t)=\\frac{mg}{\\beta}\\,t-\\frac{m^2g}{\\beta^2}\\left(1-e^{-\\beta t/m}\\right),\\qquad v_T=\\frac{mg}{\\beta},\\ \\tau=\\frac{m}{\\beta}", "nota": "Para $\\beta t/m\\ll1$: $v\\approx gt\\left(1-\\frac{\\beta t}{2m}\\right)$, es decir, caída libre."}, {"tipo": "gadget", "id": "g_aire", "titulo": "Caída con y sin resistencia del aire", "instrucciones": "Mueve β y mira cómo cambian t* y v*. Con β = 0 vuelve la caída libre del modelo."}, {"tipo": "tabla", "titulo": "Efecto sobre la etapa 1 con $m=0{,}514$ kg y $L_c=0{,}77$ m", "columnas": ["β [kg/s]", "$v_T$ [m/s]", "$t^*$ [s]", "$v^*$ [m/s]", "Menos velocidad que sin aire"], "filas": [["0 (sin aire)", "—", "0,3962", "3,887", "0 %"], ["0,005", "1008", "0,3965", "3,882", "0,13 %"], ["0,2", "25,2", "0,4067", "3,690", "5,1 %"], ["0,5", "10,1", "0,4234", "3,404", "12,4 %"]]}, {"tipo": "nota", "md": "Los valores de $\\beta$ son ejemplos para ver el efecto: no se midió el del prototipo. Con velocidades de unos 4 m/s y una pesa chica el aire casi no importa. En un salto real (más de 17 m/s) sí. En el informe la pérdida de energía se modela con amortiguamiento solo con la cuerda tensa (sección 2.4.2)."}, {"tipo": "ejemplo", "titulo": "Una masa de 0,4 kg con β = 0,2 kg/s", "enunciado": "Plantea la EDO, resuelve y calcula la velocidad terminal, la constante de tiempo y $v(\\tau)$.", "pasos": [{"titulo": "Plantear", "md": "$0{,}4\\,\\dot v=0{,}4\\cdot9{,}81-0{,}2\\,v$, con $v(0)=0$, es decir $\\dot v=9{,}81-0{,}5\\,v$."}, {"titulo": "Resolver", "md": "$v=\\dfrac{0{,}4\\cdot9{,}81}{0{,}2}\\left(1-e^{-0{,}5t}\\right)=19{,}62\\left(1-e^{-0{,}5t}\\right)$."}, {"titulo": "Magnitudes", "md": "$v_T=19{,}62$ m/s y $\\tau=m/\\beta=2$ s. En $t=\\tau$ la velocidad es $(1-e^{-1})v_T=12{,}4$ m/s, 63 % de $v_T$."}], "respuesta": "$v_T=19{,}62$ m/s, $\\tau=2$ s, $v(\\tau)=12{,}4$ m/s."}, {"tipo": "ojo", "items": ["Pensar que el cuerpo sigue acelerando siempre: con aire la velocidad se acerca a $v_T=mg/\\beta$.", "Resolver con coeficientes indeterminados: es de primer orden, se usa separable o factor integrante.", "Olvidar que $t^*$ ya no tiene la fórmula $\\sqrt{2L/g}$: sale de resolver $y(t^*)=L_c$ (numéricamente)."]}]}, {"id": "c7", "titulo": "Control · Métodos numéricos: Euler y Runge-Kutta", "peso": 2, "intro": "La clase 8 enseña Euler y RK2 para PVI de primer orden. El proyecto simuló las dos etapas numéricamente, así que el método y su error son materia del control.", "bloques": [{"tipo": "texto", "titulo": "Los métodos (clase 8)", "md": "Para el PVI $y'=f(x,y)$, $y(x_0)=y_0$, con paso $h$:\n\n- **Euler:** $y_{n+1}=y_n+h\\,f(x_n,y_n)$ (la recta tangente).\n- **RK2:** $y_{n+1}=y_n+\\dfrac h2(k_1+k_2)$, con $k_1=f(x_n,y_n)$ y $k_2=f(x_n+h,\\,y_n+hk_1)$.\n\nUn paso más chico mejora la aproximación en ambos métodos; RK2 la mejora mucho más rápido que Euler."}, {"tipo": "ejemplo", "titulo": "$\\dot v=9{,}81-0{,}5\\,v$, $v(0)=0$, con $h=0{,}1$ (la caída con aire del capítulo anterior)", "enunciado": "Aproxima $v(0{,}2)$ con Euler y con RK2 y compara con el valor exacto $19{,}62\\left(1-e^{-0{,}1}\\right)$.", "pasos": [{"titulo": "Euler", "md": "$v_1=0+0{,}1\\,(9{,}81)=0{,}981$. $v_2=0{,}981+0{,}1\\,(9{,}81-0{,}5\\cdot0{,}981)=1{,}913$."}, {"titulo": "RK2, primer paso", "md": "$k_1=9{,}81$, $k_2=9{,}81-0{,}5\\,(0+0{,}1\\cdot9{,}81)=9{,}3195$. $v_1=\\frac{0{,}1}{2}(9{,}81+9{,}3195)=0{,}95648$."}, {"titulo": "RK2, segundo paso", "md": "$v_2=1{,}8663$."}, {"titulo": "Exacto y errores", "md": "$v(0{,}2)=1{,}8671$. Euler: error de $2{,}5\\,\\%$. RK2: error de $-0{,}04\\,\\%$."}], "respuesta": "Euler $1{,}913$, RK2 $1{,}866$, exacto $1{,}867$ m/s."}, {"tipo": "texto", "titulo": "De segundo orden a sistema", "md": "La etapa 2 es de segundo orden. Para usar Euler o RK se escribe como sistema de primer orden, con $w=\\dot u$:\n\n$$\\dot u=w,\\qquad \\dot w=g-\\frac{k}{m}u-\\frac{c}{m}w.$$\n\nEl método se aplica al vector $(u,w)$. En el proyecto se simularon así las dos etapas (con $\\ddot y=g$ mientras la cuerda está floja). Como la ecuación cambia en $u=0$, conviene un paso pequeño. **Euler explícito sobreestima la amplitud del oscilador** porque agrega energía en cada paso."}, {"tipo": "gadget", "id": "g_numerico", "titulo": "Euler, RK2 y RK4 sobre el oscilador", "instrucciones": "Cambia el método y el paso h. Mira el error en la elongación máxima y cómo se separa Euler de la curva exacta."}, {"tipo": "ojo", "items": ["Usar $f(x_{n+1},y_{n+1})$ en Euler: se evalúa en el punto actual, $(x_n,y_n)$.", "En RK2 olvidar el factor $h/2$ al promediar las dos pendientes.", "Aplicar el método directamente a una EDO de segundo orden sin convertirla en sistema."]}]}, {"id": "c8", "titulo": "Control · Mínimos cuadrados y error estándar", "peso": 2, "intro": "El ajuste de $F$ contra $x$ es el corazón experimental. Debes poder calcular a mano una recta de mínimos cuadrados, su $R^2$ y el error de la pendiente, y propagar esos errores a $h_1$.", "bloques": [{"tipo": "texto", "titulo": "De los datos a las fórmulas", "md": "Con $n$ puntos $(x_i,y_i)$, $\\bar x$ y $\\bar y$ los promedios, y\n\n$$S_{xx}=\\sum(x_i-\\bar x)^2,\\quad S_{xy}=\\sum(x_i-\\bar x)(y_i-\\bar y),\\quad S_{yy}=\\sum(y_i-\\bar y)^2$$\n\nla recta $y=kx+b$ que minimiza $\\sum(y_i-kx_i-b)^2$ tiene $k=S_{xy}/S_{xx}$ y $b=\\bar y-k\\bar x$."}, {"tipo": "formula", "tex": "s^2=\\frac{SSE}{n-2},\\quad SE(k)=\\frac{s}{\\sqrt{S_{xx}}},\\quad SE(b)=s\\sqrt{\\frac1n+\\frac{\\bar x^2}{S_{xx}}},\\quad R^2=1-\\frac{SSE}{S_{yy}}", "nota": "$SSE=\\sum(y_i-\\hat y_i)^2$. Se divide por $n-2$ porque se estimaron dos parámetros."}, {"tipo": "ejemplo", "titulo": "Recta por mínimos cuadrados a mano", "enunciado": "Ajusta una recta a los puntos $(1,2)$, $(2,4)$, $(3,5)$ y calcula $R^2$ y $SE(k)$.", "pasos": [{"titulo": "Promedios y sumas", "md": "$\\bar x=2$, $\\bar y=3{,}667$. $S_{xx}=1+0+1=2$ y $S_{xy}=(-1)(-1{,}667)+0+(1)(1{,}333)=3$."}, {"titulo": "Pendiente e intercepto", "md": "$k=3/2=1{,}5$ y $b=3{,}667-1{,}5\\cdot2=0{,}667$."}, {"titulo": "Residuos", "md": "Valores ajustados $2{,}167;\\ 3{,}667;\\ 5{,}167$. Residuos $-0{,}167;\\ 0{,}333;\\ -0{,}167$. $SSE=0{,}1667$."}, {"titulo": "$R^2$ y error estándar", "md": "$S_{yy}=4{,}667$, $R^2=1-0{,}1667/4{,}667=0{,}964$. $s^2=SSE/(3-2)=0{,}1667$ y $SE(k)=\\sqrt{s^2/S_{xx}}=0{,}2887$."}], "respuesta": "$y=1{,}5x+0{,}667$, $R^2=0{,}964$, $SE(k)=0{,}289$."}, {"tipo": "tabla", "titulo": "Los 6 puntos del proyecto (x en m, F en N)", "columnas": ["$\\bar x$", "$\\bar y$", "$S_{xx}$", "$S_{xy}$", "$k$", "$b$", "$s$", "$SE(k)$", "$SE(b)$", "$R^2$"], "filas": [["0,328", "8,93", "0,344", "8,844", "25,72", "0,487", "1,13", "1,93", "0,78", "0,978"]]}, {"tipo": "texto", "titulo": "Propagación del error a $h_1$", "md": "Si $h_1$ depende de parámetros medidos $p_i$ con incertidumbres $\\sigma_i$ independientes, $\\sigma_{h_1}^2=\\sum_i\\left(\\dfrac{\\partial h_1}{\\partial p_i}\\right)^2\\sigma_i^2$.\n\nPara 514 g, $H=1{,}81$ m, $\\delta=3$ cm: $\\dfrac{\\partial h_1}{\\partial k}=0{,}0204$ m/(N/m), así que $\\sigma_k=1{,}93$ N/m aporta 3,9 cm. $\\dfrac{\\partial h_1}{\\partial h_s}=-1{,}33$, así que $\\sigma_{h_s}=1{,}5$ cm aporta 2,0 cm. Juntas: $\\sigma_{h_1}=4{,}4$ cm, el ±4,5 cm del informe. La masa ($\\partial h_1/\\partial m=-1{,}02$ m/kg) con ±1 g aporta solo 0,1 cm."}, {"tipo": "gadget", "id": "g_propaga", "titulo": "Quién domina el error de h₁", "instrucciones": "Cambia las incertidumbres de cada parámetro. El gráfico muestra cuánto aporta cada una a σ(h₁); la simulación confirma el resultado."}, {"tipo": "ojo", "items": ["Dividir por $n$ y no por $n-2$ en $s^2$.", "Interpretar $R^2=0{,}978$ como \"es lineal\": la curvatura se ve en los residuos.", "Sumar las incertidumbres en vez de combinarlas en cuadratura."]}]}], "quiz": [{"tema": "t1", "dif": 1, "q": "¿Qué magnitudes son continuas en el instante $t^*$ en que la cuerda queda tensa?", "op": ["La posición y la velocidad", "La posición y la aceleración", "La velocidad y la aceleración", "Solo la posición"], "ok": 0, "exp": "La cuerda no puede producir saltos bruscos de posición ni de velocidad. La aceleración sí cambia de golpe, de $g$ a $g-ku/m$."}, {"tema": "t1", "dif": 1, "q": "¿En qué punto del movimiento es máxima la aceleración (en magnitud)?", "op": ["En el punto más bajo", "En el instante de máxima velocidad", "En $t^*$, cuando la cuerda se tensa", "Al soltar el peso"], "ok": 0, "exp": "En el instante de máxima velocidad $a=0$. La aceleración crece en magnitud con la elongación y es máxima en el punto más bajo: $|a|_{\\max}=g\\sqrt{1+2kL/(mg)}$."}, {"tema": "t1", "dif": 2, "q": "En la etapa 2, ¿cuándo se cumple $a=0$ (máxima velocidad)?", "op": ["Cuando $u=mg/k$", "Cuando $u=u_{\\max}$", "Cuando $u=0$", "Cuando $t=t^*$"], "ok": 0, "exp": "$a=g-\\frac{k}{m}u=0$ da $u=mg/k=\\delta_e$. Ahí el peso y la fuerza elástica se igualan."}, {"tema": "t1", "dif": 2, "tipo": "num", "q": "Con $m=0{,}514$ kg, $k=25{,}72$ N/m y $L_c=0{,}77$ m, calcula $u_{\\max}$ en cm.", "ok": 77.9, "tol": 0.5, "exp": "$u_{\\max}=\\frac{mg}{k}\\left(1+\\sqrt{1+\\frac{2kL_c}{mg}}\\right)
