<style>

--acc-l:#1D3F7A;--acc:var(--acc-l);--acc-d:#8FB0EE;--pen-l:#B8430B;--pen-d:#F08A4B;--acc-soft:color-mix(in srgb,var(--acc) 9%,#fff);--side:#16284A;--side-line:#3B5582;--side-muted:#8FA3C7;--side-ink:#C9D3E6;--pen:var(--pen-l);--pen-soft:color-mix(in srgb,var(--pen) 9%,#fff);--bar-ok:#9DB6E8;--bar-bad:#F09A62;

--serif:"Source Serif 4",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--hand:Caveat,"Segoe Print","Comic Sans MS",cursive;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11141B;--grid:color-mix(in srgb,var(--acc-d) 9%,#11141B);--grid2:color-mix(in srgb,var(--acc-d) 17%,#11141B);--ink:#E7E9EE;--muted:#A3A9B6;--line:#2F3747;--card:#171B24;--head:#1E2431;--shadow:#0A0C11;--acc:var(--acc-d);--acc-soft:color-mix(in srgb,var(--acc-d) 16%,#171B24);--pen:var(--pen-d);--pen-soft:color-mix(in srgb,var(--pen-d) 14%,#171B24);--c2:#5BC293;--c3:#C18BE0;--c4:#9CA3AF}}
:root[data-theme="dark"]{--paper:#11141B;--grid:color-mix(in srgb,var(--acc-d) 9%,#11141B);--grid2:color-mix(in srgb,var(--acc-d) 17%,#11141B);--ink:#E7E9EE;--muted:#A3A9B6;--line:#2F3747;--card:#171B24;--head:#1E2431;--shadow:#0A0C11;--acc:var(--acc-d);--acc-soft:color-mix(in srgb,var(--acc-d) 16%,#171B24);--pen:var(--pen-d);--pen-soft:color-mix(in srgb,var(--pen-d) 14%,#171B24);--c2:#5BC293;--c3:#C18BE0;--c4:#9CA3AF}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}
/* papel */
body.p-cuadriculado{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body.p-milimetrado{background-image:linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:40px 40px,40px 40px,8px 8px,8px 8px}
body.p-puntos{background-image:radial-gradient(var(--grid2) 1.2px,transparent 1.3px);background-size:22px 22px}
body.p-rayado{background-image:linear-gradient(transparent 27px,var(--grid) 27px);background-size:100% 28px}
body.p-liso{background-image:none}
a{color:var(--acc)}
.serif{font-family:var(--serif)}.mono{font-family:var(--mono)}.pen{font-family:var(--hand);color:var(--pen);font-size:1.4rem;line-height:1.25}
.lbl{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.app{display:flex;min-height:100%}
/* barra lateral tipo plano */
.side{position:sticky;top:0;align-self:flex-start;width:290px;flex-shrink:0;height:100vh;height:100dvh;overflow-y:auto;padding:30px 22px calc(24px + env(safe-area-inset-bottom,0px));background:var(--side);background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:24px 24px;color:#fff;display:flex;flex-direction:column;gap:26px}
.side .lbl{color:var(--side-muted)}
.side h1{font:600 1.45rem/1.15 var(--serif);margin:4px 0 0}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;color:var(--side-ink);text-decoration:none;font:500 .95rem var(--sans);border:1px solid transparent;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{color:#fff;border-color:var(--side-line)}.nav.on{background:#fff;color:#111827}
.nav .mono{font-size:.75rem;width:46px;flex-shrink:0}
.dom{display:grid;grid-template-columns:30px minmax(0,1fr) 38px;gap:8px;align-items:center;font-size:.8rem;color:var(--side-ink);background:none;border:0;padding:2px 0;cursor:pointer;text-align:left;width:100%}
.dom .b{height:6px;background:rgba(255,255,255,.14)}.dom .b i{display:block;height:6px}
.rotulo{margin-top:auto;border-top:1px solid var(--side-line);border-left:1px solid var(--side-line);display:grid;grid-template-columns:1fr 1fr}
.rotulo div{padding:7px 9px;border-right:1px solid var(--side-line);border-bottom:1px solid var(--side-line);display:flex;flex-direction:column;gap:2px;font-size:.8rem;min-width:0}
.rotulo .w{grid-column:span 2}.rotulo .lbl{font-size:.6rem}
.side .tbtn{background:none;border:1px solid var(--side-line);color:var(--side-ink);font:500 .8rem var(--sans);min-height:40px;cursor:pointer}
.content{flex:1;min-width:0}
.mtop{display:none}
main{max-width:1120px;margin:0 auto;padding:48px 56px 80px;display:flex;flex-direction:column;gap:32px}
/* cabeceras */
.hdr{padding-bottom:22px;border-bottom:2px solid var(--ink);display:flex;flex-direction:column;gap:10px}
.hdr h2{margin:0;font:600 clamp(2rem,4.2vw,3.1rem)/1.06 var(--serif);letter-spacing:-.01em}
.hdr h2 .n{color:var(--acc);font-weight:400;margin-right:.35em}
.hdr p{margin:0;font-size:1.05rem;color:var(--muted);max-width:820px}
/* hoja: tarjeta con barra superior */
.sheet{background:var(--card);border:1px solid var(--ink)}
.sheet>.sh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--ink);background:var(--head)}
.sheet>.sh h3{margin:0;font:600 1.15rem var(--serif)}
.sheet>.sb{padding:18px 22px}
.sec{color:var(--acc);font:500 .85em var(--mono);margin-right:.6em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.dots{display:inline-flex;gap:4px}.dots i{width:9px;height:9px;border:1.5px solid var(--acc)}.dots i.f{background:var(--acc)}
.eqrow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dashed var(--line)}
.eqrow .num{font:.8rem var(--mono);color:var(--muted)}.eqrow .nt{font-size:.82rem;color:var(--muted)}
.mx{overflow-x:auto;overflow-y:hidden}
p{margin:.4em 0}ul,ol{margin:.35em 0;padding-left:1.3em}li{margin:.2em 0}
code{font-family:var(--mono);font-size:.88em;background:var(--acc-soft);padding:1px 5px}
/* capítulo */
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--ink);background:var(--card);color:var(--ink);min-height:40px;padding:0 14px;font:500 .85rem var(--sans);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--paper)}
.chap{display:block;padding-right:270px}
.chap>.blk{margin:0 0 24px}
.chap>.blk::after{content:"";display:table;clear:both}
.nota{float:right;clear:right;width:230px;margin:0 -270px 16px 0;font-size:.88rem;color:var(--muted);border-left:1px solid var(--ink);padding-left:14px}
.nota .lbl{display:block;margin-bottom:4px}
.lapiz{float:right;clear:right;width:240px;margin:0 -275px 12px 0;transform:rotate(-2.5deg)}
.h3{margin:0 0 8px;font:600 1.5rem/1.25 var(--serif)}
.defi{background:var(--card);border:1px solid var(--ink);padding:16px 20px}
.defi .nm{font-family:var(--serif);font-style:italic;font-size:1.05em}
.formula{background:var(--card);border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:14px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.formula .num{font:.9rem var(--mono);color:var(--muted)}
.ans{border:2px solid var(--acc);background:var(--card);padding:12px 16px;font-weight:500;overflow-x:auto}
.step{padding:6px 0 6px 14px;border-left:2px solid var(--line);margin:8px 0}.step b.t{font:600 .78rem var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);display:block}
.qed{text-align:right;font-size:1.2rem}
.ojo{border:2px solid var(--pen);background:var(--card);padding:14px 18px}.ojo .lbl{color:var(--pen)}
.code{background:#161A22;color:#E6E8EC;font:.9rem/1.55 var(--mono);padding:16px 18px;overflow-x:auto;white-space:pre;margin:0}
.code+.out{border:1px solid var(--ink);border-top:0;font:.85rem var(--mono);padding:10px 16px;white-space:pre;overflow-x:auto;background:var(--card)}
.gadget .sb{padding:22px}
.g-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}.g-row label{min-width:130px;font-size:.9rem}
.g-row input[type=range]{flex:1;min-width:150px;accent-color:var(--acc)}.g-row .v{font-family:var(--mono);min-width:64px}
.g-out{margin:10px 0;font-size:.95rem}
input[type=text],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--ink);padding:8px 10px;min-height:42px}
canvas{max-width:100%;display:block}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.93rem;background:var(--card)}
.tbl table{border:1px solid var(--ink)}th{font:600 .7rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--head);text-align:left;padding:9px 12px;border-bottom:1px solid var(--ink)}
td{padding:9px 12px;border-bottom:1px dashed var(--line);vertical-align:top}
.btn{border:1px solid var(--ink);background:var(--card);color:var(--ink);font:500 .92rem var(--sans);min-height:44px;padding:0 18px;cursor:pointer}
.btn:hover{background:var(--head)}.btn.pri{background:var(--ink);color:var(--paper)}.btn.pri:hover{opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.sp{justify-content:space-between}
.hide{display:none!important}
/* autoevaluación */
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;margin:8px 0;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font:.85rem var(--mono)}
.opt .tx{flex:1}.opt .tg{font-family:var(--hand);font-size:1.3rem;color:var(--pen)}
.opt.ok{border:2px solid var(--acc)}.opt.ok .bub{background:var(--acc);border-color:var(--acc);color:var(--card)}.opt.ok .tg{color:var(--acc)}
.opt.bad{border:2px solid var(--pen)}.opt.bad .bub{border-color:var(--pen);color:var(--pen)}
.big{font:400 3.6rem/1 var(--serif)}.big small{color:var(--muted);font-size:.6em}
.hbar{height:12px;border:1px solid var(--ink);background:var(--card)}.hbar i{display:block;height:100%;background:var(--acc);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 4px,transparent 4px 8px)}
.freq{display:grid;grid-template-columns:minmax(140px,230px) minmax(0,1fr) 30px;gap:14px;align-items:center;font-size:.9rem;margin:6px 0}
/* evaluaciones */
.exam{background:var(--card);border:1px solid var(--ink);box-shadow:6px 6px 0 var(--shadow)}
.exam .rot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;border-bottom:1px solid var(--ink)}
.exam .rot>div{padding:10px 18px;display:flex;flex-direction:column;gap:2px;font:.88rem var(--mono)}
.exam .rot>div+div{border-left:1px solid var(--ink)}.exam .rot .of{background:var(--acc-soft);color:var(--acc)}.exam .rot .pr{background:var(--pen-soft);color:var(--pen)}
.exam .en{padding:22px 26px 6px;font:1.18rem/1.6 var(--serif)}
.tabs{display:flex;border-bottom:1px solid var(--ink);margin:14px 26px 0;overflow-x:auto}
.tab{min-height:44px;padding:0 18px;font:500 .85rem var(--mono);cursor:pointer;margin-bottom:-1px;border:1px solid transparent;background:none;color:var(--muted);white-space:nowrap}
.tab.on{border-color:var(--ink);border-bottom-color:var(--card);background:var(--card);color:var(--ink)}
.pane{padding:18px 26px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 26px 18px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}.chk input{width:20px;height:20px;accent-color:var(--acc)}
/* responsive */
@media (max-width:1100px){.chap{padding-right:0}.nota,.lapiz{float:none;width:auto;margin:0 0 16px}.lapiz{transform:none}}
@media (max-width:900px){
.app{display:block}
.side{position:fixed;inset:0 auto 0 0;z-index:30;transform:translateX(-105%);transition:transform .2s;height:100%;width:min(300px,86vw);padding-top:calc(24px + env(safe-area-inset-top,0px))}
body.menu .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.mtop{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:var(--side);color:#fff}
.mtop button{background:none;border:1px solid var(--side-line);color:#fff;min-height:42px;padding:0 12px;font:500 .85rem var(--sans)}
.mtop b{font:600 1rem var(--serif);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:26px 16px 70px;gap:24px}
.grid2{grid-template-columns:minmax(0,1fr)}
.exam .rot{grid-template-columns:1fr 1fr}.exam .rot>div:first-child{grid-column:span 2;border-bottom:1px solid var(--ink)}.exam .rot>div:nth-child(2){border-left:0}
.exam .en,.pane{padding-left:16px;padding-right:16px}.tabs{margin:14px 16px 0}.foot{padding:8px 16px 16px}
.big{font-size:2.8rem}.freq{grid-template-columns:minmax(0,1fr) 90px 26px}
}
@media print{.side,.mtop,.btn,.chip,.subnav,.tabs{display:none!important}body{background:#fff!important}.chap{padding-right:0}.sheet,.exam{break-inside:avoid;box-shadow:none}}
